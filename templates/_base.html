  /* the two figures that matter, pinned to the corner of the bay in one plate */
  .bay__plate {
    display: grid;
    gap: 1px;
    padding: 7px 12px 8px;
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 16px;
    background: rgba(255, 255, 255, .08);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .bay__line { display: flex; align-items: baseline; gap: 10px; }
  .bay__key { min-width: 76px; color: rgba(255, 255, 255, .62); font-family: var(--mono); font-size: 11px; }
  .bay__line b { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .bay .stage { position: relative; padding: 6px 0 0; }
  .bay .stage figcaption { color: rgba(255, 255, 255, .62); }
  .bay .stage figcaption .stage__dims { color: #fff; }

  @media (max-width: 1020px) {
    /* one column: the answer moves up to sit right under the form, ahead of
       the bay — the main column dissolves so its parts can be reordered */
    .calc { display: flex; flex-direction: column; align-items: stretch; }
    .calc__main { display: contents; }
    .calc__side { position: static; order: 4; }
    .calc__stage { order: 5; }
  }

  .stage { display: flex; flex-direction: column; justify-content: center; padding: 12px 16px 16px; }
  .stage svg {
    display: block;
    width: 100%;
    height: auto;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage svg.is-turning { cursor: grabbing; }
  .stage figcaption { margin-top: 8px; color: var(--muted); font-size: 12.5px; font-weight: 700; text-align: center; }
  .stage figcaption .stage__dims {
    display: block;
    margin-top: 2px;
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 650;
  }

  table.breakdown { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.breakdown th, table.breakdown td {
    padding: 10px 6px;
    text-align: right;
    border-bottom: 1px solid var(--line-soft);
  }
  table.breakdown th { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  table.breakdown th:first-child, table.breakdown td:first-child { padding-left: 18px; text-align: left; }
  table.breakdown th:last-child, table.breakdown td:last-child { padding-right: 16px; }
  table.breakdown td { font-variant-numeric: tabular-nums; }
  table.breakdown td.id { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  /* In the table the pill is anchored by its left edge and opens to the right,
     into the quiet space at the start of the next column, so the figure it
     belongs to never moves. */
  table.breakdown .with-copy { position: relative; display: flex; align-items: center; justify-content: flex-end; padding-right: 26px; }
  table.breakdown .copy { --copy-size: 24px; position: absolute; left: calc(100% - 24px); top: 50%; translate: 0 -50%; opacity: .35; }
  table.breakdown .copy:hover, table.breakdown .copy.is-done, table.breakdown .copy.is-fail { z-index: 2; }
  table.breakdown tbody tr:hover .copy { opacity: .75; }
  table.breakdown .copy:hover, table.breakdown .copy:focus-visible, table.breakdown .copy.is-done { opacity: 1; }
  table.breakdown tbody tr:hover { background: var(--tint); }
  table.breakdown tr:last-child td { border-bottom: 0; }
  table.breakdown tfoot td { font-weight: 650; border-top: 1px solid var(--line); }

  .problem {
    margin: 18px 0 0;
    padding: 15px 18px;
    background: #fef6f5;
    border: 1px solid #f3cdc7;
    border-left: 3px solid #d24b3c;
    border-radius: 18px;
    color: #7f2b20;
    font-size: 14px;
  }

  /* Every button gives a little on a press: it swells while held and pops once
     on the click, so even the quickest tap shows it registered. The pop lives
     on a class set by script; :active alone would be over before a fast click
     had time to show. */
  .icon-btn, .trigger, .segmented__opt, .sorter__btn, .qty-step, .send-btn, .line__rm, .pick__drop, .reset, .topbar__link {
    transition-property: background-color, border-color, color, box-shadow, width, transform, translate, scale;
    transition-duration: .18s, .18s, .18s, .18s, .28s, .12s, .2s, .2s;
    transition-timing-function: ease, ease, ease, ease, var(--ease-out), var(--ease-out), var(--ease-out), var(--ease-out);
  }
  .icon-btn:active, .trigger:active, .segmented__opt:active, .sorter__btn:active,
  .send-btn:active, .line__rm:active, .pick__drop:active { transform: scale(1.05); }
  /* the steppers are the exception: they give under the finger */
  .qty-step:active { transform: scale(.9); }

  /* Under a fine pointer a pill grows a little and leans a hair toward the
     cursor — a uniform scale plus a couple of pixels of travel, so the pill
     stays a pill. Circular buttons sit this out. The lean is written by
     script from where the pointer is over the button. */
  @media (hover: hover) and (pointer: fine) {
    .trigger:hover, .sorter__btn:hover, .topbar__link:hover {
      translate: var(--lean-x, 0) var(--lean-y, 0);
      scale: 1.03;
    }
    .send-btn:hover { translate: var(--lean-x, 0) var(--lean-y, 0); scale: 1.05; }
    .segmented__opt:hover { scale: 1.04; }
    .qty-step:hover { scale: 1.08; }
    /* list rows grow evenly, text and all, and stay inside their list: the
       menus keep enough padding to absorb the growth */
    .row:hover { scale: 1.02; z-index: 1; }
  }
  .is-popping { animation: pop .22s var(--ease-out); }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
    .pick.is-editing::before { animation: none; }
    .compact__group { transition: none; }
    .toast { transition: opacity .18s ease; transform: none; }
    .is-ready .topbar__logo, .is-ready .topbar__nav,
    .is-ready .page-head h1, .is-ready .page-head .lead,
    .is-ready .workspace > div > :nth-child(2), .is-ready .workspace .foot-note,
    .is-ready .result { animation: fade-only .25s ease backwards; }
    .panel.is-mounted, .panel.is-out { animation: none; }
    .blank__art, .blank p { animation: none; }
    .flyout .card { opacity: 1; transform: none; }
    .line.is-entering, .line.is-leaving { animation: none; }
    .bg__blob, .bg__grid, .side-hero__art .art-arrow, .blank__art .art-glass, .blank__art .art-sparks { animation: none; }
    /* the fades stay — they still tell you what is new — the movement goes */
    .reveal { transform: none; }
    .reveal.is-in { transition: opacity .2s ease !important; }
    .icon-btn--send .send__ic, .copy .copy__ic, .copied-tag { transform: none !important; transition: opacity .15s ease !important; }
    .icon-btn--send.is-ringing::before { animation: none; }
    .card-slot > .card { animation: none; }
    .card-slot.is-pressed { animation: none; }
    .is-popping, .row.is-picked, .row.is-picked .row__tick { animation: none; }
    .pick.is-editing { animation: none; }
    .icon-btn:active, .trigger:active, .segmented__opt:active, .sorter__btn:active,
    .qty-step:active, .send-btn:active, .line__rm:active, .pick__drop:active { transform: none; }
    .icon-btn--clear .morph line { transition: none; }
    .icon-btn--clear, .btn-word { transition: opacity .18s ease !important; }
    .trigger:hover, .sorter__btn:hover, .topbar__link:hover, .send-btn:hover,
    .segmented__opt:hover, .qty-step:hover, .row:hover { translate: none; scale: none; }
    .send-btn.is-leaving .send-btn__rest { animation: fade-only .2s ease; }
    .send-btn__ic, .send-btn__words, .send-btn__done { transition: opacity .2s ease !important; transform: none !important; }
    .crow.is-pressed { animation: press-row-still .26s ease; }
  }
  /* the pressed row still flashes, it just does not move */
  @keyframes press-row-still {
    0%, 100% { background-color: transparent; }
    40% { background-color: var(--brand-soft); }
  }

  /* ---------- narrow screens ---------- */

  @media (max-width: 940px) {
    .app { padding: 10px 10px 0; gap: 10px; }
    .topbar { min-height: 58px; padding: 8px 10px; border-radius: 18px; flex-wrap: wrap; }
    .topbar__logo { width: 112px; }
    /* the pages drop to a second row; the logo and the two tools hold the first */
    .topbar__nav { order: 5; flex: 1 1 100%; margin-left: 0; }
    .topbar__link { padding: 8px 12px; font-size: 13px; }
    .workspace { padding: 60px 18px 64px; }
  }

  @media (max-width: 620px) {
    .line, .line-head {
      grid-template-columns: 22px 1fr 34px;
      grid-template-areas: "n pick rm" ". qty qty";
      row-gap: 8px;
    }
    .line__n { grid-area: n; }
    .line__pick { grid-area: pick; }
    .line__qty { grid-area: qty; }
    .line__rm { grid-area: rm; }
    .line-head span:nth-child(3) { display: none; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero__left { gap: 14px; }
    .thumb { width: 64px; height: 64px; border-radius: 13px; }
    .hero .who { text-align: left; max-width: 100%; }
    .hero .figure span:first-child { font-size: 48px; }
    .workspace { padding: 60px 14px 64px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="bg" aria-hidden="true">
    <span class="bg__grid"></span>
    <span class="bg__magnet"><span class="bg__blob bg__blob--a"></span></span>
    <span class="bg__blob bg__blob--b"></span>
    <span class="bg__blob bg__blob--c"></span>
  </div>

  <header class="topbar">
    {% if logo %}
    <a class="topbar__logo" href="https://bvsecurity.com" target="_blank" rel="noopener" aria-label="BV Security"><img src="{{ logo }}" alt="BV"></a>
    {% else %}
    <div class="topbar__mark">
      <span>
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="2" y="4.5" width="16" height="5" rx="1.4" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="10.5" width="16" height="5" rx="1.4" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="14.6" cy="7" r="1" fill="currentColor"/>
          <circle cx="14.6" cy="13" r="1" fill="currentColor"/>
        </svg>
      </span>
      <b>Warehouse Tools</b>
    </div>
    {% endif %}

    <nav class="topbar__nav">
      <a class="topbar__link{% if page_id == 'lookup' %} is-active{% endif %}" href="{{ links.home }}">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="5.6" stroke="currentColor" stroke-width="1.7"/>
          <path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Hard Drive Searcher
      </a>
      <a class="topbar__link{% if page_id == 'calculator' %} is-active{% endif %}" href="{{ links.calculator }}">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2.4 17.2 6 10 9.6 2.8 6 10 2.4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M2.8 10 10 13.6 17.2 10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M2.8 14 10 17.6 17.2 14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        Pallet Dimensions Calculator
      </a>
    </nav>

    <div class="tool" id="tool">
      <button class="icon-btn tool__btn" type="button" id="convToggle" aria-haspopup="dialog" aria-expanded="false" aria-label="Unit converter">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3.5 6.5h11l-3-3M16.5 13.5h-11l3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <button class="theme" type="button" id="themeToggle" aria-label="Switch to dark mode" aria-pressed="false">
      <span class="theme__track">
        <span class="theme__knob">
          <svg class="theme__sun" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg class="theme__moon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </span>
      </span>
    </button>
  </header>

  <main class="workspace">
    <div class="{% block shell_class %}workspace__inner{% endblock %}">

      <header class="page-head">
        <h1>{% block heading %}Hard Drive Weights{% endblock %}</h1>
        {% block subhead %}{% endblock %}
      </header>

      {% block content %}{% endblock %}

    </div>
  </main>

</div>

<script>
  const CATALOG = {{ catalog | tojson }};
  const UNIT = {{ weight_unit | tojson }};
  const PALLET = {{ pallet | tojson }};
  const PRODUCTS = CATALOG.flatMap(g => g.products);

  /* the width at which a sub-list stops being an indented block and starts
     floating beside its row — the same line the stylesheet switches on */
  const wide = () => window.matchMedia('(min-width: 900px)').matches;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function svgIcon(cls, size, path) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', cls);
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = path;
    return svg;
  }

  const CHEVRON = '<path d="M3.5 6L8 10.5 12.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  const CARET = '<path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';

  /* ---------- copy ---------- */

  const ICON_COPY = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<rect x="5.6" y="5.6" width="8.8" height="8.8" rx="1.8" stroke="currentColor" stroke-width="1.4"/>'
    + '<path d="M11 4.4V3.7A1.7 1.7 0 009.3 2H3.7A1.7 1.7 0 002 3.7v5.6A1.7 1.7 0 003.7 11h.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const ICON_DONE = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<path d="M3 8.6l3.1 3.1L13 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  async function writeClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (err) { /* fall through to the textarea route */ }

    // Plain http:// (an office PC on the LAN) has no clipboard API.
    try {
      const scratch = document.createElement('textarea');
      scratch.value = text;
      scratch.setAttribute('readonly', '');
      scratch.style.position = 'fixed';
      scratch.style.top = '-1000px';
      document.body.appendChild(scratch);
      scratch.select();
      const ok = document.execCommand('copy');
      scratch.remove();
      return ok;
    } catch (err) {
      return false;
    }
  }

  /* Rich text where the clipboard will take it, plain text where it won't;
     the plain version is always there for the fall-back route. */
  async function writeClipboardRich(text, html) {
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        await navigator.clipboard.write([new ClipboardItem({
          'text/plain': new Blob([text], { type: 'text/plain' }),
          'text/html': new Blob([html], { type: 'text/html' })
        })]);
        return true;
      }
    } catch (err) { /* fall through */ }
    return writeClipboard(text);
  }

  function copyButton(label, value, onCopy, word) {
    const button = el('button', 'copy');
    button.type = 'button';
    // both glyphs are always present; a class decides which one shows
    button.innerHTML = '<span class="copy__box">'
                     + '<span class="copy__ic copy__glyph">' + ICON_COPY + '</span>'
                     + '<span class="copy__ic copy__done">' + ICON_DONE + '</span></span>';
    const text = el('span', 'copy__label', word || ('Copy ' + label));
    button.appendChild(text);
    button.setAttribute('aria-label', 'Copy ' + label);

    // the pill's open width is whatever the label needs, measured when it is
    // about to be seen — the label changes after a copy, and so does the font
    function fit() {
      button.style.setProperty('--copy-w', (button.offsetHeight + text.scrollWidth) + 'px');
    }
    button.addEventListener('pointerenter', fit);
    button.addEventListener('focus', fit);

    function settle(ok) {
      text.textContent = ok ? 'Copied' : 'Copy failed — select it by hand';
      fit();
      button.classList.add(ok ? 'is-done' : 'is-fail');
      clearTimeout(button._revert);
      const hold = button.classList.contains('copy--brief') ? 900 : 1600;
      button._revert = setTimeout(() => {
        button.classList.remove('is-done', 'is-fail');
        // give the width transition its moment before the words change back
        setTimeout(() => { text.textContent = word || ('Copy ' + label); fit(); }, 240);
      }, hold);
    }

    button.addEventListener('click', async () => {
      const ok = await writeClipboard(value);
      if (ok && onCopy) onCopy();
      settle(ok);
    });

    // for a button built to stand in for one that was just pressed, when the
    // list it sat in has been redrawn underneath the press
    button.showDone = () => settle(true);

    return button;
  }

  /* Results that were just produced rise into place in one staggered run, all
     of them, so the list is whole from the moment it lands. The beat is capped:
     the twentieth row should not be waiting on the first nineteen. */
  function reveal(nodes) {
    const list = Array.from(nodes);
    if (!list.length) return;
    list.forEach(node => node.classList.add('reveal'));
    void list[0].offsetWidth;     // settle the hidden state, or there is nothing to transition from
    list.forEach((node, i) => {
      node.style.setProperty('--stagger', Math.min(i, 8) * 40 + 'ms');
      node.classList.add('is-in');
    });
  }

  /* One-shot press feedback on a freshly drawn element; the class leaves when
     the animation does, so the next press can play it again. */
  function press(node) {
    requestAnimationFrame(() => {
      node.classList.add('is-pressed');
      node.addEventListener('animationend', () => node.classList.remove('is-pressed'), { once: true });
    });
  }

  /* Every button pops once when clicked, rewound first so a quick second click
     plays it again. */
  const POPS = '.icon-btn, .trigger, .segmented__opt, .sorter__btn, .send-btn, .line__rm, .pick__drop';
  document.addEventListener('click', e => {
    const button = e.target.closest && e.target.closest(POPS);
    if (!button) return;
    button.classList.remove('is-popping');
    void button.offsetWidth;
    button.classList.add('is-popping');
    button.addEventListener('animationend', () => button.classList.remove('is-popping'), { once: true });
  });

  /* Where the pointer sits over a pill decides which way it leans: a couple of
     pixels toward the cursor, more on the big copy pill. Fine pointers only —
     a finger has nowhere to hover from. */
  const LEANS = '.trigger, .sorter__btn, .send-btn, .topbar__link';
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.addEventListener('pointermove', e => {
      const pill = e.target.closest && e.target.closest(LEANS);
      if (!pill) return;
      const box = pill.getBoundingClientRect();
      const reach = pill.classList.contains('send-btn') ? 4 : 2;
      const x = ((e.clientX - box.left) / box.width - .5) * 2 * reach;
      const y = ((e.clientY - box.top) / box.height - .5) * 2 * reach;
      pill.style.setProperty('--lean-x', x.toFixed(2) + 'px');
      pill.style.setProperty('--lean-y', y.toFixed(2) + 'px');
    });
    document.addEventListener('pointerout', e => {
      const pill = e.target.closest && e.target.closest(LEANS);
      if (!pill || pill.contains(e.relatedTarget)) return;
      pill.style.removeProperty('--lean-x');
      pill.style.removeProperty('--lean-y');
    });
  }

  /* The clear button: a cross that folds into a tick and widens to say what
     it did, then draws back. The width it needs is measured from the word the
     first time, since the font decides it. */
  const ICON_MORPH = '<svg class="morph" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">'
    + '<line class="morph__a" x1="4.6" y1="4.6" x2="13.4" y2="13.4"/>'
    + '<line class="morph__b" x1="13.4" y1="4.6" x2="4.6" y2="13.4"/></svg>';

  /* Gives a round button a word to open into. Returns a setter, since some
     buttons change what they are for — the plus that becomes a close. */
  function wordy(button, word) {
    button.classList.add('icon-btn--wordy');
    button.classList.remove('tip');           // the word replaces the tooltip
    delete button.dataset.tip;
    const span = el('span', 'btn-word', word);
    button.appendChild(span);
    const fit = () => button.style.setProperty('--word-w', (38 + span.scrollWidth) + 'px');
    button.addEventListener('pointerenter', fit);
    button.addEventListener('focus', fit);
    return text => { span.textContent = text; fit(); };
  }

  function clearControl(tip, word, onClick) {
    const button = el('button', 'icon-btn icon-btn--quiet icon-btn--clear');
    button.type = 'button';
    button.innerHTML = ICON_MORPH;
    button.setAttribute('aria-label', tip);
    const setWord = wordy(button, tip);

    button.addEventListener('click', () => {
      onClick();
      setWord(word);
      button.classList.add('is-done');
      clearTimeout(button._back);
      button._back = setTimeout(() => {
        button.classList.remove('is-done');
        setTimeout(() => setWord(tip), 300);
      }, 1500);
    });

    return button;
  }

  /* The edge fade must stop short of the scrollbar, whose width depends on the
     platform and its settings — measured, not assumed. */
  const workspace = document.querySelector('.workspace');
  function measureGutter() {
    workspace.style.setProperty('--sbw', (workspace.offsetWidth - workspace.clientWidth) + 'px');
  }
  measureGutter();
  window.addEventListener('resize', measureGutter);

  /* ---------- unit converter ---------- */

  const UNITS = {
    weight: { base: 'kg', list: [['kg', 'kg', 1], ['g', 'g', .001], ['lb', 'lb', .45359237], ['oz', 'oz', .028349523]] },
    length: { base: 'm', list: [['mm', 'mm', .001], ['cm', 'cm', .01], ['m', 'm', 1], ['in', 'in', .0254], ['ft', 'ft', .3048]] }
  };
  const factor = (kind, unit) => UNITS[kind].list.find(u => u[0] === unit)[2];
  const convert = (kind, value, from, to) => value * factor(kind, from) / factor(kind, to);
  /* enough digits to be useful, none that are noise */
  function fmt(n) {
    const abs = Math.abs(n);
    const places = abs >= 1000 ? 0 : abs >= 100 ? 1 : abs >= 1 ? 2 : 3;
    return String(parseFloat(n.toFixed(places)));
  }

  /* A unit menu of our own: a pill that opens a short list beneath it. Arrow
     keys move, Enter picks, Escape or a click elsewhere closes. */
  function unitPicker(kind, chosen) {
    const root = el('div', 'upick');
    const btn = el('button', 'upick__btn');
    btn.type = 'button';
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    const label = el('span', null, chosen);
    btn.appendChild(label);
    btn.appendChild(svgIcon('chev', '14', CHEVRON));
    root.appendChild(btn);

    const menu = el('div', 'upick__menu');
    menu.hidden = true;
    menu.setAttribute('role', 'listbox');
    root.appendChild(menu);
    let value = chosen;

    function render() {
      menu.innerHTML = '';
      UNITS[kind].list.forEach(([key, name]) => {
        const opt = el('button', 'upick__opt' + (key === value ? ' is-on' : ''));
        opt.type = 'button';
        opt.setAttribute('role', 'option');
        opt.setAttribute('aria-selected', String(key === value));
        opt.appendChild(el('span', null, name));
        if (key === value) { const t = el('span', 'tick'); t.innerHTML = ICON_DONE; opt.appendChild(t); }
        opt.addEventListener('click', e => { e.stopPropagation(); set(key); close(); btn.focus(); });
        menu.appendChild(opt);
      });
    }
    function set(key) { value = key; label.textContent = key; }
    function open() {
      render();
      menu.hidden = false;
      menu.classList.remove('is-mounted');
      void menu.offsetWidth;
      menu.classList.add('is-mounted');
      btn.setAttribute('aria-expanded', 'true');
      const on = menu.querySelector('.is-on') || menu.firstChild;
      if (on) on.focus();
    }
    function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }

    btn.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
    root.addEventListener('keydown', e => {
      if (menu.hidden) return;
      const opts = [...menu.querySelectorAll('.upick__opt')];
      const at = opts.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { opts[(at + 1) % opts.length].focus(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { opts[(at - 1 + opts.length) % opts.length].focus(); e.preventDefault(); }
      else if (e.key === 'Escape') { close(); btn.focus(); e.stopPropagation(); }
      else if (e.key === 'Tab') close();
    });
    document.addEventListener('click', e => { if (!menu.hidden && !root.contains(e.target)) close(); });

    return { root, get value() { return value; } };
  }

  function numInput(placeholder) {
    const input = el('input');
    input.type = 'number';
    input.inputMode = 'decimal';
    input.step = 'any';
    input.placeholder = placeholder;
    return input;
  }

  const ICON_TO = '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 6.5h11l-3-3M16.5 13.5h-11l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function resultLine(name, value, unit, fromText, copyLabel) {
    const box = el('div', 'conv__result');
    box.appendChild(el('div', 'name', name));
    const line = el('div', 'line');
    line.appendChild(el('span', 'from', fromText));
    const arrow = el('span', 'arrow');
    arrow.innerHTML = ICON_TO;
    line.appendChild(arrow);
    const to = el('span', 'to');
    to.appendChild(el('b', null, value));
    to.appendChild(el('small', null, unit));
    line.appendChild(to);
    box.appendChild(line);
    const cp = copyButton(copyLabel, value + ' ' + unit, null, 'Copy Converted ' + name);
    cp.classList.add('copy--brief');
    box.appendChild(cp);
    return box;
  }

  function buildConverter() {
    const root = el('div', 'conv');
    root.id = 'conv';
    root.hidden = true;
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'Unit converter');

    root.appendChild(el('div', 'conv__title', 'Unit Converter'));

    const TABS = [['weight', 'Weight'], ['length', 'Length'], ['box', 'Box']];
    const tabs = el('div', 'conv__tabs');
    tabs.setAttribute('role', 'tablist');
    const thumb = el('span', 'conv__thumb');
    tabs.appendChild(thumb);
    const panes = {};
    let active = 'weight';

    const tabButtons = TABS.map(([key, label], i) => {
      const b = el('button', 'conv__tab' + (i === 0 ? ' is-on' : ''), label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.addEventListener('click', () => show(key));
      tabs.appendChild(b);
      return b;
    });
    root.appendChild(tabs);

    function show(key) {
      active = key;
      const i = TABS.findIndex(([k]) => k === key);
      thumb.style.transform = 'translateX(' + (i * 100) + '%)';
      tabButtons.forEach((b, j) => { b.classList.toggle('is-on', j === i); b.setAttribute('aria-selected', String(j === i)); });
      Object.entries(panes).forEach(([k, pane]) => { pane.hidden = k !== key; });
      const first = panes[key].querySelector('input');
      if (first) first.focus();
    }

    /* one value, one unit each side */
    function simplePane(kind, from, to, placeholder) {
      const pane = el('div', 'conv__pane');
      const row = el('div', 'conv__row');
      const input = numInput(placeholder);
      const selFrom = unitPicker(kind, from);
      const arrow = el('span', 'conv__arrow');
      arrow.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const selTo = unitPicker(kind, to);
      row.append(input, selFrom.root, arrow, selTo.root);
      pane.appendChild(row);
      const go = el('button', 'conv__go', 'Convert');
      go.type = 'button';
      pane.appendChild(go);
      const out = el('div', 'conv__out');
      pane.appendChild(out);

      pane.run = () => {
        const v = parseFloat(input.value);
        out.innerHTML = '';
        if (!Number.isFinite(v)) { input.focus(); return; }
        const r = convert(kind, v, selFrom.value, selTo.value);
        out.appendChild(resultLine(kind === 'weight' ? 'Weight' : 'Length', fmt(r), selTo.value, fmt(v) + ' ' + selFrom.value, kind));
      };
      go.addEventListener('click', pane.run);
      return pane;
    }

    /* a carton: three sides in one unit, a weight in another */
    function boxPane() {
      const pane = el('div', 'conv__pane');
      pane.appendChild(el('div', 'conv__label', 'Length × Width × Height'));
      const dims = el('div', 'conv__row conv__row--dims');
      const L = numInput('L'), W = numInput('W'), H = numInput('H');
      dims.append(L, W, H);
      pane.appendChild(dims);
      const drow = el('div', 'conv__row conv__row--units');
      const dFrom = unitPicker('length', 'mm');
      const dArrow = el('span', 'conv__arrow');

     gathering speed, then settling — and drifts home when it leaves or

  const magnet = document.querySelector('.bg__magnet');
  const magnetBlob = magnet && magnet.querySelector('.bg__blob');
  if (magnet && window.matchMedia('(hover: hover) and (pointer: fine)').matches
      && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const CANVAS = '.app, .workspace, .workspace__inner, .bg, .bg__grid, .bg__blob, .bg__magnet, .page-head, .page-head h1, .lead, .foot-note, .calc, .calc__main, .calc__stage, .calc__side, .result, .result__body, .toolbar';
    let want = { x: 0, y: 0 }, pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 }, pulling = false, ticking = false;
    function tick() {
      // a soft spring: force toward the target, heavily damped
      const k = .0022, damp = .90;
      vel.x = (vel.x + (want.x - pos.x) * k) * damp;
      vel.y = (vel.y + (want.y - pos.y) * k) * damp;
      pos.x += vel.x; pos.y += vel.y;
      magnet.style.transform = 'translate(' + pos.x.toFixed(1) + 'px,' + pos.y.toFixed(1) + 'px)';
      const still = Math.abs(vel.x) + Math.abs(vel.y) < .05 && Math.abs(want.x - pos.x) + Math.abs(want.y - pos.y) < 1;
      if (still && !pulling) { ticking = false; return; }
      requestAnimationFrame(tick);

    function wake() { if (!ticking) { ticking = true; requestAnimationFrame(tick); } }

      const b = magnetBlob.getBoundingClientRect();
      // where the light's centre would be without the pull, then the offset to the pointer
      const cx = b.left + b.width / 2 - pos.x, cy = b.top + b.height / 2 - pos.y;
      want = { x: e.clientX - cx, y: e.clientY - cy };

  /* What the typed text is aiming at.
       digits (optionally with "tb")  -> capacity, so 8 finds both 8 TB drives
       something a Product ID starts with -> Product IDs only
       something a SKU starts with        -> SKUs only
       anything else                      -> ID, SKU and item together */
  function search_(query) {
    const q = query.trim().toLowerCase();
    if (!q) return PRODUCTS.slice();

    const asCapacity = q.match(/^(\d+)\s*(tb)?$/);
    if (asCapacity) {
      const digits = asCapacity[1];
      const exact = parseInt(digits, 10);
      return PRODUCTS
        .filter(p => String(p.capacity) === digits || String(p.capacity).startsWith(digits))
        .sort((a, b) => (a.capacity === exact ? 0 : 1) - (b.capacity === exact ? 0 : 1)
                     || a.capacity - b.capacity
                     || a.is_pro - b.is_pro);
    }

    const startsAnId = PRODUCTS.some(p => p.product_id.toLowerCase().startsWith(q));
    const startsASku = PRODUCTS.some(p => p.sku.toLowerCase().startsWith(q));

    if (startsAnId && !startsASku) return PRODUCTS.filter(p => p.product_id.toLowerCase().includes(q));
    if (startsASku && !startsAnId) return PRODUCTS.filter(p => p.sku.toLowerCase().includes(q));

    return PRODUCTS.filter(p =>
      (p.item + ' ' + p.sku + ' ' + p.product_id).toLowerCase().includes(q));
  }

      // its box, fixed children included — so its box, less the scrollbar and
      // the fade bands, is the real limit. Sideways the sub-list prefers the
      // row's right, takes the left if that is the side with room, and only

      const ws = workspace.getBoundingClientRect();

      const box = (menu.closest('.composer__list, .panel') || menu).getBoundingClientRect();
      const minY = Math.max(box.top + 6, ws.top + edge);
      const maxY = Math.min(box.bottom - 6, ws.bottom - edge);

      let left = anchor.right;
      if (left + width > maxX) {
        const onLeft = anchor.left - width - 8;
        left = onLeft >= minX ? onLeft : Math.max(minX, maxX - width);
      }
      const top = Math.max(minY, Math.min(anchor.top - 8, maxY - height));

      flyout.style.left = (left - origin.left) + 'px';
      flyout.style.top = (top - origin.top) + 'px';
    }

    /* A sub-list joins the layout, gets placed, and only then is let go, so the
       unfold has somewhere to travel from. Folding away keeps the node around
       until the transition has played out. */
    const FLYOUT_EXIT = 270;

    function showFlyout(li) {
      const flyout = li.querySelector('.flyout');
      if (!flyout) return;

      clearTimeout(flyout._exit);
      flyout.classList.add('is-mounted');
      placeFlyout(li);

      if (flyout._enter) cancelAnimationFrame(flyout._enter);
      flyout._enter = requestAnimationFrame(() => {
        flyout._enter = null;
        flyout.classList.add('is-in');
      });
    }

    function hideFlyout(li, now) {
      const flyout = li.querySelector('.flyout');
      if (!flyout) return;

      if (flyout._enter) {
        cancelAnimationFrame(flyout._enter);
        flyout._enter = null;
      }
      flyout.classList.remove('is-in');
      clearTimeout(flyout._exit);

      if (now) { flyout.classList.remove('is-mounted'); return; }
      flyout._exit = setTimeout(() => flyout.classList.remove('is-mounted'), FLYOUT_EXIT);
    }

    function toggleGroup(li) {
      const open = li.classList.toggle('is-open');
      li.querySelector('.row').setAttribute('aria-expanded', String(open));
      if (open) {
        showFlyout(li);
        menu.querySelectorAll('li.group.is-open').forEach(other => {
          if (other !== li) closeGroup(other);
        });
      } else {
        hideFlyout(li);
      }
    }

    function closeGroup(li, now) {
      li.classList.remove('is-open');
      const row = li.querySelector('.row');
      if (row) row.setAttribute('aria-expanded', 'false');
      hideFlyout(li, now);
    }

    /* open / close */

    /* The floating panel unfolds and folds the way the composer bubble does, so
       it has to outlive its own closing — [hidden] goes back on at the end. */
    const PANEL_EXIT = 190;

    function showPanel() {
      clearTimeout(panel._exit);
      panel.classList.remove('is-out');
      panel.hidden = false;
      // rewind, so reopening mid-close still plays the unfold
      panel.classList.remove('is-mounted');
      void panel.offsetWidth;
      panel.classList.add('is-mounted');
    }

    function hidePanel() {
      if (panel.hidden) return;
      panel.classList.remove('is-mounted');
      panel.classList.add('is-out');
      clearTimeout(panel._exit);
      panel._exit = setTimeout(() => {
        panel.hidden = true;
        panel.classList.remove('is-out');
      }, PANEL_EXIT);
    }

    function open(focusSearch) {
      showing = true;
      if (composerMode) root.classList.add('is-open');
      else showPanel();
      if (trigger) trigger.setAttribute('aria-expanded', 'true');
      renderMenu(search.value);
      if (focusSearch) search.focus();
      opts.onOpen();
    }

    function close(refocus) {
      showing = false;
      if (composerMode) root.classList.remove('is-open');
      else hidePanel();
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      // Every group, not just the pinned ones: a sub-list floating beside the
      // menu sits outside its overflow, so one left open on hover would be
      // stranded on screen after the list folds away.
      menu.querySelectorAll('li.group').forEach(li => closeGroup(li, true));
      if (refocus) {
        // focusing the field would otherwise trip the handler that reopens it
        settling = true;
        (trigger || search).focus();
        settling = false;
      }
      opts.onClose(picking);
      picking = false;
    }

    function select(productId) {
      const product = PRODUCTS.find(p => p.product_id === productId);
      if (!product) return;
      selectedId = productId;
      if (triggerLabel) {
        triggerLabel.textContent = opts.label(product);
        triggerLabel.className = 'picked';
      }
      if (!opts.stayOpen) search.value = '';
      picking = true;

      // the row swells and takes its tick, then the list folds — or, when it
      // is staying up for more picks, redraws so the row shows its new state
      const row = menu.querySelector('.row[data-product-id="' + productId + '"]');
      if (row) {
        row.classList.add('is-picked');
        if (!row.querySelector('.row__tick')) row.appendChild(tickBadge());
      }
      // focus moves now, as the close used to move it, so wherever onSelect
      // sends it afterwards is where it stays
      settling = true;
      (trigger || search).focus();
      settling = false;

      opts.onSelect(product);
      setTimeout(() => {
        if (!showing) return;
        if (opts.stayOpen) renderMenu(search.value);
        else close(false);
      }, PICK_HOLD);
    }

    // put a product back in place quietly, for when a pick has to be undone
    function restore(productId) {
      const product = productId && PRODUCTS.find(p => p.product_id === productId);
      if (!product) { clear(); return; }
      selectedId = productId;
      if (triggerLabel) {
        triggerLabel.textContent = opts.label(product);
        triggerLabel.className = 'picked';
      }
    }

    function clear() {
      selectedId = null;
      if (triggerLabel) {
        triggerLabel.textContent = opts.placeholder;
        triggerLabel.className = 'placeholder';
      }
      search.value = '';
      renderMenu('');
    }

    if (trigger) {
      trigger.addEventListener('click', () => showing ? close(false) : open(true));
    }

    // a pointer heading for the buttons or the field leaves any hover-opened
    // sub-list behind
    [bar, search].forEach(node => node && node.addEventListener('pointerenter', () => {
      menu.querySelectorAll('li.group:not(.is-open)').forEach(li => hideFlyout(li));
    }));

    // the search bar opens the same menu
    search.addEventListener('focus', () => { if (!showing && !settling) open(false); });
    search.addEventListener('click', () => { if (!showing) open(false); });
    search.addEventListener('input', () => {
      if (!showing) open(false);
      renderMenu(search.value);
    });

    // Enter in the search bar takes the first match — but only when something
    // was typed, otherwise it would silently grab whatever sits at the top
    search.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (opts.stayOpen) {
        // Enter is how a run of picks ends; typed text takes its first match
        // on the way out, unless that match is already on the list
        const first = search.value.trim() ? rows()[0] : null;
        if (first && !first.classList.contains('is-taken')) first.click();
        if (showing) close(true);
        e.preventDefault();
        e.stopPropagation();       // or the list handler would open it right back
        return;
      }
      if (!search.value.trim()) return;
      const first = rows()[0];
      if (first) { first.click(); e.preventDefault(); }
    });

    document.addEventListener('click', e => {
      // a target already gone from the page was inside something we redrew
      // on that same click (a chip's ×) — not a click outside
      if (showing && e.target.isConnected && !root.contains(e.target)) close(false);
    });

    // a scrolled menu would leave an open flyout behind
    menu.addEventListener('scroll', () => {
      const openLi = menu.querySelector('li.group.is-open') || menu.querySelector('li.group:hover');
      if (openLi) placeFlyout(openLi);
    });

    /* keyboard */

    function rows() {
      return Array.from(menu.querySelectorAll('button.row')).filter(row => {
        const flyout = row.closest('.flyout');
        return !flyout || flyout.closest('li.group').classList.contains('is-open');
      });
    }

    function step(dir) {
      const list = rows();
      if (!list.length) return;
      const at = list.indexOf(document.activeElement);
      const next = at === -1 ? (dir > 0 ? 0 : list.length - 1) : (at + dir + list.length) % list.length;

      // focus without the browser's instant jump, then ease it into view
      list[next].focus({ preventScroll: true });
      list[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function onKeyDown(e) {
      if (e.key === 'Escape') {
        const openGroup = document.activeElement.closest?.('li.group.is-open');
        if (openGroup && document.activeElement.closest('.flyout')) {
          closeGroup(openGroup);
          openGroup.querySelector('.row').focus();
        } else {
          close(true);
        }
        e.preventDefault();
        return;
      }

      if (!showing) {
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          open(false);
          // land on the first row straight away, so one press is enough
          if (e.key === 'ArrowDown') step(1);
          e.preventDefault();
        }
        return;
      }

      if (e.key === 'ArrowDown') { step(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { step(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') {
        const li = document.activeElement.closest?.('li.group');
        if (li && !li.classList.contains('is-open')) toggleGroup(li);
        const first = li && li.querySelector('.flyout .row');
        if (first) { first.focus(); e.preventDefault(); }
      }
      else if (e.key === 'ArrowLeft') {
        const li = document.activeElement.closest?.('li.group.is-open');
        if (li) { closeGroup(li); li.querySelector('.row').focus(); e.preventDefault(); }
      }
    }

    root.addEventListener('keydown', onKeyDown);

    // Focus can end up outside the list — the page body after a re-render, say —
    // and then arrow keys would go nowhere. While the list is open, pick them up
    // from the document too, unless the listener above already has them.
    document.addEventListener('keydown', e => {
      if (!showing) return;
      const here = document.activeElement;
      if (here && here !== document.body && root.contains(here)) return;
      onKeyDown(e);
    });

    menu.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const row = document.activeElement;
        if (row.classList?.contains('row')) {
          row.click();
          e.preventDefault();
          // the pick already closed the list; without this the same keystroke
          // reaches the handler that opens a closed list and reopens it
          e.stopPropagation();
        }
        return;
      }

      // typing while a row is focused should carry on filtering, not fall on the floor
      if (e.key === 'Backspace' || (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey)) {
        search.focus();
      }
    });

    // a sub-list placed while its list was still unfolding was measured
    // against a box that had not reached its size yet; settle it once the
    // list has
    const replace = () => menu.querySelectorAll('li.group').forEach(li => {
      const f = li.querySelector('.flyout');
      if (f && f.classList.contains('is-mounted')) placeFlyout(li);
    });
    panel.addEventListener('animationend', replace);
    panel.addEventListener('transitionend', replace);

    window.addEventListener('resize', () => {
      menu.querySelectorAll('li.group.is-open').forEach(placeFlyout);
    });

    renderMenu('');

    return {
      root,
      bar,
      field: search,
      open,
      close,
      clear,
      restore,
      takeFirst() {
        if (!search.value.trim()) return false;
        const first = rows()[0];
        if (!first || first.classList.contains('is-taken')) return false;
        first.click();
        return true;
      },
      get isOpen() { return showing; },
      refresh() { if (showing) renderMenu(search.value); },
      get selected() { return selectedId ? PRODUCTS.find(p => p.product_id === selectedId) : null; }
    };
  }

  function round2(n) { return Math.round(n * 100) / 100; }
</script>
