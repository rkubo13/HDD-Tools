<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hard Drive Weights{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fetched without blocking the first paint: a stylesheet in the head holds the
     page blank until it answers, and over a LAN — or with no route out to the
     internet at all — that wait is the second or two before anything shows up.
     The page draws immediately in the fallback face and swaps when this lands. -->
<link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Instrument+Sans:wght@400;500;600&display=swap">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Instrument+Sans:wght@400;500;600&display=swap">
</noscript>
<script>
  /* The page's pieces arrive at different times over a slow link — text first,
     the search bubble only once the script at the foot has run, the logo when
     its bytes land. Rather than each popping in as it comes, everything holds
     back and enters together, once the page is built and the logo is in. A
     cap keeps a slow image from holding the page hostage. Without script the
     class is never added and nothing is held. */
  try {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
  document.documentElement.classList.add('is-loading');
  (function () {
    var shown = false;
    function show() {
      if (shown) return;
      shown = true;
      document.documentElement.classList.remove('is-loading');
      document.documentElement.classList.add('is-ready');
    }
    function whenBuilt() {
      var logo = document.querySelector('.topbar__logo img');
      var image = logo && !logo.complete
        ? new Promise(function (r) { logo.addEventListener('load', r, { once: true }); logo.addEventListener('error', r, { once: true }); })
        : Promise.resolve();
      // the face too, so the text is not redrawn halfway through its entrance
      var face = document.fonts ? document.fonts.ready : Promise.resolve();
      var cap = new Promise(function (r) { setTimeout(r, 900); });
      Promise.race([Promise.all([image, face]), cap]).then(function () {
        // two frames: the first lets the held state actually reach the screen,
        // so the entrance has something to rise out of instead of snapping in
        requestAnimationFrame(function () { requestAnimationFrame(show); });
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenBuilt);
    else whenBuilt();
    setTimeout(show, 4000);
  })();
</script>
<style>
  :root {
    --brand: #6f2dd9;
    --brand-deep: #5a1fb5;
    --brand-soft: #f1e9fd;
    --brand-line: #ddcdf8;
    --ink: #17121f;
    --ink-soft: #3d3550;
    --muted: #6f6885;
    --page: #f3f1f8;
    --card: #ffffff;
    --line: #e9e5f2;
    --line-soft: #f1eef7;
    --tint: #f5f3fa;
    --tint-2: #ede9f5;
    --tint-3: #e3ddf0;
    --ok-soft: #e2f4ec;
    --canvas: linear-gradient(152deg, #3b1284 0%, #6a26c9 46%, #a03be0 100%);
    --accent: #ff4900;
    --ok: #00996a;
    --warn: #9a5b00;
    /* the font loads from Google; the stack under it carries the same feel offline */
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", sans-serif;
    /* IDs and SKUs: a sans built for small sizes, letter-spaced a touch, rather
       than a typewriter face that goes coarse when it gets small */
    --mono: "Instrument Sans", "Manrope", system-ui, sans-serif;
    --lift: 0 10px 30px -18px rgba(28, 33, 74, .28), 0 2px 8px -5px rgba(28, 33, 74, .10);
    --lift-high: 0 26px 56px -26px rgba(28, 33, 74, .38), 0 4px 14px -8px rgba(28, 33, 74, .14);
    /* one bubble radius for the big surfaces, stepped down for what sits inside */
    --r-bubble: 28px;
    --r-card: 24px;
    --r-inner: 16px;
    --ease-bubble: cubic-bezier(.32, .72, .35, 1);
    /* strong ease-out for anything entering or answering a press */
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  }

  /* Dark: the canvas dims to a deep violet, the cards turn charcoal, and the
     brand lifts to a lighter lilac so it still reads on them. Everything else
     follows the tokens. */
  html[data-theme="dark"] {
    --brand: #b08cff;
    --brand-deep: #c9b0ff;
    --brand-soft: #2c2050;
    --brand-line: #4a3684;
    --ink: #f3eefb;
    --ink-soft: #d3cbe6;
    --muted: #a198bb;
    --page: #0f0a1a;
    --card: #1c1626;
    --line: #3f3657;
    --line-soft: #332b47;
    --tint: #2c2541;
    --tint-2: #372f4e;
    --tint-3: #43395f;
    --ok: #4fd39c;
    --ok-soft: #173327;
    --canvas: linear-gradient(152deg, #120725 0%, #24104a 46%, #3a165c 100%);
    --lift: 0 10px 30px -18px rgba(0, 0, 0, .6), 0 2px 8px -5px rgba(0, 0, 0, .4);
    --lift-high: 0 26px 56px -26px rgba(0, 0, 0, .7), 0 4px 14px -8px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  html[data-theme="dark"] .bg { opacity: .55; }
  html[data-theme="dark"] .composer__field::placeholder, html[data-theme="dark"] .search::placeholder,
  html[data-theme="dark"] .trigger .placeholder { color: #7d7595; }
  html[data-theme="dark"] .stat__icon--amber { background: #3a2410; color: #ffb066; }
  html[data-theme="dark"] .stat__icon--slate { background: #232c44; color: #9fb4e6; }
  html[data-theme="dark"] .stat__icon--kraft { background: #352718; color: #d9a976; }
  html[data-theme="dark"] .problem { background: #3a1c1a; border-color: #5e2a26; color: #ffb4a8; }
  html[data-theme="dark"] .blank__art { background: radial-gradient(circle at 50% 32%, #2d2542 0%, #241d38 54%, #1e1830 100%); }
  html[data-theme="dark"] .thumb { background: #f3f1f8; }
  html[data-theme="dark"] .side-hero__cta .send-btn .send-btn__done { color: #12784a; }
  html[data-theme="dark"] .icon-btn { border-color: #4d4368; }
  html[data-theme="dark"] .icon-btn--quiet { border-color: transparent; }
  html[data-theme="dark"] .icon-btn--quiet:hover, html[data-theme="dark"] .icon-btn--wordy:hover { border-color: #4d4368; }
  /* the logo's white plate turns to black and is screened away, so the mark
     sits on the dark card in its own colours, lightened */
  html[data-theme="dark"] .topbar__logo img { filter: invert(1) hue-rotate(180deg) brightness(1.15); mix-blend-mode: screen; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  /* The page itself never scrolls: the workspace does, so the fade at its top
     and bottom edges can be drawn against its own box. */
  html, body { height: 100%; overflow: hidden; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- shell ---------- */

  /* The canvas is the brand itself: Western Digital's purple, deep violet at
     one corner running to magenta at the other, with two soft lights drifting
     across it on a slow loop — transform only, so it costs the page nothing.
     A faint floor grid over it is the one nod to the warehouse. The shell
     never scrolls; the cards do. */
  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100vh;
    height: 100dvh;
    padding: 14px 14px 0;
    overflow: hidden;
    background: var(--canvas);
    isolation: isolate;
    transition: background .4s ease;
  }
  .bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  /* The floor grid creeps diagonally, one tile every ninety seconds, so it is
     only ever noticed as a change and never as movement. It and the lights
     speed up while the page is scrolled and ease back after. */
  .bg__grid {
    position: absolute;
    inset: -48px 0 0 -48px;
    background-image:
      linear-gradient(rgba(255, 255, 255, .13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .13) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 40%, transparent 92%);
    mask-image: radial-gradient(ellipse at 50% 40%, #000 40%, transparent 92%);
    will-change: transform;
    animation: creep 14s linear infinite;
  }
  @keyframes creep {
    from { transform: translate(0, 0); }
    to { transform: translate(48px, 48px); }
  }
  .bg__blob {
    position: absolute;
    width: 62vmax;
    height: 62vmax;
    border-radius: 50%;
    will-change: transform;
  }
  /* the bright light rides in a wrapper the pointer can pull on, so its own
     drift and the pull never fight over one transform */
  .bg__magnet { position: absolute; inset: 0; will-change: transform; }
  .bg__blob--a {
    top: -28vmax;
    left: -18vmax;
    background: radial-gradient(circle, rgba(201, 130, 255, .7) 0%, rgba(201, 130, 255, 0) 62%);
    animation: drift-a 17s ease-in-out infinite alternate;
  }
  .bg__blob--b {
    right: -22vmax;
    bottom: -30vmax;
    background: radial-gradient(circle, rgba(255, 110, 199, .58) 0%, rgba(255, 110, 199, 0) 62%);
    animation: drift-b 22s ease-in-out infinite alternate;
  }
  .bg__blob--c {
    top: 30%;
    left: 40%;
    width: 40vmax;
    height: 40vmax;
    background: radial-gradient(circle, rgba(76, 20, 150, .5) 0%, rgba(76, 20, 150, 0) 64%);
    animation: drift-c 19s ease-in-out infinite alternate;
  }
  @keyframes drift-a {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(30vmax, 18vmax) scale(1.18); }
  }
  @keyframes drift-b {
    from { transform: translate(0, 0) scale(1.05); }
    to { transform: translate(-28vmax, -22vmax) scale(.92); }
  }
  @keyframes drift-c {
    from { transform: translate(-22vmax, 10vmax); }
    to { transform: translate(22vmax, -12vmax); }
  }

  /* the bar floats as a card of its own, logo left, the two pages as pills */
  .topbar {
    position: relative;
    z-index: 3;      /* its popovers must clear the workspace below */
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 66px;
    padding: 10px 12px 10px 14px;
    background: var(--card);
    border-radius: 22px;
    box-shadow: 0 18px 40px -28px rgba(20, 8, 50, .6);
  }
  .topbar__logo { display: block; flex: none; width: 132px; padding: 4px 6px; }
  /* the box is sized from the artwork's proportions before a byte of it has
     arrived, so the space is never seen empty and never jumps */
  .topbar__logo img { display: block; width: 100%; height: auto; aspect-ratio: 440 / 147; }
  .topbar__mark {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    color: var(--ink);
  }
  .topbar__mark span { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--brand-soft); color: var(--brand); }
  .topbar__mark b { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
  .topbar__nav { display: flex; align-items: center; gap: 6px; margin-left: 10px; }
  .topbar__link {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 16px;
    border-radius: 999px;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
  }
  .topbar__link svg { flex: none; opacity: .8; }
  .topbar__link:hover { background: var(--tint); color: var(--ink); }
  .topbar__link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .topbar__link.is-active { background: var(--ink); color: var(--card); }
  .topbar__link.is-active svg { opacity: 1; }
  /* Light and dark, as a switch: the knob slides across and the sun turns
     into the moon as it goes. It is the last thing on the bar. */
  .tool { position: relative; margin-left: auto; }
  .theme {
    margin-left: 0;
    flex: none;
    padding: 0;
    background: none;
    border: 0;
    cursor: pointer;
  }
  .theme:focus-visible { outline: none; }
  .theme:focus-visible .theme__track { box-shadow: 0 0 0 3px var(--brand-soft); }
  .theme__track {
    position: relative;
    display: block;
    width: 52px;
    height: 30px;
    border-radius: 999px;
    background: var(--tint-2);
    border: 1px solid var(--line);
    transition: background .3s ease, border-color .3s ease;
  }
  .theme__knob {
    position: absolute;
    top: 3px;
    left: 3px;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--card);
    color: #c2550a;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
    transition: transform .3s var(--ease-out), color .3s ease;
  }
  .theme__knob svg { grid-area: 1 / 1; transition: opacity .2s var(--ease-out), transform .3s var(--ease-out); }
  .theme__moon { opacity: 0; transform: rotate(-60deg) scale(.6); }
  .theme[aria-pressed="true"] .theme__track { background: #3d2f66; border-color: #4a3684; }
  .theme[aria-pressed="true"] .theme__knob { transform: translateX(22px); color: #cdb8ff; }
  .theme[aria-pressed="true"] .theme__sun { opacity: 0; transform: rotate(60deg) scale(.6); }
  .theme[aria-pressed="true"] .theme__moon { opacity: 1; transform: none; }

  .workspace {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: 58px 22px 72px;
    /* Always leaves room for the scrollbar, needed or not. Otherwise a view
       that fits on screen drops the bar and everything centred slides sideways
       by its width — visible wherever scrollbars take up space, which is
       Windows and any Mac set to show them always. */
    overflow-y: scroll;
    /* applies to anchor jumps and scrollIntoView, not the wheel */
    scroll-behavior: smooth;

    /* Whatever reaches the top or bottom edge fades into the shell behind it:
       cards, bubbles and the rows inside them, all as one, so nothing is ever
       cut off by the edge. The second mask keeps the scrollbar column solid —
       its width is measured by script, since the fade must not touch it. */
    --edge: 56px;
    --sbw: 0px;
    -webkit-mask-image:
      linear-gradient(to bottom, transparent, #000 var(--edge), #000 calc(100% - var(--edge)), transparent),
      linear-gradient(#000, #000);
    -webkit-mask-size: calc(100% - var(--sbw)) 100%, var(--sbw) 100%;
    -webkit-mask-position: left top, right top;
    -webkit-mask-repeat: no-repeat;
    mask-image:
      linear-gradient(to bottom, transparent, #000 var(--edge), #000 calc(100% - var(--edge)), transparent),
      linear-gradient(#000, #000);
    mask-size: calc(100% - var(--sbw)) 100%, var(--sbw) 100%;
    mask-position: left top, right top;
    mask-repeat: no-repeat;
  }
  .workspace__inner { max-width: 820px; margin: 0 auto; }
  .workspace__inner--wide { max-width: 1180px; }

  .page-head { margin-bottom: 24px; text-align: center; color: #fff; }
  .page-head h1 {
    margin: 0 0 7px;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.1;
  }
  .lead { margin: 0 auto; color: #fff; font-size: 14.5px; font-weight: 500; max-width: 56ch; }

  /* the quiet line under the input, like a disclaimer */
  .foot-note {
    margin: 12px auto 0;
    color: #fff;
    font-size: 11.5px;
    text-align: center;
  }

  /* ---------- composer bubble ---------- */

  .composer {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-bubble);
    box-shadow: var(--lift);
    transition: box-shadow .22s ease, border-color .22s ease;
  }
  .composer.is-open, .composer:focus-within { border-color: var(--brand-line); box-shadow: var(--lift-high); }

  .composer__field {
    width: 100%;
    padding: 19px 24px 9px;
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 17px;
    font-weight: 500;
  }
  .composer__field::placeholder { color: #9aa0b4; font-weight: 450; }
  .composer__field:focus { outline: none; }

  .composer__list {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .26s var(--ease-bubble), opacity .16s ease;
  }
  .composer.is-open .composer__list { max-height: 330px; opacity: 1; }

  .composer__bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 12px;
  }
  .composer__bar .spacer { flex: 1 1 auto; }

  .composer__picks {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 11px 16px 14px;
    border-top: 1px solid var(--line-soft);
  }
  .composer__picks[hidden] { display: none; }
  .composer__picks .picks-label { color: var(--muted); font-size: 11.5px; font-weight: 650; }

  .pick {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
    padding: 5px 5px 5px 12px;
    border-radius: 999px;
    background: var(--brand-soft);
    color: var(--brand-deep);
    font-size: 12.5px;
  }
  .pick b { font-family: var(--mono); font-size: 12px; font-weight: 650; }

  .pick__edit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 0;
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    font-size: inherit;
    cursor: pointer;
  }
  .pick__edit:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 999px; }

  /* The chip the next pick will overwrite turns solid and breathes: unlike the
     others at a glance, and unmistakably the one that is waiting. */
  .pick { transition: background-color .18s ease, color .18s ease, box-shadow .18s ease, scale .18s var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .pick:hover { scale: 1.04; } }
  .pick.is-editing {
    background: var(--brand);
    color: #fff;
    box-shadow: 0 0 0 3px var(--brand-soft);
    animation: armed 1.6s ease-in-out infinite;
  }
  .pick.is-editing .pick__drop { color: #fff; opacity: .8; }
  .pick.is-editing .pick__drop:hover { background: rgba(255, 255, 255, .22); opacity: 1; }

  @keyframes armed {
    0%, 100% { box-shadow: 0 0 0 3px var(--brand-soft); }
    50% { box-shadow: 0 0 0 6px rgba(111, 45, 217, .16); }
  }

  /* page opening: everything lifts into place once, staggered */
  @keyframes fade-only { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
  /* fill-mode is backwards, not both: an element still filling a transform
     animation acts as the containing block for its fixed children, which sends
     the hover sub-list off to the side of the screen */
  /* Short, closely spaced: the composer is built by script, so its turn only
     comes once the page's own JavaScript has run. A long delay on top of that
     is what made the bubble arrive noticeably after the heading. */
  /* Held back while the page is still arriving, then let go all at once, in
     order, from the rail across to the results. */
  .is-loading .topbar__logo, .is-loading .topbar__nav,
  .is-loading .page-head h1, .is-loading .page-head .lead,
  .is-loading .workspace > div > :nth-child(2), .is-loading .workspace .foot-note,
  .is-loading .result { opacity: 0; }

  /* A page load is a once-a-visit moment, so the sequence is given room: each
     piece starts a clear beat after the one before, and the rise is long enough
     to be seen as a rise. */
  .is-ready .topbar__logo { animation: rise 560ms var(--ease-out) backwards 0ms; }
  .is-ready .topbar__nav { animation: rise 560ms var(--ease-out) backwards 90ms; }
  .is-ready .page-head h1 { animation: rise 600ms var(--ease-out) backwards 140ms; }
  .is-ready .page-head .lead { animation: rise 560ms var(--ease-out) backwards 230ms; }
  .is-ready .workspace > div > :nth-child(2) { animation: rise 640ms var(--ease-out) backwards 330ms; }
  .is-ready .workspace .foot-note { animation: rise 560ms var(--ease-out) backwards 460ms; }
  .is-ready .result { animation: rise 640ms var(--ease-out) backwards 540ms; }

  /* ---------- product thumbnail ---------- */

  .thumb {
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    flex: none;
    overflow: hidden;
    background: var(--tint);
    border: 1px solid var(--line-soft);
    border-radius: 18px;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 78%; height: 78%; }
  .hero .figure { flex: 0 1 auto; min-width: 0; }
  .hero__left { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .pick__drop {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 50%;
    color: var(--brand-deep);
    cursor: pointer;
    opacity: .65;
  }
  .pick__drop:hover { background: rgba(70, 91, 244, .16); opacity: 1; }
  .pick__drop:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  .composer--form { padding: 6px 6px 0; }
  .composer--form .composer__bar { padding: 10px 8px 10px; border-top: 1px solid var(--line-soft); margin-top: 4px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    max-width: 100%;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--tint);
    color: var(--muted);
    font-size: 13px;
    overflow: hidden;
  }
  .pill b { color: var(--ink); font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .pill[hidden] { display: none; }

  .icon-btn {
    position: relative;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: none;
    padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  .icon-btn:hover { background: var(--tint); color: var(--ink); }
  .icon-btn:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .icon-btn[hidden] { display: none; }
  .icon-btn--round { border-radius: 50%; }
  .icon-btn--quiet { border-color: transparent; background: none; color: var(--muted); }
  .icon-btn--quiet:hover { background: var(--tint); }
  .icon-btn--send {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 40px;
    height: 40px;
    padding: 0;
    background: var(--brand);
    border-color: var(--brand);
    border-radius: 999px;
    color: #fff;
    overflow: hidden;
    box-shadow: 0 8px 18px -9px rgba(111, 45, 217, .75);
  }
  .icon-btn--send:hover { background: var(--brand-deep); color: #fff; }
  /* Once the tick is in, the pill widens leftward to say so — the clear button
     beside it moves over, and comes back as the pill draws in. */
  .icon-btn--send.is-sent {
    width: var(--send-w, 92px);
    background: var(--ok);
    border-color: var(--ok);
    box-shadow: 0 8px 18px -9px rgba(0, 153, 106, .7);
    transition-delay: 0s, 0s, 0s, 0s, .18s, 0s;
  }
  .icon-btn--send .send__glyphs { position: relative; flex: none; width: 38px; height: 38px; }
  .send__word {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    padding-right: 14px;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity .18s var(--ease-out), transform .18s var(--ease-out);
  }
  .icon-btn--send.is-sent .send__word { opacity: 1; transform: none; transition-delay: .26s; }

  /* Both glyphs sit in the button at once; the arrow lifts out as the tick
     settles in. Transitions rather than a swap, so a second send while the
     first is still showing picks up from wherever the glyphs are. */
  .icon-btn--send .send__ic {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transition: opacity .18s var(--ease-out), transform .18s var(--ease-out);
  }
  .icon-btn--send .send__check { opacity: 0; transform: scale(.6); }
  .icon-btn--send.is-sent .send__arrow { opacity: 0; transform: translateY(-9px); }
  .icon-btn--send.is-sent .send__check { opacity: 1; transform: none; }

  /* Clear answers with its own name: the cross folds into a tick — the two
     strokes slide and shorten into place rather than swapping — the pill
     widens leftward to say "Cleared", then draws back to a cross as the word
     fades with it. */
  /* A round button that says its name under the pointer: it opens into a pill
     with a short word, and closes when the pointer leaves. At the left of a
     bar it opens rightward; at the right, leftward, with the button beside it
     unmoved. Focus opens it too, so the keyboard gets the same words. */
  .icon-btn--wordy {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    width: 38px;
    padding: 0 0 0 10px;
    border-radius: 999px;
    overflow: hidden;
  }
  .icon-btn--wordy > svg { flex: none; }
  .btn-word {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    padding-right: 12px;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity .16s var(--ease-out), transform .16s var(--ease-out);
  }
  .icon-btn--wordy:focus-visible { width: var(--word-w, 100px); }
  .icon-btn--wordy:focus-visible .btn-word { opacity: 1; transform: none; transition-delay: .08s; }
  @media (hover: hover) and (pointer: fine) {
    .icon-btn--wordy:hover { width: var(--word-w, 100px); }
    .icon-btn--wordy:hover .btn-word { opacity: 1; transform: none; transition-delay: .08s; }
  }

  /* Clear answers with its own name: the cross folds into a tick — the two
     strokes slide and shorten into place rather than swapping — and only once
     the tick has formed does the pill widen to say "Cleared", then it draws
     back as the word fades with it. The button keeps its own colour; only the
     tick turns green. */
  .icon-btn--clear { transition-delay: 0s, 0s, 0s, 0s, 0s, 0s, 0s, 0s; }
  .icon-btn--clear.is-done { width: var(--word-w, 108px); transition-delay: 0s, 0s, 0s, 0s, .36s, 0s, 0s, 0s; }
  .icon-btn--clear.is-done .btn-word { opacity: 1; transform: none; transition-delay: .46s; }
  .icon-btn--clear .morph line {
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    transform-origin: 9px 9px;
    transition: transform .36s var(--ease-out) .22s, stroke .2s ease .22s;
  }
  .icon-btn--clear.is-done .morph line { stroke: var(--ok); transition-delay: 0s; }
  .icon-btn--clear.is-done line.morph__a { transform: translate(-3.5px, 2.5px) scale(.46); }
  .icon-btn--clear.is-done line.morph__b { transform: translate(2px, .5px) scale(.86); transition-delay: 60ms; }

  /* The plus turns a quarter of the way round and lands as a cross, so the same
     button that opened a list is visibly the one that closes it. */
  .icon-btn--toggle svg { transition: transform .32s cubic-bezier(.3, 1.25, .5, 1); }
  .icon-btn--toggle.is-x svg { transform: rotate(45deg); }
  .icon-btn--toggle.is-x {
    background: var(--brand-soft);
    border-color: var(--brand-line);
    color: var(--brand-deep);
  }

  /* one ring leaving the button, so a repeat send still reads as a send */
  .icon-btn--send::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 999px;
    border: 2px solid var(--ok);
    opacity: 0;
    pointer-events: none;
  }
  .icon-btn--send.is-ringing::before { animation: sent-ring .5s var(--ease-out); }

  @keyframes sent-ring {
    from { transform: scale(.86); opacity: .6; }
    to { transform: scale(1.6); opacity: 0; }
  }

  /* shared hover hint, used by icon buttons and copy buttons */
  .tip::after {
    content: attr(data-tip);
    position: absolute;
    right: 0;
    bottom: calc(100% + 7px);
    padding: 5px 9px;
    background: var(--ink);
    color: var(--card);
    border-radius: 7px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease;
    z-index: 40;
  }
  .tip:hover::after, .tip:focus-visible::after, .tip.is-done::after, .tip.is-fail::after { opacity: 1; }
  .tip--left::after { right: auto; left: 0; }

  /* ---------- passing notices ---------- */

  .toasts {
    position: fixed;
    z-index: 80;
    left: 50%;
    bottom: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .toast {
    display: flex;
    align-items: center;
    gap: 11px;
    max-width: min(92vw, 430px);
    padding: 12px 17px;
    background: var(--ink);
    color: var(--card);
    border-radius: 16px;
    box-shadow: 0 20px 44px -20px rgba(12, 15, 30, .7);
    font-size: 13.5px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .18s ease, transform .24s cubic-bezier(.22, .68, .3, 1);
  }
  .toast.is-in { opacity: 1; transform: none; }
  .toast svg { flex: none; color: #ffb057; }
  .toast b { font-family: var(--mono); font-size: 12.5px; font-weight: 650; }

  /* ---------- dropdown internals ---------- */

  .picker { position: relative; }

  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 0 15px;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: var(--r-inner);
    color: var(--ink);
    font: inherit;
    font-size: 14.5px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .trigger:hover { background: var(--tint-2); }
  .trigger[aria-expanded="true"] { background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .trigger .chev { flex: none; color: var(--muted); transition: transform .15s ease; }
  .trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .trigger .placeholder { color: #9aa0b4; }
  .trigger .picked { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .panel {
    position: absolute;
    z-index: 20;
    top: calc(100% + 7px);
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--lift-high);
    overflow: hidden;
  }
  .panel[hidden] { display: none; }

  /* The row panel unfolds on max-height, the way the composer bubble does.
     Deliberately not a transform: a transformed panel becomes the containing
     block for the fixed sub-list inside it, which would both misplace the
     sub-list and clip it against this panel's own overflow. */
  .panel.is-mounted { animation: panel-in .26s var(--ease-bubble); }
  .panel.is-out { animation: panel-out .18s ease forwards; pointer-events: none; }

  @keyframes panel-in {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 460px; }
  }
  @keyframes panel-out {
    from { opacity: 1; max-height: 460px; }
    to { opacity: 0; max-height: 0; }
  }

  .panel-search { padding: 9px; border-bottom: 1px solid var(--line-soft); }
  .search {
    width: 100%;
    height: 36px;
    padding: 0 13px;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: 12px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }
  .search::placeholder { color: #9aa0b4; }
  .search:focus { outline: none; background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 20px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .head .h-cap { flex: none; min-width: 70px; }
  .head .h-name { flex: 1 1 auto; }
  .head .h-sku { flex: none; margin-left: auto; }
  .head .h-sku[hidden] { display: none; }

  .menu {
    margin: 0;
    padding: 8px 9px;
    list-style: none;
    max-height: 270px;
    overflow-y: auto;
    overscroll-behavior: contain;   /* reaching the end stops here, not on the page */
    scrollbar-width: thin;
  }
  .menu > li { position: relative; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 6px 12px;
    background: none;
    border: 0;
    border-radius: 14px;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    position: relative;
    transition: background .14s ease, color .14s ease, scale .16s var(--ease-out);
  }
  .row:hover { background: var(--tint); }
  /* plain :focus, not :focus-visible — arrowing through the list has to show
     where you are even when the list was opened with the mouse */
  .row:focus {
    background: var(--brand-soft);
    color: var(--brand-deep);
    outline: none;
    box-shadow: inset 0 0 0 2px var(--brand);
  }
  /* the last pick is not singled out — a row lights up only under the pointer
     (or keyboard focus); what is taken is shown by its tick instead */

  /* A drive that is already on the list wears a tick, so the list shows what
     is taken without having to be remembered. */
  .row.is-taken { color: var(--brand-deep); }
  .row__tick {
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    flex: none;
    margin-left: 4px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
  }
  .row__tick svg { width: 11px; height: 11px; }

  /* The pressed row swells for a beat and takes its tick before the list folds
     away, so the pick is seen to land. */
  .row.is-picked {
    background: var(--brand-soft);
    color: var(--brand-deep);
    animation: row-pick .22s var(--ease-out);
  }
  .row.is-picked .row__tick { animation: tick-in .22s var(--ease-out); }
  @keyframes row-pick {
    0% { transform: scale(1); }
    45% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes tick-in {
    from { opacity: 0; transform: scale(.5); }
    to { opacity: 1; transform: none; }
  }

  .row .cap { flex: none; min-width: 70px; font-size: 15.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .row .code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .row .count { flex: none; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .row .sep { color: #b8bdcd; margin: 0 5px; }
  .row .arrow { flex: none; color: var(--muted); transition: transform .15s ease; }
  li.group.is-open > .row .arrow { transform: rotate(90deg); }

  /* The sub-list keeps its own bubble. It is mounted and unmounted from script
     so it can unfold and fold away like the list it came out of; the animation
     rides on the card inside, which leaves the shell's box untransformed for
     placeFlyout to measure. */
  .flyout { display: none; }
  .flyout.is-mounted { display: block; }
  .flyout ul { margin: 0; padding: 8px 9px; list-style: none; }
  .flyout .stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .flyout .stack b { font-weight: 600; font-size: 13.5px; }

  .flyout .card {
    opacity: 0;
    transform: translateY(-7px) scale(.97);
    transform-origin: top left;
    transition: opacity .17s ease, transform .25s var(--ease-bubble);
  }
  .flyout.is-in .card { opacity: 1; transform: none; }

  @media (min-width: 900px) {
    .flyout {
      position: fixed;
      z-index: 60;
      padding-left: 8px;
      width: 296px;
    }
    .flyout .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--lift-high);
    }
    .flyout .row { min-height: 50px; }
    .flyout .row .cap { display: none; }
  }

  @media (max-width: 899px) {
    .flyout {
      padding: 0 0 0 20px;
      max-height: 0;
      overflow: hidden;
      transition: max-height .26s var(--ease-bubble);
    }
    .flyout.is-in { max-height: 420px; }
    .flyout .card { margin: 2px 0 6px; border-left: 2px solid var(--brand-line); }
    .flyout .row { min-height: 50px; }
    .flyout .row .cap { display: none; }
  }

  .picker--compact .trigger { min-height: 42px; }
  .picker--compact .menu { max-height: 226px; }
  .picker--compact .row { min-height: 38px; padding: 5px 10px; gap: 10px; }
  .picker--compact .row .cap { min-width: 54px; font-size: 14px; }
  .picker--compact .row .name { font-size: 13.5px; }
  .picker--compact .head { padding: 8px 14px; font-size: 11px; }
  .picker--compact .head .h-cap { min-width: 54px; }

  /* ---------- results toolbar ---------- */

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .segmented {
    position: relative;
    display: inline-flex;
    padding: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .segmented__thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    background: var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 18px -12px rgba(20, 24, 45, .8);
    /* a touch of overshoot, so the switch reads as a slide and not a jump */
    transition: transform .34s cubic-bezier(.34, 1.26, .5, 1);
  }
  .segmented.is-second .segmented__thumb { transform: translateX(100%); }
  .segmented__opt {
    position: relative;
    z-index: 1;
    min-width: 92px;
    padding: 7px 15px;
    background: none;
    border: 0;
    border-radius: 999px;
    color: var(--muted);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: color .24s ease;
  }
  .segmented__opt.is-on { color: var(--card); }
  .segmented__opt:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .sorter { position: relative; }
  /* An icon at rest; it widens to show the current order under the pointer,
     with the keyboard, or while its menu is open. The width it needs is
     measured from the text whenever the order changes. */
  .sorter__btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 38px;
    height: 38px;
    padding: 0 0 0 10px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    font-weight: 550;
    cursor: pointer;
  }
  .sorter__btn svg { flex: none; color: var(--muted); }
  .sorter__btn b { font-weight: 550; color: var(--muted); }
  .sorter__text {
    display: inline-flex;
    white-space: nowrap;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity .16s var(--ease-out), transform .16s var(--ease-out);
  }
  .sorter__btn:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .sorter__btn:focus-visible, .sorter__btn[aria-expanded="true"], .sorter__btn.is-held {
    width: var(--sort-w, 200px);
    border-color: var(--brand-line);
  }
  .sorter__btn:focus-visible .sorter__text,
  .sorter__btn[aria-expanded="true"] .sorter__text,
  .sorter__btn.is-held .sorter__text { opacity: 1; transform: none; transition-delay: .1s; }

  .sorter__text { gap: 5px; align-items: center; }
  /* the name's slot clips one line; names move through it vertically */
  /* the slot's line matches its height, so the name sits on the same baseline as "Sort:" */
  .sorter__slot { position: relative; display: inline-grid; align-items: center; height: 1.3em; line-height: 1.3em; overflow: hidden; color: var(--muted); font-weight: 550; }
  .sorter__name {
    grid-area: 1 / 1;
    justify-self: start;      /* each name is as wide as its own text */
    white-space: nowrap;
    transition: transform .26s var(--ease-out), opacity .2s var(--ease-out);
  }
  .sorter__name.is-above { transform: translateY(-110%); opacity: 0; }
  .sorter__name.is-below { transform: translateY(110%); opacity: 0; }

  .sorter__dir { display: inline-flex; color: var(--muted); }
  /* the arrow has its own slot, so it simply turns about its centre */
  .sorter__dir .arrow { transform-origin: 8px 8px; transition: transform .28s var(--ease-in-out); }
  .sorter__dir .arrow.is-down { transform: rotate(180deg); }
  @media (hover: hover) and (pointer: fine) {
    .sorter__btn:hover { width: var(--sort-w, 200px); border-color: var(--brand-line); }
    .sorter__btn:hover .sorter__text { opacity: 1; transform: none; transition-delay: .1s; }
  }

  .sortmenu {
    position: absolute;
    z-index: 30;
    right: 0;
    top: calc(100% + 8px);
    min-width: 226px;
    padding: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--lift-high);
  }
  .sortmenu[hidden] { display: none; }
  .sortmenu__label { padding: 7px 12px 5px; color: var(--muted); font-size: 11.5px; font-weight: 650; }
  .sortmenu hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--line-soft); }

  .sortopt {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: 0;
    border-radius: 11px;
    color: inherit;
    font: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
  }
  .sortopt:hover { background: var(--tint); }
  .sortopt:focus-visible { outline: none; background: var(--tint); box-shadow: inset 0 0 0 2px var(--brand); }
  .sortopt .tick { flex: none; width: 15px; color: var(--brand); opacity: 0; }
  .sortopt.is-on { color: var(--brand-deep); font-weight: 600; }
  .sortopt.is-on .tick { opacity: 1; }

  /* ---------- compact list ---------- */

  .compact { display: grid; gap: 9px; }

  /* Rows in the same copied state share a bubble, so a run merges and a lone
     copied row splits the list in two. A copied bubble tucks in and goes quiet. */
  .compact__group {
    transition: margin .28s cubic-bezier(.32, .72, .35, 1), background-color .22s ease,
                border-color .22s ease, box-shadow .22s ease, opacity .22s ease;
  }
  .compact__group.is-copied {
    margin: 0 20px;
    background: var(--tint-2);
    border-color: var(--tint-3);
    box-shadow: none;
    opacity: .92;
  }
  .compact__group.is-copied .crow { min-height: 40px; }
  .compact__group.is-copied .crow__cap b,
  .compact__group.is-copied .cell--weight > span { color: var(--ink-soft); }
  .compact__group.is-copied .cell > span { opacity: .8; }
  .compact__group.is-copied .crow:hover { background: var(--tint-3); }

  .compact__head, .crow {
    display: grid;
    grid-template-columns: 128px minmax(0, 1.2fr) minmax(0, 1fr) 112px;
    align-items: center;
    gap: 10px;
    padding: 0 18px;
  }
  /* the column headers get a bubble of their own that joins the first group
     below it — unless that group is tucked in as copied, when it stands alone */
  .compact__head {
    height: 38px;
    margin-bottom: -9px;
    background: var(--card);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 19px 19px 0 0;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
  }
  .compact__head + .compact__group:not(.is-copied) { border-top-left-radius: 0; border-top-right-radius: 0; }
  .compact__head + .compact__group:not(.is-copied) .crow:first-child { border-top-left-radius: 0; border-top-right-radius: 0; }
  .compact__head:has(+ .is-copied) { margin-bottom: 0; border-bottom: 1px solid var(--line); border-radius: 19px; }
  .compact__head span:last-child { text-align: right; }

  .crow { min-height: 46px; border-bottom: 1px solid var(--line-soft); }
  .crow:last-child { border-bottom: 0; }
  .crow:hover { background: var(--tint); }
  /* the group no longer clips, so the rows carry its corners themselves */
  .crow:first-child { border-radius: 19px 19px 0 0; }
  .crow:last-child { border-radius: 0 0 19px 19px; }
  .crow:only-child { border-radius: 19px; }

  .crow__cap { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .crow__cap b {
    flex: none;
    font-size: 14px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .crow__cap span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }

  .crow .cell { display: flex; align-items: center; gap: 1px; min-width: 0; }
  .crow .cell > span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  /* the weight's copy pill is anchored by its left edge and opens rightward,
     past the row's edge if it must, so the figure never moves */
  .crow .cell--weight { position: relative; justify-content: flex-end; padding-right: 26px; }
  .crow .cell--weight .copy { position: absolute; left: calc(100% - 25px); top: 50%; translate: 0 -50%; }
  .crow .cell--weight .copy:hover, .crow .cell--weight .copy.is-done, .crow .cell--weight .copy.is-fail { z-index: 2; }
  .crow .cell--weight > span {
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .crow .cell--weight small { color: var(--muted); font-size: 11.5px; font-weight: 550; }
  .crow .copy { --copy-size: 25px; opacity: .38; }
  .crow:hover .copy { opacity: .75; }
  .crow .copy:hover, .crow .copy:focus-visible, .crow .copy.is-done { opacity: 1; }

  @media (max-width: 700px) {
    .compact__head, .crow {
      grid-template-columns: 120px minmax(0, 1fr) 96px;
      grid-template-areas: "cap id weight" ". sku sku";
      padding: 8px 14px;
      row-gap: 2px;
    }
    .compact__head { display: none; }
    .crow__cap { grid-area: cap; }
    .crow .cell--id { grid-area: id; }
    .crow .cell--sku { grid-area: sku; }
    .crow .cell--weight { grid-area: weight; }
    .compact__group.is-copied { margin: 0 12px; }
  }

  /* ---------- cards and results ---------- */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--lift);
  }

  .result { margin-top: 24px; display: grid; gap: 16px; }
  /* the toolbar stays put and only this swaps, so the view pill can animate */
  .result__body { display: grid; gap: 16px; }

  /* Fresh results rise into place as they come into view, each a beat after
     the one above it. Only for results that were just produced — a sort, a
     view switch or a copy redraws the list without any of this. */
  .reveal { opacity: 0; transform: translateY(10px) scale(.985); }
  .reveal.is-in {
    opacity: 1;
    transform: none;
    transition: opacity .24s var(--ease-out) var(--stagger, 0ms),
                transform .28s var(--ease-out) var(--stagger, 0ms);
  }

  /* Each standard card sits in a slot. The slot carries the entrance and the
     press; the card inside answers the scroll, so the two never fight over
     one transform. */
  /* a copied card tucks in the way a copied compact bubble does */
  .card-slot { min-width: 0; transition: margin .28s var(--ease-bubble); }
  .card-slot.is-copied { margin: 0 20px; }

  /* A card is at full size through the middle of the view and eases down a
     touch while it crosses either edge. Driven by the scroll position itself,
     off the main thread. Arriving animates `scale`, leaving animates
     `transform` — two properties on purpose: two animations on one property
     would each hold the other's resting value and cancel out. */
  @supports (animation-timeline: view()) {
    .card-slot > .card {
      animation: card-arrive linear both, card-leave linear both;
      animation-timeline: view(), view();
      animation-range: entry, exit;
    }
    @keyframes card-arrive { from { scale: .965; } to { scale: 1; } }
    @keyframes card-leave { from { transform: scale(1); } to { transform: scale(.965); } }
  }

  /* Copying presses the card down — a dip and back — and it stays a little
     flatter afterwards, which is what a pressed thing looks like. */
  .card-slot.is-pressed { animation: press .24s var(--ease-out); }
  @keyframes press {
    0% { transform: scale(1); }
    40% { transform: scale(.98); }
    100% { transform: scale(1); }
  }

  /* In the compact view the row itself is the bubble that gives: it takes a
     shape of its own for the moment it is pressed. */
  .crow.is-pressed { border-radius: 14px; animation: press-row .26s var(--ease-out); }
  @keyframes press-row {
    0% { transform: scale(1); background-color: transparent; }
    40% { transform: scale(.975); background-color: var(--brand-soft); }
    100% { transform: scale(1); background-color: transparent; }
  }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

  .stat {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--lift);
  }
  .stat__icon {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 14px;
    background: var(--brand-soft);
    color: var(--brand);
  }
  /* each figure keeps the colour of its material: blueprint indigo for the
     dimensions, a warm amber for weight, cardboard for cartons, steel for the
     drives — distinct from one another and from the page's own blue */
  .stat__icon--amber { background: #fff0dd; color: #c25a0c; }
  .stat__icon--slate { background: #e9eef8; color: #4a5a7d; }
  .stat__icon--kraft { background: #f5eadb; color: #96683a; }
  .stat__body { min-width: 0; flex: 1 1 auto; }
  .stat__label { color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat__value {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat__value small { font-size: 14px; font-weight: 550; color: var(--muted); letter-spacing: 0; }
  /* what the three numbers are, kept apart from the unit by a hairline rather
     than by a dot, so it reads as a key and not as more of the value */
  .stat__key {
    display: inline-flex;
    align-items: center;
    align-self: center;
    height: 1.3em;
    margin-left: 10px;
    padding-left: 10px;
    border-left: 2px solid var(--brand-line);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  /* The copy pill sits out of the flow, pinned to the corner, so opening it
     grows over the card's empty right side and never squeezes the figures
     into a second line. The body keeps the room the closed icon needs. */
  .stat__body { padding-right: 36px; }
  .stat .copy { position: absolute; top: 14px; right: 14px; }
  .stat__value { flex-wrap: nowrap; white-space: nowrap; }

  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .hero .figure { display: flex; align-items: baseline; gap: 9px; font-variant-numeric: tabular-nums; letter-spacing: -0.035em; }
  .hero .figure span:first-child { font-size: 58px; font-weight: 700; line-height: .92; }
  .hero .figure span:nth-child(2) { font-size: 19px; font-weight: 550; color: var(--muted); letter-spacing: 0; }
  .hero .figure { position: relative; padding-right: 38px; }
  .hero .figure .copy { position: absolute; left: calc(100% - 30px); top: 50%; translate: 0 -50%; }
  .hero .figure .copy:hover, .hero .figure .copy.is-done, .hero .figure .copy.is-fail { z-index: 2; }
  .card { transition: background-color .22s ease, box-shadow .22s ease; }
  .card .hero { transition: opacity .22s ease; }
  .card.is-copied { background: var(--tint); box-shadow: 0 2px 6px -4px rgba(28, 33, 74, .18); }
  .card.is-copied .hero { opacity: .82; }

  .copied-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--ok-soft);
    color: var(--ok);
    font-size: 11.5px;
    font-weight: 650;
    opacity: 0;
    transform: translateY(4px) scale(.94);
    transition: opacity .18s var(--ease-out), transform .18s var(--ease-out);
  }
  .card.is-copied .copied-tag { opacity: 1; transform: none; }
  .copied-tag svg { flex: none; }

  .hero .who { text-align: right; max-width: 46%; }
  .hero .who b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; }
  .hero .who span { font-family: var(--mono); font-size: 16px; color: var(--muted); word-break: break-all; }

  dl.specs { margin: 0; padding: 6px 24px 14px; }
  dl.specs > div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  dl.specs > div:last-child { border-bottom: 0; }
  dl.specs dt { flex: none; color: var(--muted); font-size: 13.5px; }
  dl.specs .val { display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
  dl.specs dd { margin: 0; font-size: 14.5px; font-weight: 550; text-align: right; }
  dl.specs dd.mono { font-family: var(--mono); font-size: 13.5px; font-weight: 500; word-break: break-all; }

  .empty {
    margin: 0;
    padding: 22px 24px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--brand-line);
    border-left: 3px solid var(--brand);
    border-radius: var(--r-card);
    font-size: 14px;
  }

  /* ---------- nothing picked yet ---------- */

  .blank {
    display: grid;
    justify-items: center;
    gap: 22px;
    padding: 52px 28px 56px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-bubble);
    box-shadow: var(--lift);
    text-align: center;
  }

  .blank__art {
    display: grid;
    place-items: center;
    width: 176px;
    height: 176px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 32%, #fff 0%, #f3edfd 54%, #e9defa 100%);
    box-shadow: inset 0 0 0 1px rgba(111, 45, 217, .10), 0 20px 40px -30px rgba(28, 33, 74, .75);
  }
  .blank__art svg { display: block; width: 140px; height: auto; }
  .blank__art .art-glass { animation: sweep 3.4s ease-in-out infinite; }
  .blank__art .art-sparks { animation: breathe 2.2s ease-in-out infinite; transform-origin: 80px 60px; }
  @keyframes sweep {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-30px, 22px); }
  }
  @keyframes breathe {
    0%, 100% { opacity: .5; }
    50% { opacity: 1; }
  }

  .blank p {
    margin: 0;
    max-width: 42ch;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.55;
    text-wrap: balance;
  }

  @keyframes blank-in {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  .blank__art { animation: blank-in .5s var(--ease-bubble) backwards 40ms; }
  .blank p { animation: blank-in .5s var(--ease-bubble) backwards 130ms; }

  .reset {
    margin-top: 14px;
    padding: 0;
    background: none;
    border: 0;
    color: var(--brand);
    font: inherit;
    font-size: 14px;
    font-weight: 550;
    cursor: pointer;
  }
  .reset:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* An icon at rest. Under the pointer it grows into a pill that says what it
     copies, and whatever sits beside it moves over, since the pill grows in
     the flow. After a copy it stays open long enough to say "Copied". */
  .copy {
    --copy-size: 30px;
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: var(--copy-size);
    height: var(--copy-size);
    padding: 0;
    overflow: hidden;
    background: none;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    transition: width .24s var(--ease-out), background .14s ease, border-color .14s ease,
                color .14s ease, transform .1s var(--ease-out);
  }
  .copy:focus-visible { outline: none; color: var(--ink); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .copy.is-done { color: var(--ok); }
  .copy:active { transform: scale(.92); }
  .copy__box { position: relative; flex: none; width: calc(var(--copy-size) - 2px); height: calc(var(--copy-size) - 2px); }
  .copy__label {
    padding: 0 10px 0 1px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity .16s var(--ease-out), transform .16s var(--ease-out);
  }
  .copy.is-done, .copy.is-fail { width: var(--copy-w, 96px); background: var(--tint); border-color: var(--line); }
  .copy.is-done .copy__label, .copy.is-fail .copy__label { opacity: 1; transform: none; transition-delay: .08s; }
  @media (hover: hover) and (pointer: fine) {
    .copy:hover { width: var(--copy-w, 96px); background: var(--tint); border-color: var(--line); color: var(--ink); }
    .copy:hover .copy__label { opacity: 1; transform: none; transition-delay: .08s; }
    .copy.is-done:hover { color: var(--ok); }
  }

  /* The weight buttons answer more briefly: the moment they are pressed the
     pill draws back to a tick — the card or row beside it carries the rest of
     the confirmation — and the tick gives way to the icon soon after. Held
     shut under the pointer too, or the hover would reopen it at once. */
  .copy--brief.is-done, .copy--brief.is-done:hover { width: var(--copy-size); background: none; border-color: transparent; }
  .copy--brief.is-done .copy__label, .copy--brief.is-done:hover .copy__label { opacity: 0; transform: translateX(-4px); transition-delay: 0s; }

  /* pressed many times a day, so the swap to the tick is a small crossfade
     and nothing more */
  .copy .copy__ic {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transition: opacity .14s var(--ease-out), transform .14s var(--ease-out);
  }
  .copy .copy__done { opacity: 0; transform: scale(.7); }
  .copy .copy__done path { stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .28s var(--ease-out); }
  .copy.is-done .copy__glyph { opacity: 0; transform: scale(.3); transition-duration: .16s; }
  .copy.is-done .copy__done { opacity: 1; transform: none; transition-delay: .06s; }
  .copy.is-done .copy__done path { stroke-dashoffset: 0; transition-delay: .1s; }

  /* ---------- calculator rows ---------- */

  /* The 8px between rows is each row's own padding rather than a flex gap, so a
     row folding away takes its share of the spacing with it instead of dropping
     the last 8px in one step. The negative margin trims the gutter left hanging
     off the final row. */
  .lines { display: flex; flex-direction: column; padding: 4px 6px 0; margin-bottom: -8px; }
  .line { padding-bottom: 8px; }

  /* --row-h is measured by script, so a row folds over its own height instead of
     some ceiling picked to be safely too high. The clip is only on while the
     fold runs — a row that clipped all the time would cut off the product list
     that drops out of it. */
  .line.is-entering { overflow: hidden; animation: row-in .24s var(--ease-bubble); }
  .line.is-leaving { overflow: hidden; animation: row-out .22s ease forwards; pointer-events: none; }

  @keyframes row-in {
    from { opacity: 0; max-height: 0; padding-bottom: 0; }
    to { opacity: 1; max-height: var(--row-h, 140px); padding-bottom: 8px; }
  }
  @keyframes row-out {
    from { opacity: 1; max-height: var(--row-h, 140px); padding-bottom: 8px; }
    to { opacity: 0; max-height: 0; padding-bottom: 0; }
  }

  .line, .line-head {
    display: grid;
    grid-template-columns: 22px 1fr 172px 34px;
    align-items: center;
    gap: 10px;
  }
  .line-head { padding: 6px 6px 0; color: var(--muted); font-size: 11.5px; font-weight: 600; }

  .line__n { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  /* our own stepper, so a click always lands somewhere predictable */
  .line__qty { display: flex; align-items: center; gap: 5px; }

  .qty-step {
    display: grid;
    place-items: center;
    width: 32px;
    height: 42px;
    flex: none;
    padding: 0;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: 13px;
    color: var(--ink-soft);
    font: inherit;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .qty-step:hover { background: var(--tint-2); color: var(--ink); }
  .qty-step:active { background: var(--tint-3); }
  .qty-step:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .qty {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    height: 42px;
    padding: 0 8px;
    text-align: center;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: var(--r-inner);
    color: var(--ink);
    font: inherit;
    font-size: 14.5px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .qty::-webkit-outer-spin-button,
  .qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty:hover { background: var(--tint-2); }
  .qty:focus { outline: none; background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .line.is-bad .qty, .line.is-bad .trigger { border-color: #d24b3c; background: #fef6f5; }

  .line__rm {
    width: 34px;
    height: 34px;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 50%;
    color: var(--muted);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .line__rm:hover { background: var(--tint); border-color: var(--line); color: var(--ink); }
  .line__rm:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .line__rm[hidden] { visibility: hidden; display: block; }

  /* ---------- pallet block and table ---------- */

  .send-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--lift);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .send-btn:hover { border-color: var(--brand-line); color: var(--brand-deep); }
  .send-btn:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .send-btn.is-fail { color: #9a3b2e; border-color: #f3cdc7; }

  /* The pill's shape never changes; what happens happens inside it. The words
     fade and the icon slides to the middle; there it becomes a tick; "Copied"
     comes up beside it and the tick moves over so the pair sits centred; then
     both leave to the left as the original returns from the right. Strictly
     one thing at a time: each hand-off is a fixed delay on the next step. */
  .send-btn__layer { display: flex; align-items: center; gap: 9px; }
  .send-btn__done {
    position: absolute;
    inset: 0;
    justify-content: center;
    opacity: 0;
    color: var(--ok);
    pointer-events: none;
    transition: opacity .2s var(--ease-out), transform .26s var(--ease-out);
  }
  .send-btn__ic { display: inline-flex; align-items: center; }
  .send-btn__ic, .send-btn__words { transition: opacity .2s var(--ease-out), transform .26s var(--ease-out); }
  .send-btn__done .send-btn__ic { opacity: 0; transform: scale(.6); }
  .send-btn__done .send-btn__words { opacity: 0; transform: translateX(6px); }

  .send-btn.is-copying .send-btn__rest .send-btn__words { opacity: 0; transition-duration: .16s; }
  .send-btn.is-copying .send-btn__rest .send-btn__ic { transform: translateX(var(--mid, 0)); transition-delay: .17s; }

  .send-btn.is-ticked .send-btn__rest .send-btn__ic {
    opacity: 0;
    transform: translateX(var(--mid, 0)) scale(.6);
    transition: opacity .14s var(--ease-out), transform .14s var(--ease-out);
  }
  .send-btn.is-ticked .send-btn__done { opacity: 1; transform: translateX(var(--half, 0)); transition-delay: .15s; }
  .send-btn.is-ticked .send-btn__done .send-btn__ic { opacity: 1; transform: none; transition-delay: .15s; }

  .send-btn.is-labelled .send-btn__done { transform: none; transition-delay: 0s; }
  .send-btn.is-labelled .send-btn__done .send-btn__words { opacity: 1; transform: none; }

  .send-btn.is-leaving .send-btn__done { opacity: 0; transform: translateX(-32px); }
  .send-btn.is-leaving .send-btn__rest { animation: from-right .3s var(--ease-out) 80ms backwards; }
  .send-btn.is-leaving .send-btn__rest .send-btn__ic,
  .send-btn.is-leaving .send-btn__rest .send-btn__words { transition: none; }
  @keyframes from-right {
    from { opacity: 0; transform: translateX(32px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- unit converter ---------- */

  /* A card that drops from the bar, anchored to its button: three pill tabs
     with a sliding marker, a value with a unit on each side, and results
     that copy. One width for every tab, wide enough for a carton's three
     sides on one line. */
  .conv {
    position: absolute;
    z-index: 40;
    right: 0;
    top: calc(100% + 10px);
    width: 428px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--lift-high);
    color: var(--ink);
    transform-origin: top right;
  }
  .conv[hidden] { display: none; }
  /* a popover, so it scales in from its button rather than unfolding */
  .conv.is-mounted { animation: pop-in .18s var(--ease-out); }
  .conv.is-out { animation: pop-out .14s ease forwards; pointer-events: none; }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-4px) scale(.96); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pop-out {
    from { opacity: 1; transform: none; }
    to { opacity: 0; transform: translateY(-4px) scale(.97); }
  }

  .conv__title { margin: 2px 0 12px 4px; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
  html[data-theme="dark"] .conv { border-color: #4d4368; box-shadow: 0 0 0 1px rgba(255, 255, 255, .05), var(--lift-high); }
  html[data-theme="dark"] .share__tip { border-color: #4d4368; }

  .conv__tabs {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 4px;
    margin-bottom: 14px;
    background: var(--tint);
    border-radius: 999px;
  }
  .conv__thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc((100% - 8px) / 3);
    height: calc(100% - 8px);
    background: var(--ink);
    border-radius: 999px;
    transition: transform .34s cubic-bezier(.34, 1.26, .5, 1);
  }
  .conv__tab {
    position: relative;
    z-index: 1;
    padding: 8px 6px;
    background: none;
    border: 0;
    border-radius: 999px;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: color .24s ease;
  }
  .conv__tab.is-on { color: var(--card); }
  .conv__tab:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .conv__pane[hidden] { display: none; }
  .conv__row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 24px 92px; align-items: center; gap: 6px; margin-bottom: 8px; }
  .conv__row--dims { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .conv__row--units { grid-template-columns: 1fr 24px 1fr; }
  .conv__label { margin: 12px 0 6px; color: var(--muted); font-size: 11.5px; font-weight: 700; }
  .conv__label:first-child { margin-top: 0; }
  .conv input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: 12px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .conv input::-webkit-outer-spin-button, .conv input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .conv input::placeholder { color: var(--muted); }
  .conv input:focus { outline: none; background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .conv__arrow { display: grid; place-items: center; color: var(--muted); }

  /* the unit menus, in the page's own dress rather than the platform's */
  .upick { position: relative; }
  .upick__btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    height: 40px;
    padding: 0 10px 0 12px;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: 12px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .upick__btn:hover { background: var(--tint-2); }
  .upick__btn:focus-visible, .upick__btn[aria-expanded="true"] { outline: none; background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .upick__btn svg { flex: none; color: var(--muted); transition: transform .15s ease; }
  .upick__btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .upick__menu {
    position: absolute;
    z-index: 5;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    padding: 5px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--lift-high);
    transform-origin: top center;
  }
  .upick__menu[hidden] { display: none; }
  .upick__menu.is-mounted { animation: pop-in .16s var(--ease-out); }
  .upick__opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 8px 10px;
    background: none;
    border: 0;
    border-radius: 9px;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }
  .upick__opt:hover, .upick__opt:focus { background: var(--tint); outline: none; }
  .upick__opt.is-on { color: var(--brand-deep); font-weight: 700; }
  .upick__opt .tick { color: var(--brand); }

  .conv__go {
    width: 100%;
    margin-top: 6px;
    padding: 11px 14px;
    background: var(--brand);
    border: 0;
    border-radius: 999px;
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .18s ease, transform .12s var(--ease-out);
  }
  .conv__go:hover { background: var(--brand-deep); }
  .conv__go:active { transform: scale(.98); }
  .conv__go:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }

  /* a result: what was entered, small, over what it became, large; the copy
     button anchored by its left edge so it opens out past the card and never
     over the figure */
  .conv__out { display: grid; gap: 6px; margin-top: 12px; }
  .conv__out:empty { display: none; }
  /* one bubble per figure: its name up top with the copy button in the
     corner; below, what was entered on the left, the arrow, and what it
     became on the right — bold and larger, so the answer is the answer */
  .conv__result {
    position: relative;
    display: grid;
    gap: 6px;
    padding: 10px 14px 11px;
    background: var(--tint);
    border-radius: 14px;
    font-variant-numeric: tabular-nums;
  }
  .conv__result .name { padding-right: 36px; color: var(--muted); font-size: 11.5px; font-weight: 700; }
  /* space-between puts the mark exactly midway between where the entered
     figure ends and the answer begins */
  .conv__result .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .conv__result .from { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .conv__result .arrow { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); }
  .conv__result .to { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .conv__result .to b { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .conv__result .to small { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .conv__result .copy { position: absolute; right: 8px; top: 8px; }
  .conv__result .copy:hover, .conv__result .copy.is-done { z-index: 2; }

  @media (max-width: 940px) {
    .conv { right: -10px; width: min(428px, calc(100vw - 20px)); }
  }

  /* ---------- calculator layout ---------- */

  /* Two columns, as on a dispatch board: the order and the load on the left,
     the answer on the right, where it stays in view while the left scrolls. */
  .calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(400px, .96fr); gap: 16px; align-items: start; }
  .calc__main { display: grid; gap: 16px; min-width: 0; }
  .calc__main > .foot-note { margin-top: -4px; }
  .calc__main > #out:empty, .calc__stage:empty { display: none; }
  .calc__stage { display: grid; gap: 16px; }
  .calc__side { position: sticky; top: 0; display: grid; gap: 16px; min-width: 0; }

  .side-hero {
    position: relative;
    display: grid;
    align-content: start;
    gap: 18px;
    padding: 26px 26px 24px;
  }
  .side-hero__title {
    margin: 0 0 2px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.05;
  }
  .side-hero__copy { margin: 0; max-width: 34ch; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .side-hero__title--marked { display: flex; align-items: center; gap: 10px; }
  .side-hero__mark { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--brand-soft); }
  .side-hero__mark svg { width: 24px; height: auto; }
  .side-hero__mark .art-arrow { animation: settle 2.6s ease-in-out infinite; }

  /* The load, model by model, as one bar. Each share holds its percent when
     it has room; the model names hang beneath, tilted, each from the middle
     of its share — so a sliver of a share is still named, and many shares
     still read. The rest waits in the hover card. */
  .share { position: relative; margin: -6px 0 2px; }
  .share__bar { display: flex; gap: 3px; height: 22px; border-radius: 999px; overflow: hidden; }
  .share__seg {
    flex: 1 1 0;
    min-width: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    container-type: inline-size;
    transition: filter .16s ease;
    cursor: default;
  }
  @media (hover: hover) and (pointer: fine) { .share__seg:hover { filter: brightness(1.08); } }
  .share__pct { font-size: 11px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  @container (max-width: 34px) { .share__pct { display: none; } }
  .share__names { position: relative; height: 58px; margin-top: 4px; }
  .share__name {
    position: absolute;
    top: 0;
    padding-left: 10px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    transform-origin: 0 0;
    transform: rotate(38deg);
    cursor: default;
  }
  /* a short tick from the bar down to where the name starts */
  .share__name::before {
    content: '';
    position: absolute;
    left: 0;
    top: .55em;
    width: 7px;
    height: 1.5px;
    background: currentColor;
    opacity: .6;
  }
  .share__dot { flex: none; align-self: center; width: 8px; height: 8px; border-radius: 50%; }
  .share__tip {
    position: absolute;
    z-index: 5;
    bottom: calc(100% + 8px);
    left: 0;
    width: 196px;
    padding: 10px 12px 11px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--lift-high);
    opacity: 0;
    transform: translateY(6px) scale(.97);
    transform-origin: bottom center;
    transition: opacity .16s var(--ease-out), transform .16s var(--ease-out);
    pointer-events: none;
  }
  .share__tip[hidden] { display: none; }
  .share__tip.is-in { opacity: 1; transform: none; }
  .share__tip-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .01em; }
  .share__tip-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; }
  .share__tip-grid span { color: var(--muted); }
  .share__tip-grid b { text-align: right; font-variant-numeric: tabular-nums; }
  /* the empty state: an empty pallet, the arrow settling onto it, and the
     words centred beneath */
  .side-hero.is-idle { justify-items: center; gap: 10px; padding: 34px 26px 32px; text-align: center; }
  .side-hero.is-idle .side-hero__title { font-size: 26px; }
  .side-hero.is-idle .side-hero__copy { max-width: 30ch; text-wrap: balance; }
  .side-hero__art { width: 170px; margin-bottom: 6px; }
  .side-hero__art svg { display: block; width: 100%; height: auto; }
  .side-hero__art .art-arrow { animation: settle 2.6s ease-in-out infinite; }
  @keyframes settle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }
  .side-hero__row { position: relative; display: flex; align-items: center; gap: 14px; padding-right: 36px; }
  .side-hero__row .copy { position: absolute; right: 0; top: 50%; translate: 0 -50%; }
  .side-hero__body { flex: 1 1 auto; min-width: 0; }
  .side-hero__value {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .side-hero__value small { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .side-hero__cta { margin-top: 2px; }
  .side-hero__cta .send-btn { width: 100%; justify-content: center; padding: 13px 18px; background: var(--ink); border-color: var(--ink); color: var(--card); box-shadow: none; }
  .side-hero__cta .send-btn:hover { background: var(--ink-soft); border-color: var(--ink-soft); color: var(--card); }
  .side-hero__cta .send-btn .send-btn__done { color: #7ee2b8; }

  .side-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* the loading bay: the one dark surface, where the load is shown */
  .bay {
    position: relative;
    padding: 18px 20px 14px;
    border-radius: var(--r-bubble);
    background:
      radial-gradient(700px 360px at 80% 0%, rgba(140, 70, 230, .45), transparent 65%),
      linear-gradient(170deg, #241447 0%, #170c31 100%);
    color: #fff;
    box-shadow: 0 28px 60px -34px rgba(20, 8, 50, .9);
    overflow: hidden;
  }
  .bay::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 90%);
    mask-image: linear-gradient(to bottom, #000, transparent 90%);
    pointer-events: none;
  }
  .bay__head { position: relative; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
