<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hard Drive Searcher</title>
<style>
  :root {
    --brand: #465bf4;
    --brand-deep: #3244d6;
    --brand-soft: #eceffe;
    --brand-line: #d5dbfb;
    --ink: #1b1d28;
    --ink-soft: #444a5e;
    --muted: #6e7386;
    --page: #f3f4f9;
    --card: #ffffff;
    --line: #e4e6ef;
    --line-soft: #eef0f6;
    --tint: #f4f5fa;
    --accent: #ff4900;
    --ok: #00996a;
    --warn: #9a5b00;
    --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    --lift: 0 12px 30px -20px rgba(19, 23, 45, .55);
    --lift-high: 0 22px 48px -24px rgba(19, 23, 45, .5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- shell ---------- */

  .app { display: flex; min-height: 100vh; }

  .rail {
    position: sticky;
    top: 0;
    flex: none;
    display: flex;
    flex-direction: column;
    width: 236px;
    height: 100vh;
    padding: 20px 14px 16px;
    background: var(--brand);
    color: #fff;
  }
  .rail__brand { display: flex; align-items: center; gap: 11px; padding: 6px 10px 20px; }
  .rail__brand--logo { display: block; padding: 2px 4px 20px; }

  .rail__logo {
    display: block;
    padding: 9px 13px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 10px 22px -16px rgba(0, 0, 0, .6);
  }
  .rail__logo img { display: block; width: 100%; height: auto; }
  .rail__mark {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    flex: none;
    border-radius: 11px;
    background: rgba(255, 255, 255, .18);
    overflow: hidden;
  }
  .rail__mark img { width: 100%; height: 100%; object-fit: contain; }
  .rail__brand b { display: block; font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
  .rail__brand span { display: block; font-size: 11.5px; color: rgba(255, 255, 255, .68); }

  .rail__nav { display: flex; flex-direction: column; gap: 4px; }
  .rail__link {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 12px;
    border-radius: 13px;
    color: rgba(255, 255, 255, .84);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.25;
    text-decoration: none;
  }
  .rail__link svg { flex: none; opacity: .9; }
  .rail__link:hover { background: rgba(255, 255, 255, .13); color: #fff; }
  .rail__link:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .rail__link.is-active {
    background: #fff;
    color: var(--brand);
    font-weight: 620;
    box-shadow: 0 10px 22px -14px rgba(0, 0, 0, .65);
  }
  .rail__link.is-active svg { opacity: 1; }

  .workspace {
    flex: 1 1 auto;
    min-width: 0;
    padding: 58px 34px 72px;
    /* colour gathers behind the title and drains away down the page */
    background:
      radial-gradient(130% 58% at 50% -12%, rgba(70, 91, 244, .20), rgba(70, 91, 244, 0) 62%),
      linear-gradient(180deg, #e6eaff 0, rgba(230, 234, 255, 0) 430px),
      var(--page);
  }
  .workspace__inner { max-width: 820px; margin: 0 auto; }
  .workspace__inner--wide { max-width: 1060px; }

  .page-head { margin-bottom: 22px; text-align: center; }
  .page-head h1 {
    margin: 0 0 6px;
    font-size: 33px;
    font-weight: 720;
    letter-spacing: -0.028em;
  }
  .lead { margin: 0 auto; color: var(--muted); font-size: 13.5px; font-weight: 400; max-width: 56ch; }

  /* the quiet line under the input, like a disclaimer */
  .foot-note {
    margin: 11px auto 0;
    color: #8b90a2;
    font-size: 11.5px;
    text-align: center;
  }

  /* ---------- composer bubble ---------- */

  .composer {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--lift);
    transition: box-shadow .18s ease, border-color .18s ease;
  }
  .composer.is-open, .composer:focus-within { border-color: var(--brand-line); box-shadow: var(--lift-high); }

  .composer__field {
    width: 100%;
    padding: 18px 22px 8px;
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 17px;
  }
  .composer__field::placeholder { color: #9aa0b4; }
  .composer__field:focus { outline: none; }

  .composer__list {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .24s cubic-bezier(.32, .72, .35, 1), opacity .16s ease;
  }
  .composer.is-open .composer__list { max-height: 330px; opacity: 1; }

  .composer__bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 12px;
  }
  .composer__bar .spacer { flex: 1 1 auto; }

  .composer__picks {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 11px 16px 14px;
    border-top: 1px solid var(--line-soft);
  }
  .composer__picks[hidden] { display: none; }
  .composer__picks .picks-label { color: var(--muted); font-size: 11.5px; font-weight: 650; }

  .pick {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
    padding: 5px 5px 5px 12px;
    border-radius: 999px;
    background: var(--brand-soft);
    color: var(--brand-deep);
    font-size: 12.5px;
  }
  .pick b { font-family: var(--mono); font-size: 12px; font-weight: 650; }

  .pick__edit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 0;
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    font-size: inherit;
    cursor: pointer;
  }
  .pick__edit:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 999px; }

  /* the chip the next pick will overwrite */
  .pick.is-editing { background: var(--card); }
  .pick.is-editing::before {
    content: '';
    position: absolute;
    inset: 0;
    padding: 1.6px;
    border-radius: inherit;
    background: repeating-linear-gradient(45deg, var(--brand) 0 5px, transparent 5px 10px);
    background-size: 14.15px 14.15px;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: ants 620ms linear infinite;
    pointer-events: none;
  }

  @keyframes ants { to { background-position: 14.15px 0; } }

  /* page opening: everything lifts into place once, staggered */
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  /* fill-mode is backwards, not both: an element still filling a transform
     animation acts as the containing block for its fixed children, which sends
     the hover sub-list off to the side of the screen */
  .page-head h1 { animation: rise 520ms cubic-bezier(.22, .68, .3, 1) backwards 60ms; }
  .page-head .lead { animation: rise 520ms cubic-bezier(.22, .68, .3, 1) backwards 140ms; }
  .workspace > div > :nth-child(2) { animation: rise 560ms cubic-bezier(.22, .68, .3, 1) backwards 210ms; }
  .workspace .foot-note { animation: rise 520ms cubic-bezier(.22, .68, .3, 1) backwards 300ms; }

  /* ---------- product thumbnail ---------- */

  .thumb {
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    flex: none;
    overflow: hidden;
    background: var(--tint);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 78%; height: 78%; }
  .hero .figure { flex: 0 1 auto; min-width: 0; }
  .hero__left { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .pick__drop {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 50%;
    color: var(--brand-deep);
    cursor: pointer;
    opacity: .65;
  }
  .pick__drop:hover { background: rgba(70, 91, 244, .16); opacity: 1; }
  .pick__drop:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  .composer--form { padding: 6px 6px 0; }
  .composer--form .composer__bar { padding: 10px 8px 10px; border-top: 1px solid var(--line-soft); margin-top: 4px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    max-width: 100%;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--tint);
    color: var(--muted);
    font-size: 13px;
    overflow: hidden;
  }
  .pill b { color: var(--ink); font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .pill[hidden] { display: none; }

  .icon-btn {
    position: relative;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: none;
    padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--tint); color: var(--ink); }
  .icon-btn:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .icon-btn[hidden] { display: none; }
  .icon-btn--round { border-radius: 50%; }
  .icon-btn--quiet { border-color: transparent; background: none; color: var(--muted); }
  .icon-btn--quiet:hover { background: var(--tint); }
  .icon-btn--send {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    transition: background .18s ease, border-color .18s ease;
  }
  .icon-btn--send:hover { background: var(--brand-deep); color: #fff; }
  .icon-btn--send.is-sent { background: var(--ok); border-color: var(--ok); }

  /* one ring leaving the button, so a repeat send still reads as a send */
  .icon-btn--send::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 15px;
    border: 2px solid var(--ok);
    opacity: 0;
    pointer-events: none;
  }
  .icon-btn--send.is-sent::before { animation: sent-ring .6s cubic-bezier(.25, .8, .4, 1); }

  @keyframes sent-ring {
    from { transform: scale(.86); opacity: .6; }
    to { transform: scale(1.5); opacity: 0; }
  }

  /* shared hover hint, used by icon buttons and copy buttons */
  .tip::after {
    content: attr(data-tip);
    position: absolute;
    right: 0;
    bottom: calc(100% + 7px);
    padding: 5px 9px;
    background: var(--ink);
    color: #fff;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease;
    z-index: 40;
  }
  .tip:hover::after, .tip:focus-visible::after, .tip.is-done::after, .tip.is-fail::after { opacity: 1; }
  .tip--left::after { right: auto; left: 0; }

  /* ---------- dropdown internals ---------- */

  .picker { position: relative; }

  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 0 14px;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: 14px;
    color: var(--ink);
    font: inherit;
    font-size: 14.5px;
    text-align: left;
    cursor: pointer;
  }
  .trigger:hover { background: #eceef6; }
  .trigger[aria-expanded="true"] { background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .trigger .chev { flex: none; color: var(--muted); transition: transform .15s ease; }
  .trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .trigger .placeholder { color: #9aa0b4; }
  .trigger .picked { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .panel {
    position: absolute;
    z-index: 20;
    top: calc(100% + 7px);
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--lift-high);
    overflow: hidden;
  }
  .panel[hidden] { display: none; }

  .panel-search { padding: 9px; border-bottom: 1px solid var(--line-soft); }
  .search {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: 11px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }
  .search::placeholder { color: #9aa0b4; }
  .search:focus { outline: none; background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 20px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .head .h-cap { flex: none; min-width: 70px; }
  .head .h-name { flex: 1 1 auto; }
  .head .h-sku { flex: none; margin-left: auto; }
  .head .h-sku[hidden] { display: none; }

  .menu { margin: 0; padding: 7px; list-style: none; max-height: 270px; overflow-y: auto; }
  .menu > li { position: relative; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 6px 12px;
    background: none;
    border: 0;
    border-radius: 12px;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .row:hover, .row:focus-visible { background: var(--tint); outline: none; }
  .row:focus-visible { box-shadow: inset 0 0 0 2px var(--brand); }
  .row[aria-current="true"] { background: var(--brand-soft); color: var(--brand-deep); }

  .row .cap { flex: none; min-width: 70px; font-size: 15.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .row .code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .row .count { flex: none; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .row .sep { color: #b8bdcd; margin: 0 5px; }
  .row .arrow { flex: none; color: var(--muted); transition: transform .15s ease; }
  li.group.is-open > .row .arrow { transform: rotate(90deg); }

  /* the sub-list keeps its own bubble */
  .flyout { display: none; }
  .flyout ul { margin: 0; padding: 7px; list-style: none; }
  .flyout .stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .flyout .stack b { font-weight: 600; font-size: 13.5px; }

  @media (min-width: 900px) {
    .flyout {
      position: fixed;
      z-index: 60;
      padding-left: 8px;
      width: 296px;
    }
    .flyout .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--lift-high);
    }
    li.group:hover > .flyout, li.group.is-open > .flyout { display: block; }
    .flyout .row { min-height: 50px; }
    .flyout .row .cap { display: none; }
  }

  @media (max-width: 899px) {
    .flyout { padding: 2px 0 6px 20px; }
    li.group.is-open > .flyout { display: block; }
    .flyout .card { border-left: 2px solid var(--brand-line); }
    .flyout .row { min-height: 50px; }
    .flyout .row .cap { display: none; }
  }

  .picker--compact .trigger { min-height: 42px; }
  .picker--compact .menu { max-height: 226px; }
  .picker--compact .row { min-height: 38px; padding: 5px 10px; gap: 10px; }
  .picker--compact .row .cap { min-width: 54px; font-size: 14px; }
  .picker--compact .row .name { font-size: 13.5px; }
  .picker--compact .head { padding: 8px 14px; font-size: 11px; }
  .picker--compact .head .h-cap { min-width: 54px; }

  /* ---------- cards and results ---------- */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--lift);
  }

  .result { margin-top: 24px; display: grid; gap: 16px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

  .stat {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--lift);
  }
  .stat__icon {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 13px;
    background: var(--brand-soft);
    color: var(--brand);
  }
  .stat__icon--amber { background: #fff1e2; color: #c2550a; }
  .stat__icon--slate { background: #eef0f6; color: var(--ink-soft); }
  .stat__body { min-width: 0; flex: 1 1 auto; }
  .stat__label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .stat__value {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat__value small { font-size: 14px; font-weight: 550; color: var(--muted); letter-spacing: 0; }
  .stat .copy { margin-left: auto; }

  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .hero .figure { display: flex; align-items: baseline; gap: 9px; font-variant-numeric: tabular-nums; letter-spacing: -0.035em; }
  .hero .figure span:first-child { font-size: 58px; font-weight: 700; line-height: .92; }
  .hero .figure span:nth-child(2) { font-size: 19px; font-weight: 550; color: var(--muted); letter-spacing: 0; }
  .hero .figure .copy { align-self: center; margin-left: 4px; }
  .hero .who { text-align: right; max-width: 46%; }
  .hero .who b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; }
  .hero .who span { font-family: var(--mono); font-size: 16px; color: var(--muted); word-break: break-all; }

  dl.specs { margin: 0; padding: 6px 24px 14px; }
  dl.specs > div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  dl.specs > div:last-child { border-bottom: 0; }
  dl.specs dt { flex: none; color: var(--muted); font-size: 13.5px; }
  dl.specs .val { display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
  dl.specs dd { margin: 0; font-size: 14.5px; font-weight: 550; text-align: right; }
  dl.specs dd.mono { font-family: var(--mono); font-size: 13.5px; font-weight: 500; word-break: break-all; }

  .hint, .empty {
    margin: 0;
    padding: 22px 24px;
    color: var(--muted);
    background: var(--card);
    border: 1px dashed var(--brand-line);
    border-radius: 20px;
    font-size: 14px;
  }
  .empty { border-style: solid; border-left: 3px solid var(--brand); }

  .reset {
    margin-top: 14px;
    padding: 0;
    background: none;
    border: 0;
    color: var(--brand);
    font: inherit;
    font-size: 14px;
    font-weight: 550;
    cursor: pointer;
  }
  .reset:hover { text-decoration: underline; text-underline-offset: 3px; }

  .copy {
    position: relative;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 9px;
    color: var(--muted);
    cursor: pointer;
  }
  .copy:hover { background: var(--tint); border-color: var(--line); color: var(--ink); }
  .copy:focus-visible { outline: none; color: var(--ink); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .copy.is-done { color: var(--ok); }

  /* ---------- calculator rows ---------- */

  .lines { display: flex; flex-direction: column; gap: 8px; padding: 4px 6px 0; }

  .line, .line-head {
    display: grid;
    grid-template-columns: 22px 1fr 140px 34px;
    align-items: center;
    gap: 10px;
  }
  .line-head { padding: 6px 6px 0; color: var(--muted); font-size: 11.5px; font-weight: 600; }

  .line__n { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  .qty {
    width: 100%;
    height: 42px;
    padding: 0 8px 0 13px;
    background: var(--tint);
    border: 1px solid transparent;
    border-radius: 14px;
    color: var(--ink);
    font: inherit;
    font-size: 14.5px;
    font-variant-numeric: tabular-nums;
  }
  .qty:hover { background: #eceef6; }
  .qty:focus { outline: none; background: var(--card); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .line.is-bad .qty, .line.is-bad .trigger { border-color: #d24b3c; background: #fef6f5; }

  .line__rm {
    width: 34px;
    height: 34px;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 50%;
    color: var(--muted);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .line__rm:hover { background: var(--tint); border-color: var(--line); color: var(--ink); }
  .line__rm:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .line__rm[hidden] { visibility: hidden; display: block; }

  /* ---------- pallet block and table ---------- */

  .wire { display: grid; gap: 14px; }
  .wire__rows { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .wire__send { display: flex; justify-content: flex-end; }

  .send-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--lift);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .send-btn:hover { border-color: var(--brand-line); color: var(--brand-deep); }
  .send-btn:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .send-btn.is-done { color: var(--ok); border-color: #b9e6d6; }
  .send-btn span { display: inline-flex; align-items: center; }

  .detail-split { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); }
  .detail-split > .pane { min-width: 0; padding-top: 4px; }
  .detail-split > .stage { border-left: 1px solid var(--line-soft); }

  .stage { display: flex; flex-direction: column; justify-content: center; padding: 12px 16px 16px; }
  .stage svg {
    display: block;
    width: 100%;
    height: auto;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage svg.is-turning { cursor: grabbing; }
  .stage figcaption { margin-top: 8px; color: var(--muted); font-size: 12.5px; text-align: center; }
  .stage figcaption .stage__dims {
    display: block;
    margin-top: 2px;
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 650;
  }

  table.breakdown { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.breakdown th, table.breakdown td {
    padding: 10px 8px;
    text-align: right;
    border-bottom: 1px solid var(--line-soft);
  }
  table.breakdown th { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  table.breakdown th:first-child, table.breakdown td:first-child { padding-left: 22px; text-align: left; }
  table.breakdown th:last-child, table.breakdown td:last-child { padding-right: 20px; }
  table.breakdown td { font-variant-numeric: tabular-nums; }
  table.breakdown td.id { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  table.breakdown tr:last-child td { border-bottom: 0; }
  table.breakdown tfoot td { font-weight: 650; border-top: 1px solid var(--line); }

  .problem {
    margin: 18px 0 0;
    padding: 15px 18px;
    background: #fef6f5;
    border: 1px solid #f3cdc7;
    border-left: 3px solid #d24b3c;
    border-radius: 16px;
    color: #7f2b20;
    font-size: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .icon-btn--send.is-sent::before { animation: none; }
    .pick.is-editing::before { animation: none; }
    .page-head h1, .page-head .lead,
    .workspace > div > :nth-child(2), .workspace .foot-note { animation: none; }
  }

  /* ---------- narrow screens ---------- */

  @media (max-width: 940px) {
    .app { flex-direction: column; }
    .rail {
      position: static;
      width: auto;
      height: auto;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
    }
    .rail__brand { padding: 0 12px 0 0; }
    .rail__brand--logo { padding: 0 12px 0 0; }
    .rail__logo { width: 148px; padding: 7px 10px; border-radius: 12px; }
    .rail__brand div { white-space: nowrap; }
    .rail__nav { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .rail__link { white-space: nowrap; padding: 9px 12px; font-size: 13.5px; }
    .workspace { padding: 22px 18px 60px; }
    .detail-split { grid-template-columns: 1fr; }
    .detail-split > .stage { border-left: 0; border-top: 1px solid var(--line-soft); }
    .wire__rows { grid-template-columns: 1fr; }
  }

  @media (max-width: 620px) {
    .line, .line-head {
      grid-template-columns: 22px 1fr 34px;
      grid-template-areas: "n pick rm" ". qty qty";
      row-gap: 8px;
    }
    .line__n { grid-area: n; }
    .line__pick { grid-area: pick; }
    .line__qty { grid-area: qty; }
    .line__rm { grid-area: rm; }
    .line-head span:nth-child(3) { display: none; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero__left { gap: 14px; }
    .thumb { width: 64px; height: 64px; border-radius: 13px; }
    .hero .who { text-align: left; max-width: 100%; }
    .hero .figure span:first-child { font-size: 48px; }
    .workspace { padding: 18px 14px 50px; }
  }
</style>
</head>

  const ICON_COPY = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">'

    + '<path d="M3 8.6l3.1 3.1L13 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  async function writeClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (err) { /* fall through to the textarea route */ }

    // Plain http:// (an office PC on the LAN) has no clipboard API.
    try {
      const scratch = document.createElement('textarea');
      scratch.value = text;
      scratch.setAttribute('readonly', '');
      scratch.style.position = 'fixed';
      scratch.style.top = '-1000px';
      document.body.appendChild(scratch);
      scratch.select();
      const ok = document.execCommand('copy');
      scratch.remove();
      return ok;
    } catch (err) {
      return false;
    }
  }

  function copyButton(label, value) {
    const button = el('button', 'copy tip');
    button.type = 'button';
    button.innerHTML = ICON_COPY;
    button.dataset.tip = 'Copy ' + label;
    button.setAttribute('aria-label', 'Copy ' + label);

    button.addEventListener('click', async () => {
      const ok = await writeClipboard(value);
      button.innerHTML = ok ? ICON_DONE : ICON_COPY;
      button.dataset.tip = ok ? 'Copied' : 'Copy failed — select it by hand';
      button.classList.add(ok ? 'is-done' : 'is-fail');
      clearTimeout(button._revert);
      button._revert = setTimeout(() => {
        button.innerHTML = ICON_COPY;
        button.dataset.tip = 'Copy ' + label;
        button.classList.remove('is-done', 'is-fail');
      }, 1600);
    });

    return button;
  }

      placeholder: 'Choose a capacity',
      searchPlaceholder: 'Filter by Capacity, Product ID, or SKU',
      label: p => p.capacity + ' TB · ' + p.product_id,
      onSelect: () => {},
      onOpen: () => {},
      onClose: () => {}       // gets true when the close followed a pick
    }, options || {});

    const composerMode = opts.variant === 'composer';
    let selectedId = null;
    let showing = false;
    let picking = false;      // true only while a pick is closing the list

    const search = el('input', composerMode ? 'composer__field' : 'search');
    search.type = 'text';
    search.placeholder = opts.searchPlaceholder;
    search.autocomplete = 'off';
    search.spellcheck = false;
    search.setAttribute('aria-label', 'Search by capacity, product ID, or SKU');

    const head = el('div', 'head');
    const headCap = el('span', 'h-cap', 'Capacity');
    const headName = el('span', 'h-name', 'Product ID');
    const headSku = el('span', 'h-sku', 'SKU');
    head.append(headCap, headName, headSku);

    const menu = el('ul', 'menu');

    let root, panel, trigger = null, triggerLabel = null, bar = null;

    if (composerMode) {
      // search bar and list are one bubble: the list unfolds inside it
      root = el('div', 'composer');
      panel = el('div', 'composer__list');
      panel.append(head, menu);
      bar = el('div', 'composer__bar');
      root.append(search, panel, bar);
    } else {
      root = el('div', 'picker picker--compact');
      trigger = el('button', 'trigger');
      trigger.type = 'button';
      trigger.setAttribute('aria-haspopup', 'true');
      trigger.setAttribute('aria-expanded', 'false');
      triggerLabel = el('span', 'placeholder', opts.placeholder);
      trigger.appendChild(triggerLabel);
      trigger.appendChild(svgIcon('chev', '16', CHEVRON));

      panel = el('div', 'panel');
      panel.hidden = true;
      const wrap = el('div', 'panel-search');
      wrap.appendChild(search);
      panel.append(wrap, head, menu);
      root.append(trigger, panel);
    }

    /* rows */

    function productRow(product, flat) {
      const row = el('button', 'row');
      row.type = 'button';
      row.dataset.productId = product.product_id;
      if (product.product_id === selectedId) row.setAttribute('aria-current', 'true');

      row.appendChild(el('span', 'cap', product.capacity + ' TB'));

      if (flat) {
        // filter results: capacity on the left, then Product ID · SKU
        const line = el('div', 'name');
        line.appendChild(el('b', null, product.product_id));
        line.appendChild(el('span', 'sep', '·'));
        line.appendChild(el('span', 'code', product.sku));
        row.appendChild(line);
      } else {
        // flyout: Product ID over SKU
        const stack = el('div', 'stack');
        stack.appendChild(el('b', null, product.product_id));
        stack.appendChild(el('span', 'code', product.sku));
        row.appendChild(stack);
      }

      row.addEventListener('click', () => select(product.product_id));
      return row;
    }

    function renderMenu(query) {
      menu.innerHTML = '';
      const q = query.trim().toLowerCase();

      // filter results merge Product ID and SKU into one column
      headName.textContent = q ? 'Product ID · SKU' : 'Product ID';
      headSku.hidden = Boolean(q);

      if (q) {
        const hits = PRODUCTS.filter(p =>
          (p.capacity + 'tb ' + p.item + ' ' + p.sku + ' ' + p.product_id).toLowerCase().includes(q)
        );
        if (!hits.length) {
          const li = el('li');
          const miss = el('div', 'row', 'Nothing matches “' + query.trim() + '”');
          miss.style.color = 'var(--muted)';
          li.appendChild(miss);
          menu.appendChild(li);
          return;
        }
        hits.forEach(p => {
          const li = el('li');
          li.appendChild(productRow(p, true));
          menu.appendChild(li);
        });
        return;
      }

      CATALOG.forEach(group => {
        const li = el('li');

        if (!group.has_multiple) {
          const only = group.products[0];
          const row = el('button', 'row');
          row.type = 'button';
          row.dataset.productId = only.product_id;
          if (only.product_id === selectedId) row.setAttribute('aria-current', 'true');
          row.appendChild(el('span', 'cap', group.label));
          row.appendChild(el('span', 'name', only.product_id));
          row.appendChild(el('span', 'count', only.sku));
          row.addEventListener('click', () => select(only.product_id));
          li.appendChild(row);
        } else {
          li.className = 'group';

          const parent = el('button', 'row');
          parent.type = 'button';
          parent.setAttribute('aria-haspopup', 'true');
          parent.setAttribute('aria-expanded', 'false');
          parent.appendChild(el('span', 'cap', group.label));
          parent.appendChild(el('span', 'name', 'View Products'));
          parent.appendChild(svgIcon('arrow', '14', CARET));
          li.appendChild(parent);

          const flyout = el('div', 'flyout');
          const card = el('div', 'card');
          const list = el('ul');
          group.products.forEach(p => {
            const child = el('li');
            child.appendChild(productRow(p, false));
            list.appendChild(child);
          });
          card.appendChild(list);
          flyout.appendChild(card);
          li.appendChild(flyout);

          li.addEventListener('mouseenter', () => placeFlyout(li));
          parent.addEventListener('click', () => toggleGroup(li));
          parent.addEventListener('focus', () => placeFlyout(li));
        }

        menu.appendChild(li);
      });
    }

    function placeFlyout(li) {
      if (!wide()) return;
      const flyout = li.querySelector('.flyout');
      const anchor = li.getBoundingClientRect();

      // park it at 0,0 first: where that lands tells us what the browser is
      // measuring from, which is not always the viewport
      flyout.style.left = '0px';
      flyout.style.top = '0px';
      flyout.style.display = 'block';
      const origin = flyout.getBoundingClientRect();
      const width = origin.width || flyout.offsetWidth;
      const height = origin.height || flyout.offsetHeight;
      flyout.style.display = '';

      const left = Math.max(12, Math.min(anchor.right, window.innerWidth - width - 12));
      const top = Math.max(12, Math.min(Math.max(12, anchor.top - 8), window.innerHeight - height - 12));

      flyout.style.left = (left - origin.left) + 'px';
      flyout.style.top = (top - origin.top) + 'px';
    }

    function toggleGroup(li) {
      const open = li.classList.toggle('is-open');
      li.querySelector('.row').setAttribute('aria-expanded', String(open));
      if (open) {
        placeFlyout(li);
        menu.querySelectorAll('li.group.is-open').forEach(other => {
          if (other !== li) closeGroup(other);
        });
      }
    }

    function closeGroup(li) {
      li.classList.remove('is-open');
      const row = li.querySelector('.row');
      if (row) row.setAttribute('aria-expanded', 'false');
    }

    /* open / close */

    function open(focusSearch) {
      showing = true;
      if (composerMode) root.classList.add('is-open');
      else panel.hidden = false;
      if (trigger) trigger.setAttribute('aria-expanded', 'true');
      renderMenu(search.value);
      if (focusSearch) search.focus();
      opts.onOpen();
    }

    function close(refocus) {
      showing = false;
      if (composerMode) root.classList.remove('is-open');
      else panel.hidden = true;
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      menu.querySelectorAll('li.group.is-open').forEach(closeGroup);
      if (refocus) (trigger || search).focus();
      opts.onClose(picking);
      picking = false;
    }

    function select(productId) {
      const product = PRODUCTS.find(p => p.product_id === productId);
      if (!product) return;
      selectedId = productId;
      if (triggerLabel) {
        triggerLabel.textContent = opts.label(product);
        triggerLabel.className = 'picked';
      }
      search.value = '';
      picking = true;
      close(true);
      opts.onSelect(product);
    }

    function clear() {
      selectedId = null;
      if (triggerLabel) {
        triggerLabel.textContent = opts.placeholder;
        triggerLabel.className = 'placeholder';
      }
      search.value = '';
      renderMenu('');
    }

    if (trigger) {
      trigger.addEventListener('click', () => showing ? close(false) : open(true));
    }

    // the search bar opens the same menu
    search.addEventListener('focus', () => { if (!showing) open(false); });
    search.addEventListener('click', () => { if (!showing) open(false); });
    search.addEventListener('input', () => {
      if (!showing) open(false);
      renderMenu(search.value);
    });

    // Enter in the search bar takes the first match
    search.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const first = rows()[0];
      if (first) { first.click(); e.preventDefault(); }
    });

    document.addEventListener('click', e => {
      if (showing && !root.contains(e.target)) close(false);
    });

    // a scrolled menu would leave an open flyout behind
    menu.addEventListener('scroll', () => {
      const openLi = menu.querySelector('li.group.is-open') || menu.querySelector('li.group:hover');
      if (openLi) placeFlyout(openLi);
    });

    /* keyboard */

    function rows() {
      return Array.from(menu.querySelectorAll('button.row')).filter(row => {
        const flyout = row.closest('.flyout');
        return !flyout || flyout.closest('li.group').classList.contains('is-open');
      });
    }

    function step(dir) {
      const list = rows();
      if (!list.length) return;
      const at = list.indexOf(document.activeElement);
      const next = at === -1 ? (dir > 0 ? 0 : list.length - 1) : (at + dir + list.length) % list.length;
      list[next].focus();
    }

    root.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const openGroup = document.activeElement.closest?.('li.group.is-open');
        if (openGroup && document.activeElement.closest('.flyout')) {
          closeGroup(openGroup);
          openGroup.querySelector('.row').focus();
        } else {
          close(true);
        }
        e.preventDefault();
        return;
      }

      if (!showing) {
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          open(false);
          e.preventDefault();
        }
        return;
      }

      if (e.key === 'ArrowDown') { step(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { step(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') {
        const li = document.activeElement.closest?.('li.group');
        if (li && !li.classList.contains('is-open')) toggleGroup(li);
        const first = li && li.querySelector('.flyout .row');
        if (first) { first.focus(); e.preventDefault(); }
      }
      else if (e.key === 'ArrowLeft') {
        const li = document.activeElement.closest?.('li.group.is-open');
        if (li) { closeGroup(li); li.querySelector('.row').focus(); e.preventDefault(); }
      }
    });

    menu.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const row = document.activeElement;
        if (row.classList?.contains('row')) { row.click(); e.preventDefault(); }
      }
    });

    window.addEventListener('resize', () => {
      menu.querySelectorAll('li.group.is-open').forEach(placeFlyout);
    });

    renderMenu('');

    return {
      root,
      bar,
      field: search,
      open,
      close,
      clear,
      takeFirst() { const first = rows()[0]; if (first) first.click(); },
      get selected() { return selectedId ? PRODUCTS.find(p => p.product_id === selectedId) : null; }
    };
  }

  function round2(n) { return Math.round(n * 100) / 100; }
</script>


<script>
  const result = document.getElementById('result');
  const slot = document.getElementById('pickerSlot');

  if (!CATALOG.length) {
    document.getElementById('lead').remove();
    result.innerHTML = '<p class="empty">No drive data loaded. Check that hdd.json sits next to app.py and contains valid JSON, then reload.</p>';
  } else {
    const chosen = [];          // products in the order they were picked
    let editing = -1;           // nothing is armed to be overwritten until a chip is clicked
    let restoreTo = null;       // where the ring goes back to if + is dismissed
    let searchedOnce = false;   // the first pick of a visit searches on its own

    const picker = createPicker({
      variant: 'composer',
      searchPlaceholder: 'Search by capacity, product ID, or SKU',
      onSelect: p => add(p),
      onClose: picked => {
        // + was pressed but nothing came of it: put the ring back where it was
        if (!picked && restoreTo !== null) {
          editing = restoreTo;
          renderPicks();
        }
        restoreTo = null;
      }
    });
    slot.appendChild(picker.root);

    /* control row: add another, clear, send */
    const addBtn = iconButton('Add another drive', ICON_PLUS, e => {
      e.stopPropagation();      // or the document handler closes it right back
      if (restoreTo === null) restoreTo = editing;
      editing = -1;             // + means the next pick joins the list
      renderPicks();
      picker.open(true);
    }, 'icon-btn icon-btn--round tip--left');
    addBtn.hidden = true;

    const clearBtn = iconButton('Clear', ICON_CROSS, () => {
      chosen.length = 0;
      editing = -1;
      searchedOnce = false;
      picker.clear();
      renderPicks();
      renderHint();
      picker.field.focus();
    }, 'icon-btn icon-btn--quiet');

    const sendBtn = iconButton('Send', ICON_ARROW, () => {
      if (chosen.length) {
        renderResults();
        flashSent(sendBtn);
      } else {
        picker.takeFirst();
        if (chosen.length) flashSent(sendBtn);
      }
    }, 'icon-btn icon-btn--send');

    picker.bar.append(addBtn, el('span', 'spacer'), clearBtn, sendBtn);

    /* the selected list sits under the control row */
    const picks = el('div', 'composer__picks');
    picks.hidden = true;
    picker.root.appendChild(picks);

    renderHint();
    window.addEventListener('pageshow', () => picker.close(false));

    function add(product) {
      const already = chosen.findIndex(p => p.product_id === product.product_id);

      if (already > -1) {
        // already listed: leave the list alone rather than doubling it up
      } else if (editing > -1 && editing < chosen.length) {
        chosen[editing] = product;                  // a chip was clicked, so replace it
        editing = -1;                               // and go back to arming nothing
      } else {
        chosen.push(product);
      }

      renderPicks();

      // the first drive of a visit goes straight to a result; after that, Send does it
      if (!searchedOnce) {
        searchedOnce = true;
        renderResults();
      }
    }

    function drop(productId) {
      const at = chosen.findIndex(p => p.product_id === productId);
      if (at > -1) chosen.splice(at, 1);
      if (at === editing) editing = -1;
      else if (at < editing) editing -= 1;
      renderPicks();
      if (chosen.length) renderResults();
      else { searchedOnce = false; renderHint(); }
    }

    function renderPicks() {
      picks.innerHTML = '';
      addBtn.hidden = chosen.length === 0;
      picks.hidden = chosen.length === 0;
      if (!chosen.length) return;

      picks.appendChild(el('span', 'picks-label', 'Selected'));

      chosen.forEach((product, index) => {
        const chip = el('span', 'pick' + (index === editing ? ' is-editing' : ''));

        const label = el('button', 'pick__edit');
        label.type = 'button';
        label.title = 'Replace this drive';
        label.appendChild(el('b', null, product.product_id));
        label.appendChild(el('span', null, product.capacity + ' TB'));
        label.addEventListener('click', e => {
          e.stopPropagation();        // keep the list from closing as it opens
          if (editing === index) {    // clicking the armed chip again disarms it
            editing = -1;
            renderPicks();
            return;
          }
          editing = index;
          restoreTo = null;
          renderPicks();
          picker.open(true);
        });
        chip.appendChild(label);

        const off = el('button', 'pick__drop');
        off.type = 'button';
        off.innerHTML = ICON_CROSS;
        off.setAttribute('aria-label', 'Remove ' + product.product_id);
        off.addEventListener('click', () => drop(product.product_id));
        chip.appendChild(off);

        picks.appendChild(chip);
      });
    }

    function renderHint() {
      result.innerHTML = '<p class="hint">The weight, product ID and SKU show up here once you pick a drive.</p>';
    }

    function spec(label, value, mono, copyable) {
      const div = el('div');
      div.appendChild(el('dt', null, label));

      const val = el('div', 'val');
      val.appendChild(el('dd', mono ? 'mono' : null, value));
      if (copyable) val.appendChild(copyButton(label, value));
      div.appendChild(val);

      return div;
    }

    function renderResults() {
      result.innerHTML = '';
      chosen.forEach(product => result.appendChild(driveCard(product)));
    }

    function driveCard(product) {
      const card = el('div', 'card');

      const hero = el('div', 'hero');

      const left = el('div', 'hero__left');
      left.appendChild(productThumb(product));

      const figure = el('div', 'figure');
      figure.appendChild(el('span', null, String(product.weight)));
      figure.appendChild(el('span', null, UNIT));
      figure.appendChild(copyButton('weight', String(product.weight)));
      left.appendChild(figure);
      hero.appendChild(left);

      const who = el('div', 'who');
      who.appendChild(el('b', null, product.capacity + ' TB ' + (product.is_pro ? 'Pro' : 'Standard')));
      who.appendChild(el('span', null, product.sku));
      hero.appendChild(who);
      card.appendChild(hero);

      const specs = el('dl', 'specs');
      specs.appendChild(spec('Product ID', product.product_id, true, true));
      specs.appendChild(spec('SKU', product.sku, true, true));
      specs.appendChild(spec('Capacity', product.capacity + ' TB'));
      if (product.type) specs.appendChild(spec('Type', product.type));
      specs.appendChild(spec('Weight', product.weight + ' ' + UNIT));
      card.appendChild(specs);

      return card;
    }
  }
</script>
