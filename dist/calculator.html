  /* the two figures that matter, pinned to the corner of the bay in one plate */
  .bay__plate {
    display: grid;
    gap: 1px;
    padding: 7px 12px 8px;
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 16px;
    background: rgba(255, 255, 255, .08);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .bay__line { display: flex; align-items: baseline; gap: 10px; }
  .bay__key { min-width: 76px; color: rgba(255, 255, 255, .62); font-family: var(--mono); font-size: 11px; }
  .bay__line b { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .bay .stage { position: relative; padding: 6px 0 0; }
  .bay .stage figcaption { color: rgba(255, 255, 255, .62); }
  .bay .stage figcaption .stage__dims { color: #fff; }

  @media (max-width: 1020px) {
    /* one column: the answer moves up to sit right under the form, ahead of
       the bay — the main column dissolves so its parts can be reordered */
    .calc { display: flex; flex-direction: column; align-items: stretch; }
    .calc__main { display: contents; }
    .calc__side { position: static; order: 4; }
    .calc__stage { order: 5; }
  }

  .stage { display: flex; flex-direction: column; justify-content: center; padding: 12px 16px 16px; }
  .stage svg {
    display: block;
    width: 100%;
    height: auto;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage svg.is-turning { cursor: grabbing; }
  .stage figcaption { margin-top: 8px; color: var(--muted); font-size: 12.5px; font-weight: 700; text-align: center; }
  .stage figcaption .stage__dims {
    display: block;
    margin-top: 2px;
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 650;
  }

  table.breakdown { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.breakdown th, table.breakdown td {
    padding: 10px 6px;
    text-align: right;
    border-bottom: 1px solid var(--line-soft);
  }
  table.breakdown th { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  table.breakdown th:first-child, table.breakdown td:first-child { padding-left: 18px; text-align: left; }
  table.breakdown th:last-child, table.breakdown td:last-child { padding-right: 16px; }
  table.breakdown td { font-variant-numeric: tabular-nums; }
  table.breakdown td.id { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  /* In the table the pill is anchored by its left edge and opens to the right,
     into the quiet space at the start of the next column, so the figure it
     belongs to never moves. */
  table.breakdown .with-copy { position: relative; display: flex; align-items: center; justify-content: flex-end; padding-right: 26px; }
  table.breakdown .copy { --copy-size: 24px; position: absolute; left: calc(100% - 24px); top: 50%; translate: 0 -50%; opacity: .35; }
  table.breakdown .copy:hover, table.breakdown .copy.is-done, table.breakdown .copy.is-fail { z-index: 2; }
  table.breakdown tbody tr:hover .copy { opacity: .75; }
  table.breakdown .copy:hover, table.breakdown .copy:focus-visible, table.breakdown .copy.is-done { opacity: 1; }
  table.breakdown tbody tr:hover { background: var(--tint); }
  table.breakdown tr:last-child td { border-bottom: 0; }
  table.breakdown tfoot td { font-weight: 650; border-top: 1px solid var(--line); }

  .problem {
    margin: 18px 0 0;
    padding: 15px 18px;
    background: #fef6f5;
    border: 1px solid #f3cdc7;
    border-left: 3px solid #d24b3c;
    border-radius: 18px;
    color: #7f2b20;
    font-size: 14px;
  }

  /* Every button gives a little on a press: it swells while held and pops once
     on the click, so even the quickest tap shows it registered. The pop lives
     on a class set by script; :active alone would be over before a fast click
     had time to show. */
  .icon-btn, .trigger, .segmented__opt, .sorter__btn, .qty-step, .send-btn, .line__rm, .pick__drop, .reset, .topbar__link {
    transition-property: background-color, border-color, color, box-shadow, width, transform, translate, scale;
    transition-duration: .18s, .18s, .18s, .18s, .28s, .12s, .2s, .2s;
    transition-timing-function: ease, ease, ease, ease, var(--ease-out), var(--ease-out), var(--ease-out), var(--ease-out);
  }
  .icon-btn:active, .trigger:active, .segmented__opt:active, .sorter__btn:active,
  .send-btn:active, .line__rm:active, .pick__drop:active { transform: scale(1.05); }
  /* the steppers are the exception: they give under the finger */
  .qty-step:active { transform: scale(.9); }

  /* Under a fine pointer a pill grows a little and leans a hair toward the
     cursor — a uniform scale plus a couple of pixels of travel, so the pill
     stays a pill. Circular buttons sit this out. The lean is written by
     script from where the pointer is over the button. */
  @media (hover: hover) and (pointer: fine) {
    .trigger:hover, .sorter__btn:hover, .topbar__link:hover {
      translate: var(--lean-x, 0) var(--lean-y, 0);
      scale: 1.03;
    }
    .send-btn:hover { translate: var(--lean-x, 0) var(--lean-y, 0); scale: 1.05; }
    .segmented__opt:hover { scale: 1.04; }
    .qty-step:hover { scale: 1.08; }
    /* list rows grow evenly, text and all, and stay inside their list: the
       menus keep enough padding to absorb the growth */
    .row:hover { scale: 1.02; z-index: 1; }
  }
  .is-popping { animation: pop .22s var(--ease-out); }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
    .pick.is-editing::before { animation: none; }
    .compact__group { transition: none; }
    .toast { transition: opacity .18s ease; transform: none; }
    .is-ready .topbar__logo, .is-ready .topbar__nav,
    .is-ready .page-head h1, .is-ready .page-head .lead,
    .is-ready .workspace > div > :nth-child(2), .is-ready .workspace .foot-note,
    .is-ready .result { animation: fade-only .25s ease backwards; }
    .panel.is-mounted, .panel.is-out { animation: none; }
    .blank__art, .blank p { animation: none; }
    .flyout .card { opacity: 1; transform: none; }
    .line.is-entering, .line.is-leaving { animation: none; }
    .bg__blob, .bg__grid, .side-hero__art .art-arrow, .blank__art .art-glass, .blank__art .art-sparks { animation: none; }
    /* the fades stay — they still tell you what is new — the movement goes */
    .reveal { transform: none; }
    .reveal.is-in { transition: opacity .2s ease !important; }
    .icon-btn--send .send__ic, .copy .copy__ic, .copied-tag { transform: none !important; transition: opacity .15s ease !important; }
    .icon-btn--send.is-ringing::before { animation: none; }
    .card-slot > .card { animation: none; }
    .card-slot.is-pressed { animation: none; }
    .is-popping, .row.is-picked, .row.is-picked .row__tick { animation: none; }
    .pick.is-editing { animation: none; }
    .icon-btn:active, .trigger:active, .segmented__opt:active, .sorter__btn:active,
    .qty-step:active, .send-btn:active, .line__rm:active, .pick__drop:active { transform: none; }
    .icon-btn--clear .morph line { transition: none; }
    .icon-btn--clear, .btn-word { transition: opacity .18s ease !important; }
    .trigger:hover, .sorter__btn:hover, .topbar__link:hover, .send-btn:hover,
    .segmented__opt:hover, .qty-step:hover, .row:hover { translate: none; scale: none; }
    .send-btn.is-leaving .send-btn__rest { animation: fade-only .2s ease; }
    .send-btn__ic, .send-btn__words, .send-btn__done { transition: opacity .2s ease !important; transform: none !important; }
    .crow.is-pressed { animation: press-row-still .26s ease; }
  }
  /* the pressed row still flashes, it just does not move */
  @keyframes press-row-still {
    0%, 100% { background-color: transparent; }
    40% { background-color: var(--brand-soft); }
  }

  /* ---------- narrow screens ---------- */

  @media (max-width: 940px) {
    .app { padding: 10px 10px 0; gap: 10px; }
    .topbar { min-height: 58px; padding: 8px 10px; border-radius: 18px; flex-wrap: wrap; }
    .topbar__logo { width: 112px; }
    /* the pages drop to a second row; the logo and the two tools hold the first */
    .topbar__nav { order: 5; flex: 1 1 100%; margin-left: 0; }
    .topbar__link { padding: 8px 12px; font-size: 13px; }
    .workspace { padding: 60px 18px 64px; }
  }

  @media (max-width: 620px) {
    .line, .line-head {
      grid-template-columns: 22px 1fr 34px;
      grid-template-areas: "n pick rm" ". qty qty";
      row-gap: 8px;
    }
    .line__n { grid-area: n; }
    .line__pick { grid-area: pick; }
    .line__qty { grid-area: qty; }
    .line__rm { grid-area: rm; }
    .line-head span:nth-child(3) { display: none; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero__left { gap: 14px; }
    .thumb { width: 64px; height: 64px; border-radius: 13px; }
    .hero .who { text-align: left; max-width: 100%; }
    .hero .figure span:first-child { font-size: 48px; }
    .workspace { padding: 60px 14px 64px; }
  }
</style>
</head>

    + '<rect x="5.6" y="5.6" width="8.8" height="8.8" rx="1.8" stroke="currentColor" stroke-width="1.4"/>'
    + '<path d="M11 4.4V3.7A1.7 1.7 0 009.3 2H3.7A1.7 1.7 0 002 3.7v5.6A1.7 1.7 0 003.7 11h.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const ICON_DONE = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<path d="M3 8.6l3.1 3.1L13 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  async function writeClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (err) { /* fall through to the textarea route */ }

    // Plain http:// (an office PC on the LAN) has no clipboard API.
    try {
      const scratch = document.createElement('textarea');
      scratch.value = text;
      scratch.setAttribute('readonly', '');
      scratch.style.position = 'fixed';
      scratch.style.top = '-1000px';
      document.body.appendChild(scratch);
      scratch.select();
      const ok = document.execCommand('copy');
      scratch.remove();
      return ok;
    } catch (err) {
      return false;
    }
  }

  /* Rich text where the clipboard will take it, plain text where it won't;
     the plain version is always there for the fall-back route. */
  async function writeClipboardRich(text, html) {
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        await navigator.clipboard.write([new ClipboardItem({
          'text/plain': new Blob([text], { type: 'text/plain' }),
          'text/html': new Blob([html], { type: 'text/html' })
        })]);
        return true;
      }
    } catch (err) { /* fall through */ }
    return writeClipboard(text);
  }

  function copyButton(label, value, onCopy, word) {
    const button = el('button', 'copy');
    button.type = 'button';
    // both glyphs are always present; a class decides which one shows
    button.innerHTML = '<span class="copy__box">'
                     + '<span class="copy__ic copy__glyph">' + ICON_COPY + '</span>'
                     + '<span class="copy__ic copy__done">' + ICON_DONE + '</span></span>';
    const text = el('span', 'copy__label', word || ('Copy ' + label));
    button.appendChild(text);
    button.setAttribute('aria-label', 'Copy ' + label);

    // the pill's open width is whatever the label needs, measured when it is
    // about to be seen — the label changes after a copy, and so does the font
    function fit() {
      button.style.setProperty('--copy-w', (button.offsetHeight + text.scrollWidth) + 'px');
    }
    button.addEventListener('pointerenter', fit);
    button.addEventListener('focus', fit);

    function settle(ok) {
      text.textContent = ok ? 'Copied' : 'Copy failed — select it by hand';
      fit();
      button.classList.add(ok ? 'is-done' : 'is-fail');
      clearTimeout(button._revert);
      const hold = button.classList.contains('copy--brief') ? 900 : 1600;
      button._revert = setTimeout(() => {
        button.classList.remove('is-done', 'is-fail');
        // give the width transition its moment before the words change back
        setTimeout(() => { text.textContent = word || ('Copy ' + label); fit(); }, 240);
      }, hold);
    }

    button.addEventListener('click', async () => {
      const ok = await writeClipboard(value);
      if (ok && onCopy) onCopy();
      settle(ok);
    });

    // for a button built to stand in for one that was just pressed, when the
    // list it sat in has been redrawn underneath the press
    button.showDone = () => settle(true);

    return button;
  }

  /* Results that were just produced rise into place in one staggered run, all
     of them, so the list is whole from the moment it lands. The beat is capped:
     the twentieth row should not be waiting on the first nineteen. */
  function reveal(nodes) {
    const list = Array.from(nodes);
    if (!list.length) return;
    list.forEach(node => node.classList.add('reveal'));
    void list[0].offsetWidth;     // settle the hidden state, or there is nothing to transition from
    list.forEach((node, i) => {
      node.style.setProperty('--stagger', Math.min(i, 8) * 40 + 'ms');
      node.classList.add('is-in');
    });
  }

  /* One-shot press feedback on a freshly drawn element; the class leaves when
     the animation does, so the next press can play it again. */
  function press(node) {
    requestAnimationFrame(() => {
      node.classList.add('is-pressed');
      node.addEventListener('animationend', () => node.classList.remove('is-pressed'), { once: true });
    });
  }

  /* Every button pops once when clicked, rewound first so a quick second click
     plays it again. */
  const POPS = '.icon-btn, .trigger, .segmented__opt, .sorter__btn, .send-btn, .line__rm, .pick__drop';
  document.addEventListener('click', e => {
    const button = e.target.closest && e.target.closest(POPS);
    if (!button) return;
    button.classList.remove('is-popping');
    void button.offsetWidth;
    button.classList.add('is-popping');
    button.addEventListener('animationend', () => button.classList.remove('is-popping'), { once: true });
  });

  /* Where the pointer sits over a pill decides which way it leans: a couple of
     pixels toward the cursor, more on the big copy pill. Fine pointers only —
     a finger has nowhere to hover from. */
  const LEANS = '.trigger, .sorter__btn, .send-btn, .topbar__link';
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.addEventListener('pointermove', e => {
      const pill = e.target.closest && e.target.closest(LEANS);
      if (!pill) return;
      const box = pill.getBoundingClientRect();
      const reach = pill.classList.contains('send-btn') ? 4 : 2;
      const x = ((e.clientX - box.left) / box.width - .5) * 2 * reach;
      const y = ((e.clientY - box.top) / box.height - .5) * 2 * reach;
      pill.style.setProperty('--lean-x', x.toFixed(2) + 'px');
      pill.style.setProperty('--lean-y', y.toFixed(2) + 'px');
    });
    document.addEventListener('pointerout', e => {
      const pill = e.target.closest && e.target.closest(LEANS);
      if (!pill || pill.contains(e.relatedTarget)) return;
      pill.style.removeProperty('--lean-x');
      pill.style.removeProperty('--lean-y');
    });
  }

  /* The clear button: a cross that folds into a tick and widens to say what
     it did, then draws back. The width it needs is measured from the word the
     first time, since the font decides it. */
  const ICON_MORPH = '<svg class="morph" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">'
    + '<line class="morph__a" x1="4.6" y1="4.6" x2="13.4" y2="13.4"/>'
    + '<line class="morph__b" x1="13.4" y1="4.6" x2="4.6" y2="13.4"/></svg>';

  /* Gives a round button a word to open into. Returns a setter, since some
     buttons change what they are for — the plus that becomes a close. */
  function wordy(button, word) {
    button.classList.add('icon-btn--wordy');
    button.classList.remove('tip');           // the word replaces the tooltip
    delete button.dataset.tip;
    const span = el('span', 'btn-word', word);
    button.appendChild(span);
    const fit = () => button.style.setProperty('--word-w', (38 + span.scrollWidth) + 'px');
    button.addEventListener('pointerenter', fit);
    button.addEventListener('focus', fit);
    return text => { span.textContent = text; fit(); };
  }

  function clearControl(tip, word, onClick) {
    const button = el('button', 'icon-btn icon-btn--quiet icon-btn--clear');
    button.type = 'button';
    button.innerHTML = ICON_MORPH;
    button.setAttribute('aria-label', tip);
    const setWord = wordy(button, tip);

    button.addEventListener('click', () => {
      onClick();
      setWord(word);
      button.classList.add('is-done');
      clearTimeout(button._back);
      button._back = setTimeout(() => {
        button.classList.remove('is-done');
        setTimeout(() => setWord(tip), 300);
      }, 1500);
    });

    return button;
  }

  /* The edge fade must stop short of the scrollbar, whose width depends on the
     platform and its settings — measured, not assumed. */
  const workspace = document.querySelector('.workspace');
  function measureGutter() {
    workspace.style.setProperty('--sbw', (workspace.offsetWidth - workspace.clientWidth) + 'px');
  }
  measureGutter();
  window.addEventListener('resize', measureGutter);

  /* ---------- unit converter ---------- */

  const UNITS = {
    weight: { base: 'kg', list: [['kg', 'kg', 1], ['g', 'g', .001], ['lb', 'lb', .45359237], ['oz', 'oz', .028349523]] },
    length: { base: 'm', list: [['mm', 'mm', .001], ['cm', 'cm', .01], ['m', 'm', 1], ['in', 'in', .0254], ['ft', 'ft', .3048]] }
  };
  const factor = (kind, unit) => UNITS[kind].list.find(u => u[0] === unit)[2];
  const convert = (kind, value, from, to) => value * factor(kind, from) / factor(kind, to);
  /* enough digits to be useful, none that are noise */
  function fmt(n) {
    const abs = Math.abs(n);
    const places = abs >= 1000 ? 0 : abs >= 100 ? 1 : abs >= 1 ? 2 : 3;
    return String(parseFloat(n.toFixed(places)));
  }

  /* A unit menu of our own: a pill that opens a short list beneath it. Arrow
     keys move, Enter picks, Escape or a click elsewhere closes. */
  function unitPicker(kind, chosen) {
    const root = el('div', 'upick');
    const btn = el('button', 'upick__btn');
    btn.type = 'button';
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    const label = el('span', null, chosen);
    btn.appendChild(label);
    btn.appendChild(svgIcon('chev', '14', CHEVRON));
    root.appendChild(btn);

    const menu = el('div', 'upick__menu');
    menu.hidden = true;
    menu.setAttribute('role', 'listbox');
    root.appendChild(menu);
    let value = chosen;

    function render() {
      menu.innerHTML = '';
      UNITS[kind].list.forEach(([key, name]) => {
        const opt = el('button', 'upick__opt' + (key === value ? ' is-on' : ''));
        opt.type = 'button';
        opt.setAttribute('role', 'option');
        opt.setAttribute('aria-selected', String(key === value));
        opt.appendChild(el('span', null, name));
        if (key === value) { const t = el('span', 'tick'); t.innerHTML = ICON_DONE; opt.appendChild(t); }
        opt.addEventListener('click', e => { e.stopPropagation(); set(key); close(); btn.focus(); });
        menu.appendChild(opt);
      });
    }
    function set(key) { value = key; label.textContent = key; }
    function open() {
      render();
      menu.hidden = false;
      menu.classList.remove('is-mounted');
      void menu.offsetWidth;
      menu.classList.add('is-mounted');
      btn.setAttribute('aria-expanded', 'true');
      const on = menu.querySelector('.is-on') || menu.firstChild;
      if (on) on.focus();
    }
    function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }

    btn.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
    root.addEventListener('keydown', e => {
      if (menu.hidden) return;
      const opts = [...menu.querySelectorAll('.upick__opt')];
      const at = opts.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { opts[(at + 1) % opts.length].focus(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { opts[(at - 1 + opts.length) % opts.length].focus(); e.preventDefault(); }
      else if (e.key === 'Escape') { close(); btn.focus(); e.stopPropagation(); }
      else if (e.key === 'Tab') close();
    });
    document.addEventListener('click', e => { if (!menu.hidden && !root.contains(e.target)) close(); });

    return { root, get value() { return value; } };
  }

  function numInput(placeholder) {
    const input = el('input');
    input.type = 'number';
    input.inputMode = 'decimal';
    input.step = 'any';
    input.placeholder = placeholder;
    return input;
  }

  const ICON_TO = '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 6.5h11l-3-3M16.5 13.5h-11l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function resultLine(name, value, unit, fromText, copyLabel) {
    const box = el('div', 'conv__result');
    box.appendChild(el('div', 'name', name));
    const line = el('div', 'line');
    line.appendChild(el('span', 'from', fromText));
    const arrow = el('span', 'arrow');
    arrow.innerHTML = ICON_TO;
    line.appendChild(arrow);
    const to = el('span', 'to');
    to.appendChild(el('b', null, value));
    to.appendChild(el('small', null, unit));
    line.appendChild(to);
    box.appendChild(line);
    const cp = copyButton(copyLabel, value + ' ' + unit, null, 'Copy Converted ' + name);
    cp.classList.add('copy--brief');
    box.appendChild(cp);
    return box;
  }

  function buildConverter() {
    const root = el('div', 'conv');
    root.id = 'conv';
    root.hidden = true;
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'Unit converter');

    root.appendChild(el('div', 'conv__title', 'Unit Converter'));

    const TABS = [['weight', 'Weight'], ['length', 'Length'], ['box', 'Box']];
    const tabs = el('div', 'conv__tabs');
    tabs.setAttribute('role', 'tablist');
    const thumb = el('span', 'conv__thumb');
    tabs.appendChild(thumb);
    const panes = {};
    let active = 'weight';

    const tabButtons = TABS.map(([key, label], i) => {
      const b = el('button', 'conv__tab' + (i === 0 ? ' is-on' : ''), label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.addEventListener('click', () => show(key));
      tabs.appendChild(b);
      return b;
    });
    root.appendChild(tabs);

    function show(key) {
      active = key;
      const i = TABS.findIndex(([k]) => k === key);
      thumb.style.transform = 'translateX(' + (i * 100) + '%)';
      tabButtons.forEach((b, j) => { b.classList.toggle('is-on', j === i); b.setAttribute('aria-selected', String(j === i)); });
      Object.entries(panes).forEach(([k, pane]) => { pane.hidden = k !== key; });
      const first = panes[key].querySelector('input');
      if (first) first.focus();
    }

    /* one value, one unit each side */
    function simplePane(kind, from, to, placeholder) {
      const pane = el('div', 'conv__pane');
      const row = el('div', 'conv__row');
      const input = numInput(placeholder);
      const selFrom = unitPicker(kind, from);
      const arrow = el('span', 'conv__arrow');
      arrow.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const selTo = unitPicker(kind, to);
      row.append(input, selFrom.root, arrow, selTo.root);
      pane.appendChild(row);
      const go = el('button', 'conv__go', 'Convert');
      go.type = 'button';
      pane.appendChild(go);
      const out = el('div', 'conv__out');
      pane.appendChild(out);

      pane.run = () => {
        const v = parseFloat(input.value);
        out.innerHTML = '';
        if (!Number.isFinite(v)) { input.focus(); return; }
        const r = convert(kind, v, selFrom.value, selTo.value);
        out.appendChild(resultLine(kind === 'weight' ? 'Weight' : 'Length', fmt(r), selTo.value, fmt(v) + ' ' + selFrom.value, kind));
      };
      go.addEventListener('click', pane.run);
      return pane;
    }

    /* a carton: three sides in one unit, a weight in another */
    function boxPane() {
      const pane = el('div', 'conv__pane');
      pane.appendChild(el('div', 'conv__label', 'Length × Width × Height'));
      const dims = el('div', 'conv__row conv__row--dims');
      const L = numInput('L'), W = numInput('W'), H = numInput('H');
      dims.append(L, W, H);
      pane.appendChild(dims);
      const drow = el('div', 'conv__row conv__row--units');
      const dFrom = unitPicker('length', 'mm');
      const dArrow = el('span', 'conv__arrow');
      dArrow.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const dTo = unitPicker('length', 'in');
      drow.append(dFrom.root, dArrow, dTo.root);
      pane.appendChild(drow);

      pane.appendChild(el('div', 'conv__label', 'Weight'));
      const wrow = el('div', 'conv__row');
      const Wt = numInput('Weight');
      const wFrom = unitPicker('weight', 'kg');
      const wArrow = el('span', 'conv__arrow');
      wArrow.innerHTML = dArrow.innerHTML;
      const wTo = unitPicker('weight', 'lb');
      wrow.append(Wt, wFrom.root, wArrow, wTo.root);
      pane.appendChild(wrow);

      const go = el('button', 'conv__go', 'Convert');
      go.type = 'button';
      pane.appendChild(go);
      const out = el('div', 'conv__out');
      pane.appendChild(out);

      pane.run = () => {
        out.innerHTML = '';
        const sides = [L, W, H].map(i => parseFloat(i.value));
        const wt = parseFloat(Wt.value);
        const haveDims = sides.every(Number.isFinite);
        const haveWt = Number.isFinite(wt);
        if (!haveDims && !haveWt) { L.focus(); return; }
        if (haveDims) {
          const c = sides.map(v => fmt(convert('length', v, dFrom.value, dTo.value)));
          out.appendChild(resultLine('Dimensions', c.join(' × '), dTo.value, sides.map(fmt).join(' × ') + ' ' + dFrom.value, 'dimensions'));
        }
        if (haveWt) {
          out.appendChild(resultLine('Weight', fmt(convert('weight', wt, wFrom.value, wTo.value)), wTo.value, fmt(wt) + ' ' + wFrom.value, 'weight'));
        }
      };
      go.addEventListener('click', pane.run);
      return pane;
    }

    panes.weight = simplePane('weight', 'kg', 'lb', 'Weight');
    panes.length = simplePane('length', 'mm', 'in', 'Length');
    panes.box = boxPane();
    Object.values(panes).forEach(p => root.appendChild(p));
    panes.length.hidden = true;
    panes.box.hidden = true;

    // Enter anywhere in the card runs the tab you are on
    root.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); panes[active].run(); }
      if (e.key === 'Enter' && e.target.classList.contains('upick__btn')) e.stopPropagation();
    });

    root.show = show;
    return root;
  }

  const tool = document.getElementById('tool');
  const convToggle = document.getElementById('convToggle');
  const conv = buildConverter();
  tool.appendChild(conv);

  function openConv(open) {
    clearTimeout(conv._exit);
    if (open) {
      conv.classList.remove('is-out');
      conv.hidden = false;
      conv.classList.remove('is-mounted');
      void conv.offsetWidth;
      conv.classList.add('is-mounted');
      convToggle.setAttribute('aria-expanded', 'true');
      const first = conv.querySelector('.conv__pane:not([hidden]) input');
      if (first) first.focus();
    } else {
      if (conv.hidden) return;
      conv.classList.remove('is-mounted');
      conv.classList.add('is-out');
      convToggle.setAttribute('aria-expanded', 'false');
      conv._exit = setTimeout(() => { conv.hidden = true; conv.classList.remove('is-out'); }, 190);
    }
  }
  wordy(convToggle, 'Unit Converter');
  convToggle.addEventListener('click', e => { e.stopPropagation(); openConv(conv.hidden); });
  document.addEventListener('click', e => { if (!conv.hidden && !tool.contains(e.target)) openConv(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !conv.hidden) { openConv(false); convToggle.focus(); } });

  /* The bright light leans toward the pointer while it is over bare canvas —
     gathering speed, then settling — and drifts home when it leaves or
     reaches a card. Its own sway keeps playing underneath. */
  const magnet = document.querySelector('.bg__magnet');
  const magnetBlob = magnet && magnet.querySelector('.bg__blob');
  if (magnet && window.matchMedia('(hover: hover) and (pointer: fine)').matches
      && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const CANVAS = '.app, .workspace, .workspace__inner, .bg, .bg__grid, .bg__blob, .bg__magnet, .page-head, .page-head h1, .lead, .foot-note, .calc, .calc__main, .calc__stage, .calc__side, .result, .result__body, .toolbar';
    let want = { x: 0, y: 0 }, pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 }, pulling = false, ticking = false;
    function tick() {
      // a soft spring: force toward the target, heavily damped
      const k = .0022, damp = .90;
      vel.x = (vel.x + (want.x - pos.x) * k) * damp;
      vel.y = (vel.y + (want.y - pos.y) * k) * damp;
      pos.x += vel.x; pos.y += vel.y;
      magnet.style.transform = 'translate(' + pos.x.toFixed(1) + 'px,' + pos.y.toFixed(1) + 'px)';
      const still = Math.abs(vel.x) + Math.abs(vel.y) < .05 && Math.abs(want.x - pos.x) + Math.abs(want.y - pos.y) < 1;
      if (still && !pulling) { ticking = false; return; }
      requestAnimationFrame(tick);
    }
    function wake() { if (!ticking) { ticking = true; requestAnimationFrame(tick); } }
    document.addEventListener('pointermove', e => {
      const bare = e.target === document.documentElement || e.target === document.body || (e.target.matches && e.target.matches(CANVAS));
      if (!bare) { if (pulling) { pulling = false; want = { x: 0, y: 0 }; wake(); } return; }
      pulling = true;
      const b = magnetBlob.getBoundingClientRect();
      // where the light's centre would be without the pull, then the offset to the pointer
      const cx = b.left + b.width / 2 - pos.x, cy = b.top + b.height / 2 - pos.y;
      want = { x: e.clientX - cx, y: e.clientY - cy };
      wake();
    });
    document.addEventListener('pointerleave', () => { pulling = false; want = { x: 0, y: 0 }; wake(); });
  }

  const themeToggle = document.getElementById('themeToggle');
  function syncTheme() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeToggle.setAttribute('aria-pressed', String(dark));
    themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  themeToggle.addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    syncTheme();
  });
  syncTheme();

  /* The canvas answers the scroll: while the page moves, the lights and the
     grid run several times faster, then ease back to their crawl. Done by
     playback rate on the animations already running, so nothing restarts. */
  let canvasAnims = null, canvasRate = 1, canvasTarget = 1, canvasTicking = false, canvasCalm = null;
  function paceCanvas() {
    canvasRate += (canvasTarget - canvasRate) * .07;
    if (canvasTarget === 1 && Math.abs(canvasRate - 1) < .01) { canvasRate = 1; canvasTicking = false; }
    canvasAnims.forEach(a => { a.playbackRate = canvasRate; });
    if (canvasTicking) requestAnimationFrame(paceCanvas);
  }
  workspace.addEventListener('scroll', () => {
    if (!canvasAnims) canvasAnims = [...document.querySelectorAll('.bg__blob, .bg__grid')].flatMap(n => n.getAnimations());
    if (!canvasAnims.length) return;
    canvasTarget = 7;
    clearTimeout(canvasCalm);
    canvasCalm = setTimeout(() => { canvasTarget = 1; }, 140);

  function productThumb(product) {
    const box = el('span', 'thumb');
    const src = IMAGES[product.product_id];

    if (src) {
      const img = el('img');
      img.src = src;
      img.alt = product.product_id;
      img.loading = 'lazy';
      box.appendChild(img);
    } else {
      box.innerHTML = DRIVE_ART;
    }

    return box;
  }

  const EMPTY_ART = '<svg viewBox="0 0 160 120" fill="none" aria-hidden="true">'
    + '<ellipse cx="80" cy="64" rx="66" ry="44" fill="var(--brand-soft)"/>'
    + '<g transform="rotate(-8 80 66)">'
    + '<rect x="46" y="24" width="68" height="86" rx="9" fill="#3f6fb5"/>'
    + '<rect x="50" y="28" width="60" height="78" rx="6" fill="#dfe8fb"/>'
    + '<circle cx="80" cy="60" r="24" fill="#3f6fb5"/>'
    + '<circle cx="80" cy="60" r="21" fill="#eef3fc"/>'
    + '<circle cx="80" cy="60" r="8" fill="#9db6e0"/>'
    + '<circle cx="80" cy="60" r="3.2" fill="#2c5490"/>'
    + '<path d="M101 98 84 66" stroke="#7f9bd0" stroke-width="6" stroke-linecap="round"/>'
    + '<circle cx="101" cy="98" r="4.8" fill="#2c5490"/>'
    + '<g fill="#9db6e0"><circle cx="54" cy="32" r="2.2"/><circle cx="106" cy="32" r="2.2"/><circle cx="54" cy="102" r="2.2"/><circle cx="106" cy="102" r="2.2"/></g>'
    + '</g>'
    + '<g class="art-glass">'
    + '<circle cx="104" cy="44" r="15" fill="rgba(255,255,255,.35)" stroke="var(--brand)" stroke-width="5"/>'
    + '<path d="M115 55 128 68" stroke="var(--brand)" stroke-width="6" stroke-linecap="round"/>'
    + '</g>'
    + '<g class="art-sparks" fill="var(--brand-line)"><circle cx="30" cy="30" r="3"/><circle cx="134" cy="22" r="2.2"/><circle cx="26" cy="92" r="2.4"/></g>'
    + '</svg>';

  /* A short notice that sees itself out. Takes DOM nodes so a product ID can
     be set in the same face it wears everywhere else. */
  const ICON_ALERT = '<svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">'
    + '<path d="M9 2.6 16.4 15H1.6L9 2.6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>'
    + '<path d="M9 7.2v3.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
    + '<circle cx="9" cy="12.4" r=".95" fill="currentColor"/></svg>';

  function notice(...parts) {
    let host = document.querySelector('.toasts');
    if (!host) {
      host = el('div', 'toasts');
      document.body.appendChild(host);
    }

    const note = el('div', 'toast');
    note.setAttribute('role', 'status');
    const mark = el('span');
    mark.innerHTML = ICON_ALERT;
    note.appendChild(mark);

    const line = el('span');
    parts.forEach(part => line.appendChild(typeof part === 'string' ? document.createTextNode(part) : part));
    note.appendChild(line);

    host.appendChild(note);
    requestAnimationFrame(() => note.classList.add('is-in'));

    setTimeout(() => {
      note.classList.remove('is-in');
      setTimeout(() => note.remove(), 300);
    }, 2900);
  }

  /* ---------- small buttons ---------- */

  const ICON_PLUS = '<svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">'
    + '<path d="M9 3.6v10.8M3.6 9h10.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  const ICON_CROSS = '<svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true">'
    + '<path d="M4.6 4.6l8.8 8.8M13.4 4.6l-8.8 8.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  const ICON_ARROW = '<svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">'
    + '<path d="M9 14.4V3.9M4.4 8.5 9 3.9l4.6 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* The send button carries both its glyphs; is-sent decides which shows. */
  function sendControl(tip, word, onClick) {
    const button = el('button', 'icon-btn icon-btn--send tip');
    button.type = 'button';
    button.innerHTML = '<span class="send__glyphs">'
                     + '<span class="send__ic send__arrow">' + ICON_ARROW + '</span>'
                     + '<span class="send__ic send__check">' + ICON_DONE + '</span></span>';
    button.appendChild(el('span', 'send__word', word));
    button.dataset.tip = tip;
    button.setAttribute('aria-label', tip);
    button.addEventListener('click', onClick);
    return button;
  }

  /* Confirms a send even when the results below look unchanged. The ring is a
     one-shot, so it is rewound by hand; the glyph swap is a transition and
     simply retargets if a send lands while the last one is still showing. */
  function flashSent(button) {
    if (!button.style.getPropertyValue('--send-w')) {
      const word = button.querySelector('.send__word');
      button.style.setProperty('--send-w', (40 + word.scrollWidth) + 'px');
    }
    button.classList.remove('is-ringing');
    void button.offsetWidth;
    button.classList.add('is-ringing', 'is-sent');

    clearTimeout(button._sent);
    button._sent = setTimeout(() => button.classList.remove('is-sent', 'is-ringing'), 1500);
  }

  function iconButton(tip, icon, onClick, cls) {
    const button = el('button', (cls || 'icon-btn') + ' tip');
    button.type = 'button';
    button.innerHTML = icon;
    button.dataset.tip = tip;
    button.setAttribute('aria-label', tip);
    button.addEventListener('click', onClick);
    return button;
  }

  /* ---------- picker ----------
     One capacity list, reused by the lookup page and by every calculator row.
     options:
       variant         'composer' for the bubble that unfolds into its own list,
                       'compact' for the trigger + floating panel used in rows
       placeholder     trigger text before anything is picked
       label           what the trigger shows once picked: (product) => string
       onSelect        (product) => void
  */

  /* What the typed text is aiming at.
       digits (optionally with "tb")  -> capacity, so 8 finds both 8 TB drives
       something a Product ID starts with -> Product IDs only
       something a SKU starts with        -> SKUs only
       anything else                      -> ID, SKU and item together */
  function search_(query) {
    const q = query.trim().toLowerCase();
    if (!q) return PRODUCTS.slice();

    const asCapacity = q.match(/^(\d+)\s*(tb)?$/);
    if (asCapacity) {
      const digits = asCapacity[1];
      const exact = parseInt(digits, 10);
      return PRODUCTS
        .filter(p => String(p.capacity) === digits || String(p.capacity).startsWith(digits))
        .sort((a, b) => (a.capacity === exact ? 0 : 1) - (b.capacity === exact ? 0 : 1)
                     || a.capacity - b.capacity
                     || a.is_pro - b.is_pro);
    }

    const startsAnId = PRODUCTS.some(p => p.product_id.toLowerCase().startsWith(q));
    const startsASku = PRODUCTS.some(p => p.sku.toLowerCase().startsWith(q));

    if (startsAnId && !startsASku) return PRODUCTS.filter(p => p.product_id.toLowerCase().includes(q));
    if (startsASku && !startsAnId) return PRODUCTS.filter(p => p.sku.toLowerCase().includes(q));

    return PRODUCTS.filter(p =>
      (p.item + ' ' + p.sku + ' ' + p.product_id).toLowerCase().includes(q));
  }

  function createPicker(options) {
    const opts = Object.assign({
      variant: 'compact',                 // 'composer' is the big bubble on the lookup page
      placeholder: 'Choose a capacity',
      searchPlaceholder: 'Filter by Capacity, Product ID, or SKU',
      label: p => p.capacity + ' TB · ' + p.product_id,
      marked: () => false,    // (product) => true when it is already on the list
      stayOpen: false,        // keep the list up after a pick, for choosing several
      onSelect: () => {},
      onOpen: () => {},
      onClose: () => {}       // gets true when the close followed a pick
    }, options || {});

    const PICK_HOLD = 140;    // the row gets this long to show the pick landed

    function tickBadge() {
      const badge = el('span', 'row__tick');
      badge.innerHTML = ICON_DONE;
      return badge;
    }

    function markTaken(row, product) {
      if (!opts.marked(product)) return;
      row.classList.add('is-taken');
      row.appendChild(tickBadge());
    }

    const composerMode = opts.variant === 'composer';
    let selectedId = null;
    let showing = false;
    let picking = false;      // true only while a pick is closing the list
    let settling = false;     // true while close() hands focus back

    const search = el('input', composerMode ? 'composer__field' : 'search');
    search.type = 'text';
    search.placeholder = opts.searchPlaceholder;
    search.autocomplete = 'off';
    search.spellcheck = false;
    search.setAttribute('aria-label', 'Search by capacity, product ID, or SKU');

    const head = el('div', 'head');
    const headCap = el('span', 'h-cap', 'Capacity');
    const headName = el('span', 'h-name', 'Product ID');
    const headSku = el('span', 'h-sku', 'SKU');
    head.append(headCap, headName, headSku);

    const menu = el('ul', 'menu');

    let root, panel, trigger = null, triggerLabel = null, bar = null;

    if (composerMode) {
      // search bar and list are one bubble: the list unfolds inside it
      root = el('div', 'composer');
      panel = el('div', 'composer__list');
      panel.append(head, menu);
      bar = el('div', 'composer__bar');
      root.append(search, panel, bar);
    } else {
      root = el('div', 'picker picker--compact');
      trigger = el('button', 'trigger');
      trigger.type = 'button';
      trigger.setAttribute('aria-haspopup', 'true');
      trigger.setAttribute('aria-expanded', 'false');
      triggerLabel = el('span', 'placeholder', opts.placeholder);
      trigger.appendChild(triggerLabel);
      trigger.appendChild(svgIcon('chev', '16', CHEVRON));

      panel = el('div', 'panel');
      panel.hidden = true;
      const wrap = el('div', 'panel-search');
      wrap.appendChild(search);
      panel.append(wrap, head, menu);
      root.append(trigger, panel);
    }

    /* rows */

    function productRow(product, flat) {
      const row = el('button', 'row');
      row.type = 'button';
      row.dataset.productId = product.product_id;
      if (product.product_id === selectedId) row.setAttribute('aria-current', 'true');

      row.appendChild(el('span', 'cap', product.capacity + ' TB'));

      if (flat) {
        // filter results: capacity on the left, then Product ID · SKU
        const line = el('div', 'name');
        line.appendChild(el('b', null, product.product_id));
        line.appendChild(el('span', 'sep', '·'));
        line.appendChild(el('span', 'code', product.sku));
        row.appendChild(line);
      } else {
        // flyout: Product ID over SKU
        const stack = el('div', 'stack');
        stack.appendChild(el('b', null, product.product_id));
        stack.appendChild(el('span', 'code', product.sku));
        row.appendChild(stack);
      }

      markTaken(row, product);
      row.addEventListener('click', () => select(product.product_id));
      return row;
    }

    function renderMenu(query) {
      menu.innerHTML = '';
      const q = query.trim().toLowerCase();

      // filter results merge Product ID and SKU into one column
      headName.textContent = q ? 'Product ID · SKU' : 'Product ID';
      headSku.hidden = Boolean(q);

      if (q) {
        const hits = search_(q);
        if (!hits.length) {
          const li = el('li');
          const miss = el('div', 'row', 'Nothing matches “' + query.trim() + '”');
          miss.style.color = 'var(--muted)';
          li.appendChild(miss);
          menu.appendChild(li);
          return;
        }
        hits.forEach(p => {
          const li = el('li');
          li.appendChild(productRow(p, true));
          menu.appendChild(li);
        });
        return;
      }

      CATALOG.forEach(group => {
        const li = el('li');

        if (!group.has_multiple) {
          const only = group.products[0];
          const row = el('button', 'row');
          row.type = 'button';
          row.dataset.productId = only.product_id;
          if (only.product_id === selectedId) row.setAttribute('aria-current', 'true');
          row.appendChild(el('span', 'cap', group.label));
          row.appendChild(el('span', 'name', only.product_id));
          row.appendChild(el('span', 'count', only.sku));
          markTaken(row, only);
          row.addEventListener('click', () => select(only.product_id));
          li.appendChild(row);
        } else {
          li.className = 'group';

          const parent = el('button', 'row');
          parent.type = 'button';
          parent.setAttribute('aria-haspopup', 'true');
          parent.setAttribute('aria-expanded', 'false');
          parent.appendChild(el('span', 'cap', group.label));
          parent.appendChild(el('span', 'name', 'View Products'));
          parent.appendChild(svgIcon('arrow', '14', CARET));
          li.appendChild(parent);

          const flyout = el('div', 'flyout');
          const card = el('div', 'card');
          const list = el('ul');
          group.products.forEach(p => {
            const child = el('li');
            child.appendChild(productRow(p, false));
            list.appendChild(child);
          });
          card.appendChild(list);
          flyout.appendChild(card);
          li.appendChild(flyout);

          li.addEventListener('mouseenter', () => { if (wide()) showFlyout(li); });
          li.addEventListener('mouseleave', () => {
            if (!li.classList.contains('is-open')) hideFlyout(li);
          });
          parent.addEventListener('click', () => toggleGroup(li));
        }

        menu.appendChild(li);
      });
    }

    function placeFlyout(li) {
      if (!wide()) return;
      const flyout = li.querySelector('.flyout');
      // only a mounted sub-list has a box worth measuring
      if (!flyout || !flyout.classList.contains('is-mounted')) return;
      const anchor = li.getBoundingClientRect();

      // park it at 0,0 first: where that lands tells us what the browser is
      // measuring from, which is not always the viewport. The fold-open rides on
      // the card inside, so this shell measures the same open or closed.
      flyout.style.left = '0px';
      flyout.style.top = '0px';
      const origin = flyout.getBoundingClientRect();
      const width = origin.width || flyout.offsetWidth;
      const height = origin.height || flyout.offsetHeight;

      // The workspace masks its edges, and a mask clips everything painted past
      // its box, fixed children included — so its box, less the scrollbar and
      // the fade bands, is the real limit. Sideways the sub-list prefers the
      // row's right, takes the left if that is the side with room, and only
      // otherwise sits over the list. Up and down it stays inside the list it
      // came out of, which keeps it off the buttons below.
      const ws = workspace.getBoundingClientRect();
      const edge = parseFloat(getComputedStyle(workspace).getPropertyValue('--edge')) || 56;
      const minX = ws.left + 12, maxX = ws.left + workspace.clientWidth - 12;
      const box = (menu.closest('.composer__list, .panel') || menu).getBoundingClientRect();
      const minY = Math.max(box.top + 6, ws.top + edge);
      const maxY = Math.min(box.bottom - 6, ws.bottom - edge);

      let left = anchor.right;
      if (left + width > maxX) {
        const onLeft = anchor.left - width - 8;
        left = onLeft >= minX ? onLeft : Math.max(minX, maxX - width);
      }
      const top = Math.max(minY, Math.min(anchor.top - 8, maxY - height));

      flyout.style.left = (left - origin.left) + 'px';
      flyout.style.top = (top - origin.top) + 'px';
    }

    /* A sub-list joins the layout, gets placed, and only then is let go, so the
       unfold has somewhere to travel from. Folding away keeps the node around
       until the transition has played out. */
    const FLYOUT_EXIT = 270;

    function showFlyout(li) {
      const flyout = li.querySelector('.flyout');
      if (!flyout) return;

      clearTimeout(flyout._exit);
      flyout.classList.add('is-mounted');
      placeFlyout(li);

      if (flyout._enter) cancelAnimationFrame(flyout._enter);
      flyout._enter = requestAnimationFrame(() => {
        flyout._enter = null;
        flyout.classList.add('is-in');
      });
    }

    function hideFlyout(li, now) {
      const flyout = li.querySelector('.flyout');
      if (!flyout) return;

      if (flyout._enter) {
        cancelAnimationFrame(flyout._enter);
        flyout._enter = null;
      }
      flyout.classList.remove('is-in');
      clearTimeout(flyout._exit);

      if (now) { flyout.classList.remove('is-mounted'); return; }
      flyout._exit = setTimeout(() => flyout.classList.remove('is-mounted'), FLYOUT_EXIT);
    }

    function toggleGroup(li) {
      const open = li.classList.toggle('is-open');
      li.querySelector('.row').setAttribute('aria-expanded', String(open));
      if (open) {
        showFlyout(li);
        menu.querySelectorAll('li.group.is-open').forEach(other => {
          if (other !== li) closeGroup(other);
        });
      } else {
        hideFlyout(li);
      }
    }

    function closeGroup(li, now) {
      li.classList.remove('is-open');
      const row = li.querySelector('.row');
      if (row) row.setAttribute('aria-expanded', 'false');
      hideFlyout(li, now);
    }

    /* open / close */

    /* The floating panel unfolds and folds the way the composer bubble does, so
       it has to outlive its own closing — [hidden] goes back on at the end. */
    const PANEL_EXIT = 190;

    function showPanel() {
      clearTimeout(panel._exit);
      panel.classList.remove('is-out');
      panel.hidden = false;
      // rewind, so reopening mid-close still plays the unfold
      panel.classList.remove('is-mounted');
      void panel.offsetWidth;
      panel.classList.add('is-mounted');
    }

    function hidePanel() {
      if (panel.hidden) return;
      panel.classList.remove('is-mounted');
      panel.classList.add('is-out');
      clearTimeout(panel._exit);
      panel._exit = setTimeout(() => {
        panel.hidden = true;
        panel.classList.remove('is-out');
      }, PANEL_EXIT);
    }

    function open(focusSearch) {
      showing = true;
      if (composerMode) root.classList.add('is-open');
      else showPanel();
      if (trigger) trigger.setAttribute('aria-expanded', 'true');
      renderMenu(search.value);
      if (focusSearch) search.focus();
      opts.onOpen();
    }

    function close(refocus) {
      showing = false;
      if (composerMode) root.classList.remove('is-open');
      else hidePanel();
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      // Every group, not just the pinned ones: a sub-list floating beside the
      // menu sits outside its overflow, so one left open on hover would be
      // stranded on screen after the list folds away.
      menu.querySelectorAll('li.group').forEach(li => closeGroup(li, true));
      if (refocus) {
        // focusing the field would otherwise trip the handler that reopens it
        settling = true;
        (trigger || search).focus();
        settling = false;
      }
      opts.onClose(picking);
      picking = false;
    }

    function select(productId) {
      const product = PRODUCTS.find(p => p.product_id === productId);
      if (!product) return;
      selectedId = productId;
      if (triggerLabel) {
        triggerLabel.textContent = opts.label(product);
        triggerLabel.className = 'picked';
      }
      if (!opts.stayOpen) search.value = '';
      picking = true;

      // the row swells and takes its tick, then the list folds — or, when it
      // is staying up for more picks, redraws so the row shows its new state
      const row = menu.querySelector('.row[data-product-id="' + productId + '"]');
      if (row) {
        row.classList.add('is-picked');
        if (!row.querySelector('.row__tick')) row.appendChild(tickBadge());
      }
      // focus moves now, as the close used to move it, so wherever onSelect
      // sends it afterwards is where it stays
      settling = true;
      (trigger || search).focus();
      settling = false;

      opts.onSelect(product);
      setTimeout(() => {
        if (!showing) return;
        if (opts.stayOpen) renderMenu(search.value);
        else close(false);
      }, PICK_HOLD);
    }

    // put a product back in place quietly, for when a pick has to be undone
    function restore(productId) {
      const product = productId && PRODUCTS.find(p => p.product_id === productId);
      if (!product) { clear(); return; }
      selectedId = productId;
      if (triggerLabel) {
        triggerLabel.textContent = opts.label(product);
        triggerLabel.className = 'picked';
      }
    }

    function clear() {
      selectedId = null;
      if (triggerLabel) {
        triggerLabel.textContent = opts.placeholder;
        triggerLabel.className = 'placeholder';
      }
      search.value = '';
      renderMenu('');
    }

    if (trigger) {
      trigger.addEventListener('click', () => showing ? close(false) : open(true));
    }

    // a pointer heading for the buttons or the field leaves any hover-opened
    // sub-list behind
    [bar, search].forEach(node => node && node.addEventListener('pointerenter', () => {
      menu.querySelectorAll('li.group:not(.is-open)').forEach(li => hideFlyout(li));
    }));

    // the search bar opens the same menu
    search.addEventListener('focus', () => { if (!showing && !settling) open(false); });
    search.addEventListener('click', () => { if (!showing) open(false); });
    search.addEventListener('input', () => {
      if (!showing) open(false);
      renderMenu(search.value);
    });

    // Enter in the search bar takes the first match — but only when something
    // was typed, otherwise it would silently grab whatever sits at the top
    search.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (opts.stayOpen) {
        // Enter is how a run of picks ends; typed text takes its first match
        // on the way out, unless that match is already on the list
        const first = search.value.trim() ? rows()[0] : null;
        if (first && !first.classList.contains('is-taken')) first.click();
        if (showing) close(true);
        e.preventDefault();
        e.stopPropagation();       // or the list handler would open it right back
        return;
      }
      if (!search.value.trim()) return;
      const first = rows()[0];
      if (first) { first.click(); e.preventDefault(); }
    });

    document.addEventListener('click', e => {
      // a target already gone from the page was inside something we redrew
      // on that same click (a chip's ×) — not a click outside
      if (showing && e.target.isConnected && !root.contains(e.target)) close(false);
    });

    // a scrolled menu would leave an open flyout behind
    menu.addEventListener('scroll', () => {
      const openLi = menu.querySelector('li.group.is-open') || menu.querySelector('li.group:hover');
      if (openLi) placeFlyout(openLi);
    });

    /* keyboard */

    function rows() {
      return Array.from(menu.querySelectorAll('button.row')).filter(row => {
        const flyout = row.closest('.flyout');
        return !flyout || flyout.closest('li.group').classList.contains('is-open');
      });
    }

    function step(dir) {
      const list = rows();
      if (!list.length) return;
      const at = list.indexOf(document.activeElement);
      const next = at === -1 ? (dir > 0 ? 0 : list.length - 1) : (at + dir + list.length) % list.length;

      // focus without the browser's instant jump, then ease it into view
      list[next].focus({ preventScroll: true });
      list[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function onKeyDown(e) {
      if (e.key === 'Escape') {
        const openGroup = document.activeElement.closest?.('li.group.is-open');
        if (openGroup && document.activeElement.closest('.flyout')) {
          closeGroup(openGroup);
          openGroup.querySelector('.row').focus();
        } else {
          close(true);
        }
        e.preventDefault();
        return;
      }

      if (!showing) {
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          open(false);
          // land on the first row straight away, so one press is enough
          if (e.key === 'ArrowDown') step(1);
          e.preventDefault();
        }
        return;
      }

      if (e.key === 'ArrowDown') { step(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { step(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') {
        const li = document.activeElement.closest?.('li.group');
        if (li && !li.classList.contains('is-open')) toggleGroup(li);
        const first = li && li.querySelector('.flyout .row');
        if (first) { first.focus(); e.preventDefault(); }
      }
      else if (e.key === 'ArrowLeft') {
        const li = document.activeElement.closest?.('li.group.is-open');
        if (li) { closeGroup(li); li.querySelector('.row').focus(); e.preventDefault(); }
      }
    }

    root.addEventListener('keydown', onKeyDown);

    // Focus can end up outside the list — the page body after a re-render, say —
    // and then arrow keys would go nowhere. While the list is open, pick them up
    // from the document too, unless the listener above already has them.
    document.addEventListener('keydown', e => {
      if (!showing) return;
      const here = document.activeElement;
      if (here && here !== document.body && root.contains(here)) return;
      onKeyDown(e);
    });

    menu.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const row = document.activeElement;
        if (row.classList?.contains('row')) {
          row.click();
          e.preventDefault();
          // the pick already closed the list; without this the same keystroke
          // reaches the handler that opens a closed list and reopens it
          e.stopPropagation();
        }
        return;
      }

      // typing while a row is focused should carry on filtering, not fall on the floor
      if (e.key === 'Backspace' || (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey)) {
        search.focus();
      }
    });

    // a sub-list placed while its list was still unfolding was measured
    // against a box that had not reached its size yet; settle it once the
    // list has
    const replace = () => menu.querySelectorAll('li.group').forEach(li => {
      const f = li.querySelector('.flyout');
      if (f && f.classList.contains('is-mounted')) placeFlyout(li);
    });
    panel.addEventListener('animationend', replace);
    panel.addEventListener('transitionend', replace);

    window.addEventListener('resize', () => {
      menu.querySelectorAll('li.group.is-open').forEach(placeFlyout);
    });

    renderMenu('');

    return {
      root,
      bar,
      field: search,
      open,
      close,
      clear,
      restore,
      takeFirst() {
        if (!search.value.trim()) return false;
        const first = rows()[0];
        if (!first || first.classList.contains('is-taken')) return false;
        first.click();
        return true;
      },
      get isOpen() { return showing; },
      refresh() { if (showing) renderMenu(search.value); },
      get selected() { return selectedId ? PRODUCTS.find(p => p.product_id === selectedId) : null; }
    };
  }

  function round2(n) { return Math.round(n * 100) / 100; }
</script>


<script>
  const lines = document.getElementById('lines');
  const out = document.getElementById('out');
  const stage = document.getElementById('stage');
  const side = document.getElementById('side');

  const BOX = PALLET.box;                      // 20 x 11 x 9 in (L x W x H)
  const PER_BOX = PALLET.drives_per_box;       // drives per carton
  const PER_LAYER = PALLET.boxes_per_layer;    // cartons per layer
  const ALONG_LENGTH = PALLET.cols;            // cartons across the 40" side
  const ALONG_WIDTH = PALLET.rows;             // cartons across the 44" side

  const SEND_UNIT = UNIT === 'lb' ? 'lbs' : UNIT;

  const entries = [];
  let sendBtn = null;
  let addProductBtn = null;
  let setAddWord = null;

  /* An empty pallet with an arrow settling onto it: the deck and its slats
     in the page's blues, a soft disc behind, and the arrow in the brand colour
     so it reads as the thing to do. */
  const ART_EMPTY_PALLET = '<svg viewBox="0 0 160 120" fill="none" aria-hidden="true">'
    + '<ellipse cx="80" cy="64" rx="66" ry="44" fill="var(--brand-soft)"/>'
    + '<g class="art-arrow">'
    + '<path d="M80 18v34" stroke="var(--brand)" stroke-width="6" stroke-linecap="round"/>'
    + '<path d="M66 40 80 54 94 40" stroke="var(--brand)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'
    + '</g>'
    + '<g transform="translate(0 6)">'
    + '<path d="M80 62 130 82 80 102 30 82Z" fill="#3f6fb5"/>'
    + '<path d="M30 82v8l50 20v-8Z" fill="#2c5490"/>'
    + '<path d="M130 82v8l-50 20v-8Z" fill="#245081"/>'
    + '<path d="M44 76.4 90 94.8M58 70.8 104 89.2M72 65.2 118 83.6" stroke="#2c5490" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>'
    + '<path d="M40 92v7l8 3.2v-7ZM76 106v7l8 3.2v-7ZM112 92v7l8-3.2v-7Z" fill="#1d3f6e"/>'
    + '</g>'
    + '<g fill="var(--brand-line)"><circle cx="34" cy="30" r="3"/><circle cx="128" cy="24" r="2.2"/><circle cx="140" cy="48" r="2.6"/></g>'
    + '</svg>';


  if (!CATALOG.length) {
    document.getElementById('lead').remove();
    document.getElementById('composer').remove();
    out.innerHTML = '<p class="empty">No drive data loaded. Check that hdd.json sits next to app.py and contains valid JSON, then reload.</p>';
  } else {
    addLine();
    renderIdle();

    const bar = document.getElementById('formBar');
    addProductBtn = iconButton('Add another product', ICON_PLUS, e => {
      e.stopPropagation();            // keep the new row's list from closing again
      // once it has turned, the cross folds the open list away
      const open = entries.find(entry => entry.picker.isOpen);
      if (open) { open.picker.close(false); return; }
      const entry = addLine(true);
      // wait for the row to finish unfolding: while it folds it clips its own
      // overflow, which would cut off the list dropping out of it
      setTimeout(() => entry.picker.open(true), ROW_IN);
    }, 'icon-btn icon-btn--toggle');
    setAddWord = wordy(addProductBtn, 'Add product');
    bar.appendChild(addProductBtn);
    bar.appendChild(el('span', 'spacer'));
    bar.appendChild(clearControl('Start Over', 'Cleared', startOver));
    sendBtn = sendControl('Calculate Pallet', 'Calculated', calculate);
    bar.appendChild(sendBtn);
  }

  /* ---------- rows ---------- */

  /* Rows fold in and out over their own measured height, the way the lists do. */
  const ROW_IN = 240, ROW_OUT = 220;

  function foldIn(line) {
    line.style.setProperty('--row-h', line.scrollHeight + 'px');
    line.classList.add('is-entering');
    setTimeout(() => {
      line.classList.remove('is-entering');
      line.style.removeProperty('--row-h');
    }, ROW_IN);
  }

  function foldOut(line) {
    line.style.setProperty('--row-h', line.scrollHeight + 'px');
    line.classList.add('is-leaving');
    setTimeout(() => line.remove(), ROW_OUT);
  }

  /* Any row's list being open turns the plus into the cross that closes it. */
  function armAdd() {
    if (!addProductBtn) return;
    const open = entries.some(entry => entry.picker.isOpen);
    addProductBtn.classList.toggle('is-x', open);
    const word = open ? 'Close list' : 'Add product';
    if (setAddWord) setAddWord(word);
    addProductBtn.setAttribute('aria-label', word);
  }

  function addLine(animate) {
    const line = el('div', 'line');

    const number = el('span', 'line__n');
    line.appendChild(number);

    const pick = el('div', 'line__pick');
    let held = null;                       // what this row had before the last pick

    const picker = createPicker({
      variant: 'compact',
      placeholder: 'Choose a product',
      searchPlaceholder: 'Filter by Capacity, Product ID, or SKU',
      label: p => p.capacity + ' TB · ' + p.product_id,
      marked: p => entries.some(entry =>
        entry.picker.selected && entry.picker.selected.product_id === p.product_id),
      onOpen: armAdd,
      onClose: armAdd,
      onSelect: product => {
        const clash = entries.some(other =>
          other.picker !== picker &&
          other.picker.selected &&
          other.picker.selected.product_id === product.product_id
        );

        if (clash) {
          notice(el('b', null, product.product_id), ' is already on this pallet.');
          picker.restore(held && held.product_id);      // leave the row as it was
          return;
        }

        held = product;
        line.classList.remove('is-bad');
        qty.focus();
      }
    });
    pick.appendChild(picker.root);
    line.appendChild(pick);

    const qtyWrap = el('div', 'line__qty');
    const qty = el('input', 'qty');
    qty.type = 'number';
    qty.min = String(PER_BOX);
    qty.step = String(PER_BOX);
    qty.placeholder = 'HDD Units';
    qty.setAttribute('aria-label', 'HDD units ordered');
    qty.addEventListener('input', () => line.classList.remove('is-bad'));
    qty.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
    // step in whole cartons, and start at one carton from empty
    function nudge(direction) {
      const now = parseInt(qty.value, 10);
      const next = Number.isFinite(now) ? now + direction * PER_BOX : PER_BOX;
      qty.value = String(Math.max(PER_BOX, next));
      line.classList.remove('is-bad');
      qty.focus();
    }

    /* One step on a press; hold it and the steps keep coming. The pointer path
       takes the first step itself and then swallows the click that follows it,
       so a mouse press is never counted twice — the keyboard still arrives as
       a plain click and steps once. */
    function holdable(button, direction) {
      let timer = null, byPointer = false;
      const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; };

      button.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        e.preventDefault();                     // keep focus where nudge puts it
        byPointer = true;
        nudge(direction);
        button.setPointerCapture(e.pointerId);
        timer = setTimeout(() => { timer = setInterval(() => nudge(direction), 70); }, 380);
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => button.addEventListener(type, stop));
      button.addEventListener('click', () => {
        if (byPointer) { byPointer = false; return; }
        nudge(direction);
      });
    }

    const less = el('button', 'qty-step', '−');
    less.type = 'button';
    less.setAttribute('aria-label', 'Fewer units');
    holdable(less, -1);

    const more = el('button', 'qty-step', '+');
    more.type = 'button';
    more.setAttribute('aria-label', 'More units');
    holdable(more, 1);

    qty.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();                       // the field steps by cartons, not by one
      nudge(e.key === 'ArrowUp' ? 1 : -1);
    });

    qtyWrap.append(less, qty, more);
    line.appendChild(qtyWrap);

    const remove = el('button', 'line__rm', '×');
    remove.type = 'button';
    remove.title = 'Remove this row';
    remove.setAttribute('aria-label', 'Remove this row');
    remove.addEventListener('click', () => {
      const at = entries.findIndex(entry => entry.line === line);
      if (at > -1) entries.splice(at, 1);
      foldOut(line);
      renumber();
      armAdd();               // the row that held the open list is gone
    });
    line.appendChild(remove);

    lines.appendChild(line);
    if (animate) foldIn(line);

    const entry = { line, picker, qty, number, remove };
    entries.push(entry);
    renumber();
    return entry;
  }

  function renumber() {
    entries.forEach((entry, i) => {
      entry.number.textContent = i + 1;
      entry.remove.hidden = entries.length === 1;
    });
  }

  function startOver() {
    // the rows on their way out are no longer part of the order, but they stay
    // in the layout long enough to fold away before the fresh one unfolds
    const leaving = entries.splice(0, entries.length);
    leaving.forEach(entry => { entry.picker.close(false); foldOut(entry.line); });
    out.innerHTML = '';
    stage.innerHTML = '';
    renderIdle();
    armAdd();

    setTimeout(() => {
      lines.innerHTML = '';
      addLine(true);
    }, ROW_OUT);
  }

  /* ---------- the pallet itself ---------- */

  /* A part-filled layer, in the order cartons go down:
       1  one carton, centred on the pallet                          20 x 11
       2  beside it, long (20 in) sides together                     20 x 22
       3  turned crosswise beside those two, centred on their seam   31 x 22
       4  pairs square it up                                         40 x 22
       5  one across the middle of the two columns                   40 x 33
       6  pairs again                                                40 x 33
       7  one across the middle, taking the last row                 40 x 44
       8  full layer                                                 40 x 44
     A lone odd carton lies across the seam between the two columns, so it
     claims a whole 11 in row rather than half of one. */
  function layerFootprint(cartons) {
    if (cartons >= PER_LAYER) {
      return {
        length: BOX.length * ALONG_LENGTH,
        width: BOX.width * ALONG_WIDTH,
        layout: ALONG_LENGTH + ' × ' + ALONG_WIDTH + ' cartons, full layer'
      };
    }
    if (cartons === 1) {
      return { length: BOX.length, width: BOX.width, layout: '1 carton' };
    }
    if (cartons === 2) {
      return { length: BOX.length, width: BOX.width * 2, layout: '2 cartons, long sides together' };
    }
    if (cartons === 3) {
      // the third carton turns 90° and sits alongside, adding its width to the length
      return {
        length: BOX.length + BOX.width,
        width: BOX.width * 2,
        layout: '2 cartons plus 1 turned crosswise beside them'
      };
    }
    const rows = Math.ceil(cartons / ALONG_LENGTH);
    const paired = cartons % 2 === 0;
    return {
      length: BOX.length * ALONG_LENGTH,
      width: BOX.width * rows,
      layout: ALONG_LENGTH + ' × ' + (paired ? rows : rows - 1) + ' cartons'
        + (paired ? '' : ' plus 1 across the middle')
    };
  }

  function buildPallet(order) {
    const rows = order.map(item => {
      const cartons = item.drives / PER_BOX;   // validated as a whole number
      return {
        product: item.product,
        drives: item.drives,
        cartons: cartons,
        weight: round2(cartons * item.product.weight)
      };
    });

    const cartons = rows.reduce((sum, r) => sum + r.cartons, 0);
    const drives = rows.reduce((sum, r) => sum + r.drives, 0);
    const weight = round2(rows.reduce((sum, r) => sum + r.weight, 0));

    const layers = Math.ceil(cartons / PER_LAYER);
    const height = layers * BOX.height;

    // a full bottom layer sets the footprint; extra layers stack on top of it
    const footprint = layerFootprint(cartons);

    return {
      rows: rows,
      footprint: footprint,
      cartons: cartons,
      drives: drives,
      weight: weight,
      layers: layers,
      topLayer: cartons % PER_LAYER || PER_LAYER,
      length: footprint.length,
      width: footprint.width,
      height: height,
      full: cartons >= PER_LAYER
    };
  }


  /* ---------- pallet view ----------
     A small orthographic renderer: every carton and pallet board is an
     axis-aligned box, so each one projects to at most three visible faces.
     Faces from the whole scene are sorted back to front and drawn as SVG
     polygons, which keeps this dependency-free and works offline.

     x runs along the 40 in side, y along the 44 in side, z up. */

  const DECK_HEIGHT = 5.5;              // the pallet itself, not part of the quote
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const CARTON_FILL = [190, 157, 124];        // #be9d7c
  const CARTON_EDGE = '#57422d';              // dark enough that every carton stays countable
  const WOOD_FILL = [0, 94, 166];             // #005ea6, the usual plastic-pallet blue
  const WOOD_EDGE = '#00406f';
  const WOOD_GRAIN = 'rgba(0, 36, 80, .5)';   // moulded grain lines in the plastic
  const FACE_LIGHT = { top: 1, x: 0.82, y: 0.63 };

  /* Packaging labels, drawn once into <defs> and stamped onto a carton face with
     an affine transform. Orthographic projection maps a rectangle to a
     parallelogram, so one <use> per label is enough — no need to re-draw every
     barcode on every frame. Artwork space is 100 wide by 141 tall. */
  const ART_W = 100, ART_H = 141;

  function barcode(x, y, w, h, seed, modules) {
    let state = seed, out = '';
    const next = () => { state = (state * 1103515245 + 12345) % 2147483648; return state / 2147483648; };
    const unit = w / (modules || 46);
    let at = x;
    while (at < x + w) {
      const bar = unit * (1 + Math.floor(next() * 3));
      const gap = unit * (1 + Math.floor(next() * 2));
      if (at + bar > x + w) break;
      out += '<rect x="' + at.toFixed(2) + '" y="' + y + '" width="' + bar.toFixed(2)
           + '" height="' + h + '"/>';
      at += bar + gap;
    }
    return out;
  }

  /* Blocks standing in for words. Real text is unreadable at the size a label
     ends up on screen, and these cost a handful of rects a line. */
  function words(x, y, w, h, seed) {
    let state = seed, out = '';
    const next = () => { state = (state * 1103515245 + 12345) % 2147483648; return state / 2147483648; };
    let at = x;
    while (at < x + w - 3) {
      const word = Math.min(5 + next() * 13, x + w - at);
      out += '<rect x="' + at.toFixed(1) + '" y="' + y + '" width="' + word.toFixed(1)
           + '" height="' + h + '" rx="' + (h / 3).toFixed(2) + '"/>';
      at += word + 2.6;
    }
    return out;
  }

  function manufacturerLabel() {
    let art = '<path d="M0 6 A6 6 0 0 1 6 0 H94 A6 6 0 0 1 100 6 V135 A6 6 0 0 1 94 141'
            + ' H6 A6 6 0 0 1 0 135 Z" fill="#ffffff" stroke="#b9b1a4" stroke-width="1.2"/>';

    // two large barcodes across the top
    art += '<g fill="#1b1b20">' + barcode(7, 7, 86, 23, 17, 44) + barcode(7, 34, 86, 23, 91, 44) + '</g>';
    art += '<rect x="7" y="60" width="86" height="1" fill="#cdc6ba"/>';

    // twenty smaller ones, ten to a column
    art += '<g fill="#26262c">';
    for (let row = 0; row < 10; row++) {
      const y = 65 + row * 7.4;
      art += barcode(7, y, 40, 5, 31 + row * 7, 24);
      art += barcode(53, y, 40, 5, 211 + row * 13, 24);
    }
    art += '</g>';

    return art;
  }

  function shippingLabel() {
    let art = '<path d="M0 6 A6 6 0 0 1 6 0 H94 A6 6 0 0 1 100 6 V135 A6 6 0 0 1 94 141'
            + ' H6 A6 6 0 0 1 0 135 Z" fill="#ffffff" stroke="#b9b1a4" stroke-width="1.2"/>';

    // sender on the left, recipient on the right, split by a rule
    art += '<rect x="46" y="4" width="0.8" height="24" fill="#2b2b33"/>';
    art += '<g fill="#6f6f79">' + words(5, 5, 12, 2.2, 3) + words(51, 5, 9, 2.2, 5) + '</g>';
    art += '<g fill="#8b8b95">';
    for (let line = 0; line < 4; line++) art += words(5, 9.5 + line * 4.3, 39, 2.4, 11 + line * 3);
    art += '</g>';
    art += '<g fill="#2f2f37">';
    for (let line = 0; line < 4; line++) art += words(51, 9.5 + line * 4.3, 44, 2.8, 23 + line * 5);
    art += '</g>';
    art += '<rect x="0" y="29" width="100" height="1.6" fill="#1b1b20"/>';

    // reference line, barcode, and the carrier mark with its service square
    art += '<g fill="#3a3a43">' + words(5, 33, 44, 2.4, 41) + '</g>';
    art += '<g fill="#1b1b20">' + barcode(5, 38, 60, 21, 57, 40) + '</g>';
    art += '<g fill="#2b2b33">' + words(70, 32, 17, 4, 61) + '</g>';
    art += '<rect x="88" y="32" width="7" height="4" rx="1" fill="#f2751f"/>';
    art += '<g fill="#8b8b95">' + words(70, 38, 14, 2, 67) + '</g>';
    art += '<rect x="72" y="42" width="22" height="20" rx="1" fill="#ffffff" stroke="#1b1b20" stroke-width="1.4"/>';
    art += '<rect x="77" y="46" width="12" height="12" rx="1" fill="#1b1b20"/>';
    art += '<rect x="96.5" y="40" width="1.6" height="22" fill="#c2bcb2"/>';
    art += '<rect x="0" y="63.5" width="100" height="1.6" fill="#1b1b20"/>';

    // tracking line
    art += '<g fill="#22222a">' + words(22, 67, 56, 3.4, 71) + '</g>';
    art += '<g fill="#9a9aa4">' + words(18, 72.5, 64, 1.8, 73) + '</g>';
    art += '<rect x="0" y="77" width="100" height="0.9" fill="#c2bcb2"/>';

    // delivery block, with the service panel boxed off on the right
    art += '<g fill="#8b8b95">' + words(5, 80, 40, 1.8, 79) + '</g>';
    art += '<g fill="#22222a">' + words(5, 84.5, 30, 3, 83) + '</g>';
    art += '<g fill="#2f2f37">';
    for (let line = 0; line < 3; line++) art += words(9, 90 + line * 4.4, 48, 2.6, 89 + line * 7);
    art += '</g>';
    art += '<rect x="63" y="80" width="32" height="23" rx="1.5" fill="#ffffff" stroke="#1b1b20" stroke-width="1"/>';
    art += '<g fill="#4a4a54">';
    for (let line = 0; line < 4; line++) art += words(67, 83.5 + line * 4.6, 24, 2.2, 97 + line * 11);
    art += '</g>';

    art += '<rect x="0" y="105" width="100" height="1.6" fill="#1b1b20"/>';
    art += '<g fill="#22222a">' + words(24, 108.5, 52, 3.2, 113) + '</g>';

    // the big one at the foot, with a digit strip under it
    art += '<g fill="#1b1b20">' + barcode(5, 114, 90, 20, 127, 48) + '</g>';
    art += '<g fill="#22222a">' + words(14, 136, 72, 2.8, 131) + '</g>';

    return art;
  }

  /* The black-and-white FRAGILE sticker: the glass on its white panel at the
     left, the three handling marks and the two lines of type at the right,
     all as rects, since at this size type is texture. Art space 100 by 55. */
  function fragileLabel() {
    let art = '<rect x="0" y="0" width="100" height="55" rx="4" fill="#111"/>';
    art += '<rect x="2" y="2" width="96" height="51" rx="3" fill="none" stroke="#fff" stroke-width="1.2"/>';
    // the glass panel
    art += '<rect x="6" y="6" width="27" height="43" rx="2" fill="#fff"/>';
    art += '<path d="M12 11h15l-1.5 9a6 6 0 0 1-12 0Z" fill="#111"/>';
    art += '<rect x="18.6" y="26" width="1.8" height="14" fill="#111"/>';
    art += '<rect x="13" y="40" width="13" height="2.4" rx="1.2" fill="#111"/>';
    // handling marks
    art += '<g fill="#fff">';
